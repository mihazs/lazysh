name: Verified stable tag

on:
  push:
    branches: [main]
    # Every version transition rewrites this version-derived file (release consistency rejects
    # any other content), so ordinary main pushes never queue release work. Admission in
    # source-build still decides; a missed push can be repeated by an ordinary main dispatch.
    paths: [apps/client/android-version.properties]
  workflow_dispatch:
    inputs:
      initial:
        description: Publish the allowlisted current version without consuming pending Changesets
        type: boolean
        default: false
      expected-source-sha:
        description: Required exact main event SHA for initial publication only
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: verified-stable-tag-${{ github.sha }}
  cancel-in-progress: false

env:
  LAZYSH_RELEASE_INITIAL: ${{ inputs.initial || false }}
  LAZYSH_RELEASE_EXPECTED_SHA: ${{ inputs.expected-source-sha || '' }}

# Two runner-queue entries on the critical path: the admitted source build and the platform
# installation builds start together, then one job aggregates, tags and publishes.
jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      enabled: ${{ steps.prepare.outputs.enabled }}
    env:
      BUILD_CONTAINER: lazysh-fdroid-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - &checkout-candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &release-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check committed policy and exact main publication candidate
        id: prepare
        env:
          LAZYSH_RELEASE_DIRECTORY: ${{ runner.temp }}/fdroid-release
        run: |
          mkdir -p "$LAZYSH_RELEASE_DIRECTORY"
          cp -R fdroid/. "$LAZYSH_RELEASE_DIRECTORY/"
          bun .changeset/release-tag.ts prepare
      - name: Reclaim unused host toolchains for container build
        if: &admitted steps.prepare.outputs.enabled == 'true'
        run: |
          df -h /
          # The pinned container supplies build toolchains; these host SDKs only consume disk.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Provision owned official buildserver container
        if: *admitted
        run: |
          docker run --detach --name "$BUILD_CONTAINER" --user vagrant \
            --env ANDROID_HOME=/opt/android-sdk \
            --volume "$RUNNER_TEMP/fdroid-release:/workspace:rw" \
            registry.gitlab.com/fdroid/fdroidserver@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac sleep infinity
          provisioning=$(bun .changeset/release-tag.ts provision)
          # Bound every container apt run, including the reviewed recipe's, against stalled mirrors.
          docker exec --interactive --user root "$BUILD_CONTAINER" sh -s -- --no-update < .github/scripts/apt-install.sh
          docker exec --user root "$BUILD_CONTAINER" bash -euo pipefail -c "$provisioning"
          docker exec --interactive --user root "$BUILD_CONTAINER" sh -s -- --no-update python3-venv < .github/scripts/apt-install.sh
          docker exec --user root "$BUILD_CONTAINER" chown -R vagrant:vagrant /workspace
          docker exec "$BUILD_CONTAINER" bash -euo pipefail -c '
            python3 -m venv /home/vagrant/fdroid-tools
            /home/vagrant/fdroid-tools/bin/pip install fdroidserver==2.4.5
            sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmdline-tools;latest"
          '
      - name: Source scan exact candidate, then build with binary scans
        if: *admitted
        env: &version-code
          VERSION_CODE: ${{ steps.prepare.outputs.versionCode }}
        run: |
          docker exec --workdir /workspace "$BUILD_CONTAINER" /home/vagrant/fdroid-tools/bin/fdroid readmeta
          docker exec --workdir /workspace "$BUILD_CONTAINER" /home/vagrant/fdroid-tools/bin/fdroid lint app.lazysh.client
          docker exec --workdir /workspace "$BUILD_CONTAINER" /home/vagrant/fdroid-tools/bin/fdroid scanner --exit-code --json "app.lazysh.client:$VERSION_CODE" > "$RUNNER_TEMP/source-scan.json"
          bun .changeset/release-tag.ts scan "$RUNNER_TEMP/source-scan.json" "$VERSION_CODE"
          docker exec --workdir /workspace --env CARGO_BUILD_JOBS=4 --env CMAKE_BUILD_PARALLEL_LEVEL=4 "$BUILD_CONTAINER" \
            /home/vagrant/fdroid-tools/bin/fdroid build --test --stop --scan-binary "app.lazysh.client:$VERSION_CODE"
      - name: Inspect real unsigned release identity and Google-free payload
        if: *admitted
        env: *version-code
        run: |
          docker exec --workdir /workspace/build/app.lazysh.client \
            --env LAZYSH_ANDROID_PUSH_VARIANT=fdroid \
            --env LAZYSH_ANDROID_PUSH_CONFIGURATION=universalReleaseRuntimeClasspath \
            --env LAZYSH_ANDROID_PUSH_APK="/workspace/tmp/app.lazysh.client_$VERSION_CODE.apk" \
            "$BUILD_CONTAINER" /home/vagrant/.local/share/lazysh-fdroid/bun-linux-x64-baseline/bun test tests/android-push-artifact.test.ts
      - name: Retain bounded source and APK receipts
        if: &admitted-always always() && steps.prepare.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-tag-build-receipts
          path: |
            ${{ runner.temp }}/source-scan.json
            ${{ runner.temp }}/fdroid-release/metadata/app.lazysh.client.yml
            ${{ runner.temp }}/fdroid-release/logs
            ${{ runner.temp }}/fdroid-release/build/app.lazysh.client/apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/push-artifact/fdroid.json
      - name: Remove owned container
        if: *admitted-always
        run: docker rm --force "$BUILD_CONTAINER"

  # Platform builds start with the source build instead of after a separate admission job.
  # They hold contents-read tokens, bind the exact trusted main event SHA and produce private
  # same-run artifacts; nothing they build is public unless `publish` admits it below.
  artifacts:
    uses: ./.github/workflows/release-artifacts.yml
    with:
      initial: ${{ inputs.initial || false }}
    secrets: inherit

  # A GITHUB_TOKEN may not write a ref or release for a commit whose workflow files match no branch
  # tip, and the API reports that only as a bare 403. Main usually moves on to other workflow changes
  # while the builds run, so a branch at the exact candidate is created now, while it is still main's
  # tip, and `publish` removes it after publication (docs/release-tag-gate.md, Ref writes and workflow files).
  reserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - *checkout-candidate
      - *release-bun
      - name: Reserve the exact candidate commit as a branch tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .changeset/release-tag.ts reserve

  publish:
    needs: [source-build, artifacts, reserve]
    if: needs.source-build.outputs.enabled == 'true' && needs.source-build.result == 'success' && needs.artifacts.result == 'success' && needs.reserve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - *checkout-candidate
      - *release-bun
      # Runs before any step receives the write token; its last check reverifies every byte.
      - name: Aggregate and verify every same-run installation file
        uses: ./.github/actions/release-aggregate
        with:
          initial: ${{ inputs.initial || false }}
      - name: Recheck candidate and create only its stable ref
        env:
          GH_TOKEN: ${{ github.token }}
          LAZYSH_RELEASE_BUILD_RESULT: ${{ needs.source-build.result }}
        run: bun .changeset/release-tag.ts tag
      - name: Publish only the complete verified installation set
        env:
          GH_TOKEN: ${{ github.token }}
          LAZYSH_RELEASE_BUILD_RESULT: success
        run: bun .changeset/release-publish.ts "$RUNNER_TEMP/verified-release"
