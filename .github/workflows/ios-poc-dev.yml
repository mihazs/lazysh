name: ios-poc-dev
# TEMPORARY: runs only the surface composition proof of concept on this branch. Removed before the pull request is final.
on:
  push:
    branches: [test/ios-mtkview-composition-poc]
permissions:
  contents: read
env:
  MOON_TOOLCHAIN_FORCE_GLOBALS: 'true'
  MOON_BASE: HEAD
  MOON_HEAD: HEAD
jobs:
  poc:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - run: bun install --frozen-lockfile
      - run: xcodebuild -version
      - run: bunx moon run client:init-ios
      - name: Create simulator
        run: |
          APPLE_STATUS_SIMULATOR_ID="$(xcrun simctl create lazysh-poc-ci com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro)"
          echo "APPLE_STATUS_SIMULATOR_ID=$APPLE_STATUS_SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl list runtimes | tail -5
      - name: Run the proof of concept
        id: poc
        env:
          TEST_RUNNER_LAZYSH_SURFACE_POC_RESULTS: ${{ runner.temp }}/lazysh-surface-poc.jsonl
        run: |
          : > "$TEST_RUNNER_LAZYSH_SURFACE_POC_RESULTS"
          bun run test:ios-surface-poc
      - name: Print records
        if: always()
        run: cat "$RUNNER_TEMP/lazysh-surface-poc.jsonl" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-poc
          path: |
            apps/client/src-tauri/gen/apple/surface-poc-ui.xcresult
            ${{ runner.temp }}/lazysh-surface-poc.jsonl
          if-no-files-found: warn
