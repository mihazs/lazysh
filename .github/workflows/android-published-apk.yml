name: Published Android ARM64 APK smoke

on:
  pull_request:
    paths:
      - .github/workflows/android-published-apk.yml
      - apps/client/src-tauri/gen/android/published-acceptance/**
      - tests/android-published*.test.ts
      - tests/support/androidPublished*.ts
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to verify without modifying it
        required: true
        default: v0.23.0
        type: string

permissions:
  contents: read

jobs:
  translated-apk:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        flavor: [google, foss]
    env:
      ANDROID_SERIAL: emulator-5580
      PUBLISHED_RELEASE_TAG: ${{ inputs.tag || 'v0.23.0' }}
      PUBLISHED_FLAVOR: ${{ matrix.flavor }}
      ANDROID_SIGNER_SHA256: f59e1e1286ea6d9b5793e34239040e1c370fb2aaaada06021bba6e7d160c7d8c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: android-actions/setup-android@v4
      - run: bun install --frozen-lockfile
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify public bytes and absent owned AVD
        run: |
          printf 'LAZYSH_ANDROID_QR_EMULATOR_PID_FILE=%s/lazysh-published-emulator.pid\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          bun tests/support/androidPublished.ts prepare
      - name: Build only the external self-instrumenting driver
        run: |
          driver=apps/client/src-tauri/gen/android/published-acceptance
          wrapper=apps/client/src-tauri/gen/android/gradlew
          "$wrapper" -p "$driver" assembleDebug --dry-run --no-daemon > "$RUNNER_TEMP/published-driver-tasks.txt"
          if rg -i 'rust|:app:' "$RUNNER_TEMP/published-driver-tasks.txt"; then
            exit 1
          fi
          "$wrapper" -p "$driver" assembleDebug --no-daemon
      - name: Grant this owned VM access to KVM
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
      - name: Exercise exact public ARM64 APK through translation
        uses: mihazs/lazysh-android-emulator-runner@46beb5d59b664ea61462125a023549a5a7b0418b
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: lazysh-runtime-api36
          emulator-port: 5580
          cores: 4
          ram-size: 3072M
          emulator-build: 16428233
          emulator-boot-timeout: 300
          unlock-screen: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -accel on -camera-back imagefile:${{ github.workspace }}/apps/client/src-tauri/fixtures/theme-qr-camera-feed.png -camera-front none -qemu -pidfile ${{ env.LAZYSH_ANDROID_QR_EMULATOR_PID_FILE }}
          script: bun tests/support/androidPublished.ts run
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: published-android-${{ matrix.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lazysh-published-android/results/
          if-no-files-found: warn
