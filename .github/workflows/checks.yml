name: checks

on:
  pull_request:
  push:
    branches: [main]
  # Nightly device run: native-changes.sh maps this event to the Appium jobs alone, and client and agent skip it.
  schedule:
    - cron: '41 3 * * *'
  # Manual run of named areas only (default: the macOS and iOS terminal core jobs, which main pushes rarely finish).
  workflow_dispatch:
    inputs:
      areas:
        description: Space-separated native-changes.sh areas to run, nothing else
        default: terminal_apple

permissions:
  contents: read

env:
  MOON_TOOLCHAIN_FORCE_GLOBALS: 'true'
  # Shallow jobs have no base branch to diff, and `moon run` on a pull request would fail resolving it.
  # Only the two `moon ci` steps need changed files; they override MOON_BASE with the pull request base.
  MOON_BASE: HEAD
  MOON_HEAD: HEAD

# A newer pull request push supersedes its older checks. A running main run is never cancelled,
# but GitHub keeps one pending run per group and cancels older pending ones, so a busy trunk does
# not get a complete run per commit here: main-verdict.yml gives every main commit a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a pull request, `changes` selects the native job groups its paths can affect and then
  # runs a fast static gate; every native job needs it, so a PR that fails formatting, type
  # checks or the CI structure tests never queues emulator, macOS or Windows work on the
  # account's few hosted runners. client and agent always run. Pushes to main skip the gate
  # and run every job with the full matrix. Mapping and job table: CONTRIBUTING.md.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      client: ${{ steps.paths.outputs.client }}
      companion: ${{ steps.paths.outputs.companion }}
      herdr: ${{ steps.paths.outputs.herdr }}
      terminal_runtime: ${{ steps.paths.outputs.terminal_runtime }}
      terminal_bridge: ${{ steps.paths.outputs.terminal_bridge }}
      terminal_windows: ${{ steps.paths.outputs.terminal_windows }}
      linux: ${{ steps.paths.outputs.linux }}
      linux_runtimes: ${{ steps.paths.outputs.linux_runtimes }}
      desktop: ${{ steps.paths.outputs.desktop }}
      android: ${{ steps.paths.outputs.android }}
      android_runtime: ${{ steps.paths.outputs.android_runtime }}
      android_terminal_core: ${{ steps.paths.outputs.android_terminal_core }}
      android_terminal_session: ${{ steps.paths.outputs.android_terminal_session }}
      android_release_native: ${{ steps.paths.outputs.android_release_native }}
      android_mosh: ${{ steps.paths.outputs.android_mosh }}
      android_herdr: ${{ steps.paths.outputs.android_herdr }}
      android_appium: ${{ steps.paths.outputs.android_appium }}
      android_appium_quarantine: ${{ steps.paths.outputs.android_appium_quarantine }}
      android_auxiliary: ${{ steps.paths.outputs.android_auxiliary }}
      android_ntfy: ${{ steps.paths.outputs.android_ntfy }}
      android_gotify: ${{ steps.paths.outputs.android_gotify }}
      ios: ${{ steps.paths.outputs.ios }}
      ntfy_variants: ${{ steps.paths.outputs.ntfy_variants }}
      native: ${{ steps.paths.outputs.native }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
      terminal_perf: ${{ steps.paths.outputs.terminal_perf }}
      terminal_macos: ${{ steps.paths.outputs.terminal_macos }}
      linux_surface: ${{ steps.paths.outputs.linux_surface }}
      terminal_ios: ${{ steps.paths.outputs.terminal_ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # native-changes.sh asks the moon project graph (moon-areas.mjs) which projects a pull request touches.
      - name: Set up Bun for the moon project graph
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-bun
      - name: Install the workspace for the moon project graph
        if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          AREAS: ${{ inputs.areas }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh .github/scripts/native-changes.sh | tee -a "$GITHUB_OUTPUT"
      - name: Set up rustfmt for the fast gate
        if: &fast-gate github.event_name == 'pull_request' && steps.paths.outputs.native == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fail fast on formatting, hook, CI structure and client type errors
        if: *fast-gate
        run: |
          cargo fmt --all -- --check
          bun run test:hooks
          bun run test:ci
          bun run --cwd apps/client check

  companion-candidates:
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    uses: ./.github/workflows/companion-artifacts.yml

  client:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      # moon derives the pull request's affected tasks from the merge base, so it needs history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - &source-bun
        uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # The same classification the `changes` job makes. The client job has no `needs` so it never waits for it, and the browser
      # suites below (about 50 of this job's 52 minutes) run only when the diff can reach the client: a documentation, release,
      # companion-only or Android-only pull request keeps the job, and so the required check, without them. An unreadable range selects them.
      - name: Select the browser end-to-end suites
        id: e2e
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "client=$(sh .github/scripts/native-changes.sh | sed -n 's/^client=//p' | grep -x -e true -e false || echo true)" >> "$GITHUB_OUTPUT"
      - run: bun run test:hooks
      - run: bun run test:ci
      # Pull requests run only the tasks the diff can affect, followed through project relations
      # (-g). Pushes to main always run everything: it is the full parity evidence.
      - name: Build, type-check and test the client (affected tasks)
        if: github.event_name == 'pull_request'
        env:
          MOON_BASE: origin/${{ github.base_ref }}
        run: bunx moon ci client:build client:check client:test client:check-mobile-e2e client:lint-mobile-e2e client:test-mobile-e2e-unit -g -c 1
      - name: Build, type-check and test the client
        if: github.event_name != 'pull_request'
        run: bunx moon run client:build client:check client:test client:check-mobile-e2e client:lint-mobile-e2e client:test-mobile-e2e-unit -c 1
      # No browser cache: a hit (restore 2 to 7 s, install 8 to 13 s) was no faster than a miss (install 8 to 17 s),
      # and the entry took 293 MB of the 10 GB budget (docs/architecture/build-caching.md).
      # Playwright runs its own apt-get; bound it and refresh the lists past a stalled mirror first.
      # tmux feeds e2e/tmux-clipboard.spec.ts; with CI set that spec fails instead of skipping without it.
      - run: sudo sh .github/scripts/apt-install.sh tmux
      - &playwright-chromium
        id: playwright-chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/client
      # The xterm arm of the terminal backend matrix (apps/client/e2e/fixtures/terminalBackend.ts): the six named terminal specs ask
      # for xterm.js through the developer override, and a terminal of another backend fails them.
      - if: steps.e2e.outputs.client == 'true'
        run: bunx moon run client:test-e2e
        env:
          LAZYSH_E2E_TERMINAL_BACKEND: xterm
      # The native arm: skipped, with the backend registry's reason in the log, until the native backend is registered; then it runs.
      - if: steps.e2e.outputs.client == 'true'
        run: bun run test:e2e:terminal
        working-directory: apps/client
        env:
          LAZYSH_E2E_TERMINAL_BACKEND: native
      # The kill switch (#1342): a production bundle built with LAZYSH_NATIVE_TERMINAL=off keeps every new session on xterm.js.
      - if: steps.e2e.outputs.client == 'true'
        run: bun run test:e2e:kill-switch
        working-directory: apps/client

  agent:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - *source-bun
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Pull requests restore main's caches but never save their own: PR-scoped entries are
      # unreadable by main and other PRs, and they evicted main's caches from the 10 GB budget.
      - uses: Swatinem/rust-cache@v2
        with: &rust-cache-main
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      - name: Install bounded storage observation tool and the tmux the pane-server case runs
        run: sudo sh .github/scripts/apt-install.sh strace tmux
      - name: Check companion and service packages
        id: agent-checks
        env:
          LAZYSH_TEST_STORAGE_TRACE_DIR: ${{ runner.temp }}/lazysh-storage-traces
          # The hosted image's Firefox (160 at the time of writing) is the one the host browser tests drive; without
          # this a missing or too old Firefox would skip those tests instead of failing them.
          LAZYSH_REQUIRE_FIREFOX: "1"
          MOON_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
        run: |
          # Pull requests run the affected crates and their dependencies (-g); native-linux covers dependents. Main runs all.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then verb='ci -g --downstream none'; else verb=run; fi
          # No check-rust here: lint (clippy --all-targets, same features, -D warnings) compiles everything it checks and fails on any
          # compile error, and a `cargo check` beside it rebuilds every workspace crate (verdict-agent in main-verdict.yml still runs it alone).
          bunx moon $verb '#companion:build' '#companion:test-rust' '#companion:test-hooks' '#companion:lint' '#companion:format-check'
      - name: Upload owned concurrent hook syscall excerpts
        if: ${{ !cancelled() && (steps.agent-checks.outcome == 'success' || steps.agent-checks.outcome == 'failure') }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-storage-syscalls
          path: ${{ runner.temp }}/lazysh-storage-traces
          if-no-files-found: warn
      - name: Keep storage contention budgets beside a simulated slow shared volume
        if: ${{ !cancelled() && (steps.agent-checks.outcome == 'success' || steps.agent-checks.outcome == 'failure') }}
        timeout-minutes: 5
        run: cargo test --locked --package lazysh-agent --test cli contention_cases_keep_their_budget_beside_slow_shared_flushes -- --ignored --exact
      - name: Measure hosted SQLite phases (diagnostic, no injected delay)
        if: ${{ !cancelled() && (steps.agent-checks.outcome == 'success' || steps.agent-checks.outcome == 'failure') }}
        timeout-minutes: 2
        run: cargo test --locked --package lazysh-agent --lib storage_diagnostics::profile_storage_commit_phases -- --ignored --exact --nocapture
      - name: Name the server of a hook run in a real named tmux pane
        if: ${{ !cancelled() && (steps.agent-checks.outcome == 'success' || steps.agent-checks.outcome == 'failure') }}
        timeout-minutes: 3
        run: cargo test --locked --package lazysh-agent --test pane_server a_hook_inside_a_real_named_tmux_server_reports_that_server_and_pane -- --ignored --exact

  # This optional product workspace is deliberately outside root Cargo/Turbo builds.
  # Build outside the checkout: Zig 0.16.0 writes source-local zig-pkg dependencies.
  # Source/build contract: packages/herdr-upstream/PROVENANCE.md and ../herdr-guard/README.md.
  herdr-native:
    needs: changes
    if: needs.changes.outputs.herdr == 'true'
    # Match the oldest native consumer's glibc floor.
    runs-on: ubuntu-22.04
    outputs:
      guarded-sha256: ${{ steps.guarded-artifact.outputs.sha256 }}
      stock-sha256: ${{ steps.stock-artifact.outputs.sha256 }}
      guarded-id: ${{ steps.guarded-upload.outputs.artifact-id }}
      stock-id: ${{ steps.stock-upload.outputs.artifact-id }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      # The one feature set the managed release build, its acceptance and its receipt share.
      HERDR_FEATURES: lazysh-managed
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - &herdr-task-paths
        name: Set the task-owned external source and target paths (the Zig paths come from the ghostty-zig action)
        run: |
          printf '%s\n' \
            "HERDR_CI_ROOT=$RUNNER_TEMP/lazysh-herdr-native" \
            "CARGO_TARGET_DIR=$RUNNER_TEMP/lazysh-herdr-native/target" >> "$GITHUB_ENV"
      - name: Verify original source exclusions and copy both guarded siblings
        run: |
          bun test tests/herdr-source.test.ts
          mkdir -p "$HERDR_CI_ROOT/common/src"
          cp -a packages/herdr-upstream "$HERDR_CI_ROOT/herdr-upstream"
          cp -a packages/herdr-guard "$HERDR_CI_ROOT/herdr-guard"
          cp -a packages/terminal-runtime "$HERDR_CI_ROOT/terminal-runtime"
          cp -a packages/terminal-renderer-wgpu "$HERDR_CI_ROOT/terminal-renderer-wgpu"
          cp packages/common/src/{hex_digest,guarded_target}.rs "$HERDR_CI_ROOT/common/src/"
          # The core replays the Mosh frames the client's e2e suite also uses; one file, two readers.
          cp apps/client/e2e/fixtures/mosh-resize-frames.json "$HERDR_CI_ROOT/mosh-resize-frames.json"
          # Likewise the platform key cases: the client suite checks xterm.js and the key mapping against them, the core replays them.
          cp -a apps/client/e2e/fixtures/platform-keys "$HERDR_CI_ROOT/platform-keys"
          diff --recursive --brief --no-dereference packages/herdr-upstream "$HERDR_CI_ROOT/herdr-upstream"
          diff --recursive --brief --no-dereference packages/herdr-guard "$HERDR_CI_ROOT/herdr-guard"
          diff --recursive --brief --no-dereference packages/terminal-runtime "$HERDR_CI_ROOT/terminal-runtime"
          diff --recursive --brief --no-dereference packages/terminal-renderer-wgpu "$HERDR_CI_ROOT/terminal-renderer-wgpu"
          diff packages/common/src/hex_digest.rs "$HERDR_CI_ROOT/common/src/hex_digest.rs"
          diff packages/common/src/guarded_target.rs "$HERDR_CI_ROOT/common/src/guarded_target.rs"
      - &rust-release-manifest
        name: Check the pinned official Rust release manifest
        # Receipt: https://static.rust-lang.org/dist/channel-rust-1.96.1.toml.sha256
        # Rustup independently verifies the component archives against this release manifest.
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 https://static.rust-lang.org/dist/channel-rust-1.96.1.toml -o "$HERDR_CI_ROOT/channel-rust-1.96.1.toml"
          printf '%s  %s\n' '87eb76c53073e72b766083bed5530820694253b832a762d8385bda5759f03975' "$HERDR_CI_ROOT/channel-rust-1.96.1.toml" | sha256sum --check --strict
      - &rust-1-96-1
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      # Only crate downloads, which Cargo checks against Herdr's Cargo.lock; both Herdr targets
      # still compile from source in task-owned directories.
      - &herdr-cargo-downloads
        name: Restore Herdr's locked crate downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: herdr-cargo-downloads-${{ runner.os }}-${{ hashFiles('packages/herdr-upstream/Cargo.lock') }}
      # Restored files are reused only when they match their pin, and each step still checks it.
      - &pinned-download-cache
        name: Restore pinned fixture downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lazysh-pinned-downloads
          key: lazysh-pinned-downloads-${{ github.job }}-v2-zig70e49664-tmux551ab8de-tmux38e79c699c-mosh872e4b13-et3065d282-zellij40bcc2e0-agent1280d8f0bab9-agent1334b37f2b67
      - &ghostty-zig
        uses: ./.github/actions/ghostty-zig
      - name: Exercise real local archive rejection controls
        env:
          LAZYSH_HERDR_ARCHIVE_FIXTURES: "1"
        run: bun test tests/herdr-source.test.ts
      - name: Build the real optional Herdr binary
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: sh "$GITHUB_WORKSPACE/.github/scripts/retry-zig-fetch.sh" cargo +1.96.1 build --locked
      # The dependency set of the managed executable: the same target and feature the release build uses, from the
      # crates and Zig packages this build just fetched. Fails when anything it would ship has no recorded license.
      - name: Generate and verify the notice inventory of the managed Herdr executable
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        env:
          HERDR_TARGET: x86_64-unknown-linux-gnu
          HERDR_FEATURES: lazysh-managed
        run: |
          cargo +1.96.1 metadata --locked --format-version 1 --filter-platform "$HERDR_TARGET" --features "$HERDR_FEATURES" > "$HERDR_CI_ROOT/cargo-metadata.json"
          bun "$GITHUB_WORKSPACE/.github/scripts/herdr-notices.ts" --repo "$GITHUB_WORKSPACE" --checkout "$GITHUB_SHA" \
            --metadata "$HERDR_CI_ROOT/cargo-metadata.json" --zig-packages "$PWD/vendor/libghostty-vt/zig-pkg" \
            --target "$HERDR_TARGET" --features "$HERDR_FEATURES" --out "$HERDR_CI_ROOT/notices"
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-notices-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lazysh-herdr-native/notices/
          if-no-files-found: error
          retention-days: 14
      - name: Exercise guarded protocol, API ownership and runtime identity
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: |
          cargo +1.96.1 test --locked --bin herdr guarded_input::
          cargo +1.96.1 test --locked --bin herdr terminal::runtime_registry::guard_identity_tests::
      - name: Build the owned Cargo SSH observation fixture from the compared source
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: cargo +1.96.1 build --locked --example guarded_ssh_fixture
      - name: Exercise owned real Herdr servers, client, PTYs and both cutoffs
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: |
          export HERDR_GUARD_SSH_FIXTURE="$CARGO_TARGET_DIR/debug/examples/guarded_ssh_fixture"
          cargo +1.96.1 test --locked --test guarded_input acceptance::
      - name: Preserve selected stock attachment and endpoint regressions
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: |
          cargo +1.96.1 test --locked --bin herdr client::handshake::
          cargo +1.96.1 test --locked --bin herdr server::clients::
          cargo +1.96.1 test --locked --bin herdr protocol::endpoint::
          cargo +1.96.1 test --locked --bin herdr server::client_transport::
      - name: Compare the compiled protocol schema with the committed artifact
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: |
          unset HERDR_UPDATE_API_SCHEMA
          cargo +1.96.1 test --locked --bin herdr api::schema::tests::generated_protocol_schema_artifact_is_current -- --exact

      # tests/programs runs these on a pty with the core as their terminal; with CI set a missing one fails the run.
      - name: Install the programs the terminal runtime tests run on a pty
        run: sudo sh .github/scripts/apt-install.sh tmux vim-nox

      # Same herdr-upstream copy, Zig, admitted archives and Zig caches as above; only the Cargo build of the binding repeats.
      - name: Test the shared terminal runtime against the same libghostty-vt build
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-runtime
        env: &terminal-runtime-fixtures
          LAZYSH_MOSH_FIXTURE: ${{ runner.temp }}/lazysh-herdr-native/mosh-resize-frames.json
          LAZYSH_PLATFORM_KEYS_FIXTURES: ${{ runner.temp }}/lazysh-herdr-native/platform-keys
          # The guarded Herdr built above, as the program tests/programs starts.
          LAZYSH_TEST_HERDR: ${{ runner.temp }}/lazysh-herdr-native/target/debug/herdr
        run: |
          cargo +1.96.1 fmt --check
          cargo +1.96.1 clippy --locked --all-targets -- -D warnings
          cargo +1.96.1 test --locked

      # G1 (#1305): the client's adapter contract suite, unchanged, over the real core. The runtime's stdio harness is an
      # example of the crate tested above (same Zig, same libghostty-vt build); vitest drives NativeTerminalAdapter over it.
      - name: Build the runtime's stdio harness for the adapter contract suite
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-runtime
        run: cargo +1.96.1 build --locked --example control_stdio
      - name: Run the adapter contract suite over the real core
        env:
          LAZYSH_CONTROL_STDIO: ${{ runner.temp }}/lazysh-herdr-native/target/debug/examples/control_stdio
        run: |
          bun install --frozen-lockfile
          bun run --cwd apps/client vitest run src/nativeTerminalAdapter.realCore.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/real-core.json"
          # The file skips itself without the harness: a run that skipped is not a pass.
          jq -e '.numPassedTests > 0 and .numPendingTests == 0 and .numFailedTests == 0' "$RUNNER_TEMP/real-core.json"

      # The wgpu renderer has its own lock file and nested workspace. The runner has no GPU: its tests run
      # on Mesa's software Vulkan (lavapipe) or software OpenGL, which the test policy accepts and the
      # shipping policy refuses. They compare pixels with the CPU reference renderer and the goldens.
      - name: Install a software Vulkan driver for the renderer tests
        if: needs.changes.outputs.terminal_runtime == 'true'
        run: sudo sh .github/scripts/apt-install.sh mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri
      - name: Test the wgpu renderer against the runtime and the reference renderer
        if: needs.changes.outputs.terminal_runtime == 'true'
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-renderer-wgpu
        run: |
          cargo +1.96.1 fmt --check
          cargo +1.96.1 clippy --locked --all-targets -- -D warnings
          cargo +1.96.1 test --locked

      - name: Retain the exact guarded binary for native SSH interoperability
        id: guarded-artifact
        env:
          HERDR_ARTIFACT_DIRECTORY: guarded-artifact
        run: &herdr-artifact-retention |
          artifact="$HERDR_CI_ROOT/$HERDR_ARTIFACT_DIRECTORY"
          mkdir -p "$artifact"
          cp "$CARGO_TARGET_DIR/debug/herdr" "$artifact/herdr"
          printf 'sha256=%s\n' "$(sha256sum "$artifact/herdr" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: guarded-upload
        with:
          name: guarded-herdr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lazysh-herdr-native/guarded-artifact/herdr
          if-no-files-found: error
          retention-days: 3

      # Seal guarded bytes first; stock compiles into an independent Cargo target.
      - name: Download pinned original Herdr source
        id: stock-source-download
        env:
          HERDR_ARCHIVE_NAME: stock-source
          HERDR_ARCHIVE_URL: https://codeload.github.com/herdrdev/herdr/tar.gz/2ecf19a92fc3a7fff75b6ce3655ef04f4625ec01
        run: sh "$GITHUB_WORKSPACE/.github/scripts/herdr-archive.sh" download
      - name: Verify and extract original stock source
        id: stock-source
        run: |
          printf '%s  %s\n' 'cbd4354f1c44530d9f094c2797380208c50f19b4d6350b6e5206e220133c3168' "$HERDR_CI_ROOT/stock-source.tar.gz" | sha256sum --check --strict
          manifest="$GITHUB_WORKSPACE/packages/herdr-upstream/SOURCE-MANIFEST.sha256"
          printf '%s  %s\n' 'c303652ea2d310b78fdc9222cb30b405915890c0522239c9daf734591cb08e8a' "$manifest" | sha256sum --check --strict
          test "$(wc -l < "$manifest")" -eq 1843
          mkdir "$HERDR_CI_ROOT/stock-source"
          tar --extract --gzip --file "$HERDR_CI_ROOT/stock-source.tar.gz" --directory "$HERDR_CI_ROOT/stock-source" --strip-components=1 --no-same-owner --no-same-permissions
          cd "$HERDR_CI_ROOT/stock-source"
          sha256sum --check --quiet "$manifest"
          # Reuse only already hash-admitted generated Zig dependencies, never guarded application source.
          test ! -e vendor/libghostty-vt/zig-pkg
          test ! -L vendor/libghostty-vt/zig-pkg
          cp -aT "$HERDR_CI_ROOT/herdr-upstream/vendor/libghostty-vt/zig-pkg" vendor/libghostty-vt/zig-pkg
      # Both profiles of the same pinned source, each in its own Cargo profile directory: the debug executable is the one retained
      # below, and the release executable is the stock server users get, which the coexistence case runs beside too (#1938).
      - name: Build unchanged stock Herdr in the debug and release profiles and recheck every original file
        id: stock-build
        env:
          CARGO_TARGET_DIR: &stock-cargo-target ${{ runner.temp }}/lazysh-herdr-native/stock-target
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/lazysh-herdr-native/stock-target/zig-local
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/lazysh-herdr-native/stock-target/zig-global
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/stock-source
        run: |
          sh "$GITHUB_WORKSPACE/.github/scripts/retry-zig-fetch.sh" cargo +1.96.1 build --locked --bin herdr
          sh "$GITHUB_WORKSPACE/.github/scripts/retry-zig-fetch.sh" cargo +1.96.1 build --locked --release --bin herdr
          manifest="$GITHUB_WORKSPACE/packages/herdr-upstream/SOURCE-MANIFEST.sha256"
          printf '%s  %s\n' 'c303652ea2d310b78fdc9222cb30b405915890c0522239c9daf734591cb08e8a' "$manifest" | sha256sum --check --strict
          test "$(wc -l < "$manifest")" -eq 1843
          sha256sum --check --quiet "$manifest"
      - name: Retain independent stock executable
        id: stock-artifact
        env:
          CARGO_TARGET_DIR: *stock-cargo-target
          HERDR_ARTIFACT_DIRECTORY: stock-artifact
        run: *herdr-artifact-retention
      - name: Bind stock source and executable receipt
        env:
          STOCK_BINARY_SHA256: ${{ steps.stock-artifact.outputs.sha256 }}
        run: |
          cp "$HERDR_CI_ROOT/stock-source/LICENSE" "$HERDR_CI_ROOT/stock-artifact/LICENSE"
          printf '{"schemaVersion":1,"sourceCommit":"2ecf19a92fc3a7fff75b6ce3655ef04f4625ec01","archiveSha256":"cbd4354f1c44530d9f094c2797380208c50f19b4d6350b6e5206e220133c3168","manifestSha256":"c303652ea2d310b78fdc9222cb30b405915890c0522239c9daf734591cb08e8a","sourceFiles":1843,"binarySha256":"%s","checkout":"%s"}\n' "$STOCK_BINARY_SHA256" "$GITHUB_SHA" > "$HERDR_CI_ROOT/stock-artifact/source.json"
      - uses: actions/upload-artifact@v4
        id: stock-upload
        with:
          name: stock-herdr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lazysh-herdr-native/stock-artifact/
          if-no-files-found: error
          retention-days: 3
      # The managed derivative as it would ship (#1756): the release profile, built from the same copied pinned source.
      # Its own target profile leaves the sealed debug artifacts above untouched. The acceptance runs on the sealed bytes
      # below, so no separate debug managed run is needed. Linux x86-64 only until another host has native evidence.
      - name: Build the release-profile managed Herdr
        id: managed-build
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: sh "$GITHUB_WORKSPACE/.github/scripts/retry-zig-fetch.sh" cargo +1.96.1 build --locked --release --features "$HERDR_FEATURES" --bin herdr
      - name: Measure the libc floor and seal the managed executable with its receipt
        id: managed-receipt
        env:
          HERDR_SOURCE_COMMIT: 2ecf19a92fc3a7fff75b6ce3655ef04f4625ec01
        run: |
          artifact="$HERDR_CI_ROOT/managed-artifact"
          mkdir -p "$artifact"
          cp "$CARGO_TARGET_DIR/release/herdr" "$artifact/herdr"
          sh .github/scripts/herdr-release-receipt.sh "$artifact/herdr" packages/herdr-upstream/SOURCE-MANIFEST.sha256 "$artifact/receipt.json"
          cat "$artifact/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: managed-herdr-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lazysh-herdr-native/managed-artifact/
          if-no-files-found: error
          retention-days: 14
      # #1761, #1938: the acceptance runs on the sealed release bytes, never on a rebuild. Both stock namespaces (debug
      # `herdr-dev`, release `herdr`) share a host with the managed server of one session name, one HOME and XDG roots.
      - name: Exercise the acceptance and the coexistence case on the sealed managed executable
        id: managed-acceptance
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        env:
          STOCK_TARGET: *stock-cargo-target
        run: |
          sealed="$HERDR_CI_ROOT/managed-artifact"
          verify_sealed() { printf '%s  %s\n' "$(jq -er .binarySha256 "$sealed/receipt.json")" "$sealed/herdr" | sha256sum --check --strict; }
          verify_sealed
          export LAZYSH_TEST_HERDR_MANAGED="$sealed/herdr"
          export HERDR_GUARD_SSH_FIXTURE="$CARGO_TARGET_DIR/debug/examples/guarded_ssh_fixture"
          cargo +1.96.1 test --locked --release --features "$HERDR_FEATURES" --test guarded_input acceptance::
          # A renamed case must not turn the coexistence runs into a zero-test pass.
          cargo +1.96.1 test --locked --release --features "$HERDR_FEATURES" --test guarded_input managed_and_stock -- --list --ignored | grep -c ': test$' | grep -Fx 1
          for profile in debug:herdr-dev release:herdr; do
            LAZYSH_TEST_HERDR_STOCK="$STOCK_TARGET/${profile%%:*}/herdr" LAZYSH_TEST_HERDR_STOCK_NAMESPACE="${profile#*:}" \
              cargo +1.96.1 test --locked --release --features "$HERDR_FEATURES" --test guarded_input managed_and_stock -- --ignored
          done
          # Neither a case nor Cargo may have touched the sealed bytes.
          verify_sealed

      # The terminal runtime for Android, with the same admitted Zig, archives and caches as above. Last, because
      # nothing sealed above depends on it. Compiling and linking only: nothing runs on Android here.
      - name: Provision the pinned Android NDK
        if: needs.changes.outputs.terminal_runtime == 'true'
        uses: ./.github/actions/android-toolchains
      - name: Check and link the terminal runtime for Android arm64 and x86_64 with the pinned NDK
        id: terminal-android-target
        if: needs.changes.outputs.terminal_runtime == 'true'
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-runtime
        run: |
          rustup target add --toolchain 1.96.1 aarch64-linux-android x86_64-linux-android
          # The runner image presets ANDROID_NDK_HOME to its own NDK, which libghostty-vt's Zig build reads first.
          export ANDROID_NDK_HOME="$NDK_HOME"
          ndk_bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for abi in aarch64 x86_64; do
            triple="$abi-linux-android"
            # API 24 is the app's minSdkVersion: a libc symbol newer than that fails to link here as it would in the app.
            export "CARGO_TARGET_${abi^^}_LINUX_ANDROID_LINKER=$ndk_bin/${triple}24-clang"
            cargo +1.96.1 check --locked --target "$triple"
            cargo +1.96.1 test --locked --no-run --target "$triple"
          done

  # The regression gate of the native terminal core (#1341). It is a job of its own, not a step of
  # herdr-native, so a regression (or a flaky host) can never skip the jobs that consume herdr-native's
  # binaries, and the gate runs alone on its runner: nothing else competes for the CPU while it measures.
  # It repeats herdr-native's checksum-verified Zig provisioning by reusing those steps. Not a required check:
  # it runs on pushes to main and on a pull request that selects the terminal runtime area (native-changes.sh).
  terminal-perf:
    needs: changes
    if: needs.changes.outputs.terminal_perf == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - *herdr-task-paths
      - name: Copy the runtime and the Herdr sources it builds against
        run: |
          mkdir -p "$HERDR_CI_ROOT"
          cp -a packages/herdr-upstream "$HERDR_CI_ROOT/herdr-upstream"
          cp -a packages/terminal-runtime "$HERDR_CI_ROOT/terminal-runtime"
      - *rust-release-manifest
      - *rust-1-96-1
      - *herdr-cargo-downloads
      - *pinned-download-cache
      - *ghostty-zig
      - name: Build the gate in release mode
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-runtime
        run: sh "$GITHUB_WORKSPACE/.github/scripts/retry-zig-fetch.sh" cargo +1.96.1 build --release --locked --example perf_gate
      - name: Fail when a metric regressed beyond its limit
        run: |
          set -o pipefail
          "$CARGO_TARGET_DIR/release/examples/perf_gate" | tee "$RUNNER_TEMP/perf-gate.md"
          { echo '### Terminal runtime performance gate'; cat "$RUNNER_TEMP/perf-gate.md"; } >> "$GITHUB_STEP_SUMMARY"
      # Exit 1 is a failed gate; a crash exits differently and does not count as the gate working.
      - name: Prove the gate fails on an injected slowdown, injected allocations and no scrollback compaction
        run: |
          for mode in slow allocs nocompaction; do
            status=0
            "$CARGO_TARGET_DIR/release/examples/perf_gate" --inject "$mode" > "$RUNNER_TEMP/inject-$mode.md" || status=$?
            [ "$status" -eq 1 ] || { echo "::error::perf_gate --inject $mode exited $status, expected 1"; exit 1; }
            { echo "### Injected $mode regression (must fail)"; cat "$RUNNER_TEMP/inject-$mode.md"; } >> "$GITHUB_STEP_SUMMARY"
          done

  terminal-perf-verdict:
    needs: [changes, terminal-perf]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a valid terminal performance result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PERF_SELECTED: ${{ needs.changes.outputs.terminal_perf }}
          PERF_RESULT: ${{ needs.terminal-perf.result }}
        run: |
          case "$CHANGES_RESULT:$PERF_SELECTED:$PERF_RESULT" in
            success:false:skipped|success:true:success) exit 0 ;;
          esac
          echo "::error::Terminal performance gate could not pass (changes=$CHANGES_RESULT, selected=$PERF_SELECTED, benchmark=$PERF_RESULT)"
          exit 1

  # The terminal core and the wgpu renderer on Apple silicon (#1333). herdr-native and terminal-perf compile
  # them for Linux and Android only; here libghostty-vt is built by Zig against the runner's Apple SDK and
  # the core and renderer crates are built and tested for aarch64-apple-darwin, the renderer on Metal. The
  # runner's GPU is a virtual machine's: Metal runs, but nothing here says how a real Mac's GPU, Retina
  # display, IME or VoiceOver behave. Not a required check, so it runs on pushes to main only (native-changes.sh).
  # It reuses herdr-native's admitted archives and caches by alias; only the Zig tarball and the checksum
  # tools are macOS's own.
  terminal-macos:
    needs: changes
    if: needs.changes.outputs.terminal_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      # macOS has no sha256sum or timeout, which the aliased steps below use.
      - &macos-gnu-coreutils
        name: Install GNU coreutils for the checksum and timeout tools of the shared steps
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - *herdr-task-paths
      # terminal-ios copies the renderer too and does not build it: one step for both jobs.
      - &macos-copy-sources
        name: Copy the runtime, the renderer and the Herdr sources they build against
        run: |
          mkdir -p "$HERDR_CI_ROOT"
          cp -a packages/herdr-upstream packages/terminal-runtime packages/terminal-renderer-wgpu "$HERDR_CI_ROOT"
          # The same fixtures herdr-native replays.
          cp apps/client/e2e/fixtures/mosh-resize-frames.json "$HERDR_CI_ROOT/mosh-resize-frames.json"
          cp -a apps/client/e2e/fixtures/platform-keys "$HERDR_CI_ROOT/platform-keys"
      - *rust-release-manifest
      - *rust-1-96-1
      - name: Report the host and require Apple silicon with an Apple SDK
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version
          host=$(rustc +1.96.1 -vV | sed -n 's/^host: //p')
          [ "$host" = aarch64-apple-darwin ] || { echo "::error::the runner's Rust host is $host, expected aarch64-apple-darwin"; exit 1; }
      - *herdr-cargo-downloads
      - *pinned-download-cache
      - uses: ./.github/actions/ghostty-zig
        with:
          zig-target: aarch64-macos
          zig-sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
      - name: Build libghostty-vt and the runtime for aarch64-apple-darwin
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-runtime
        run: sh "$GITHUB_WORKSPACE/.github/scripts/retry-zig-fetch.sh" cargo +1.96.1 test --locked --no-run
      - name: Test the runtime on macOS
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-runtime
        env: *terminal-runtime-fixtures
        run: |
          cargo +1.96.1 clippy --locked --all-targets -- -D warnings
          cargo +1.96.1 test --locked --no-fail-fast
      # The renderer's tests fail without an adapter instead of skipping, and the Apple policy allows Metal alone.
      # Independent of the runtime's result, and without stopping at the first failing test file: one run reports every macOS failure.
      - name: Test the wgpu renderer on Metal
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-renderer-wgpu
        run: |
          cargo +1.96.1 clippy --locked --all-targets -- -D warnings
          cargo +1.96.1 test --locked --no-fail-fast
      - name: Report the Metal adapter the renderer ran on
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-renderer-wgpu
        run: cargo +1.96.1 test --locked --test frames -- --exact --nocapture on_apple_the_renderer_runs_on_metal

  # The Linux composition probe (#1331, gate G19): a native surface next to the WebKitGTK web view, read back as the
  # compositor's own pixels. Wayland runs in a headless sway (wlroots, pixman, no GPU) captured with grim, for wl_shm
  # buffers and for a wgpu Vulkan swapchain on Mesa's software driver (lavapipe), at scale 1 and 2; X11 runs on Xvfb and
  # is asserted to fail the overlap check, which is why the Linux default there stays xterm.js. Every check is exact.
  # The probe has no GPU or real input here (docs/architecture/linux-surface-composition-poc.md, "What this does not establish").
  native-linux-surface:
    needs: changes
    if: needs.changes.outputs.linux_surface == 'true'
    runs-on: ubuntu-24.04
    # The 24.04 runners' apt mirror can serve one package every few seconds (native-linux-runtimes spent 33 minutes in apt on
    # 2026-11-18, and this job's first two runs were cancelled mid-install), so the install is slimmed below and the budget is wide.
    timeout-minutes: 60
    env:
      # The runner restricts unprivileged user namespaces, which WebKitGTK's bubblewrap sandbox needs; the fixture page is ours.
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - run: sudo sh .github/scripts/apt-install.sh --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libwayland-dev sway grim mesa-vulkan-drivers libvulkan1 xvfb xdotool imagemagick python3-numpy python3-pil dbus-daemon
      # Pull requests restore main's entry and never save their own, like the other Rust caches.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/terminal-runtime/prototypes/linux-surface
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked
        working-directory: packages/terminal-runtime/prototypes/linux-surface
      - name: Run the probe's own checks under headless sway and Xvfb
        run: packages/terminal-runtime/prototypes/linux-surface/scripts/ci.sh "$RUNNER_TEMP/linux-surface"
      - name: Retain the compositor's screenshots of every step
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-linux-surface
          path: ${{ runner.temp }}/linux-surface
          if-no-files-found: warn
          retention-days: 7

  # The terminal core and its wgpu renderer on Windows (#1332). A Linux host has no MSVC headers for
  # libghostty-vt's Zig build, so this is the only place `x86_64-pc-windows-msvc` is built: Zig compiles the
  # library against the runner's MSVC and Windows SDK (the file LIBGHOSTTY_VT_WINDOWS_LIBC names), then both
  # crates run their own tests. The runner has no GPU: the renderer tests run on Direct3D 12 with WARP, the CPU
  # adapter that ships with Windows, which the test policy accepts and the shipping policy refuses.
  terminal-windows:
    needs: changes
    if: needs.changes.outputs.terminal_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The runner's Git converts line endings on checkout; the Zig sources, fixtures and goldens must be the bytes Linux builds.
      - name: Check out LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Set task-owned source, target and tool paths
        run: |
          root="$(cygpath -m "$RUNNER_TEMP")/lazysh-terminal-windows"
          printf '%s\n' \
            "HERDR_CI_ROOT=$root" \
            "CARGO_TARGET_DIR=$root/target" \
            "ZIG_LOCAL_CACHE_DIR=$root/zig-local" \
            "ZIG_GLOBAL_CACHE_DIR=$root/zig-global" \
            "ZIG=$root/zig-x86_64-windows-0.16.0/zig.exe" \
            "LIBGHOSTTY_VT_WINDOWS_LIBC=$root/windows-libc.txt" \
            "LAZYSH_CI_SCRIPTS=$(cygpath -m "$GITHUB_WORKSPACE")/.github/scripts" >> "$GITHUB_ENV"
      - name: Copy the runtime, the renderer and the Herdr sources they build against
        run: |
          mkdir -p "$HERDR_CI_ROOT"
          cp -a packages/herdr-upstream packages/terminal-runtime packages/terminal-renderer-wgpu "$HERDR_CI_ROOT/"
          # The same shared fixtures herdr-native hands the runtime tests.
          cp apps/client/e2e/fixtures/mosh-resize-frames.json "$HERDR_CI_ROOT/mosh-resize-frames.json"
          cp -a apps/client/e2e/fixtures/platform-keys "$HERDR_CI_ROOT/platform-keys"
      - *rust-release-manifest
      - *rust-1-96-1
      - name: Restore the pinned Zig download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lazysh-pinned-downloads
          key: lazysh-pinned-downloads-${{ github.job }}-v1-zig68659eb5
      - name: Provision pinned Zig and the task-owned Windows SDK description
        run: sh .github/scripts/windows-terminal-zig.sh "$HERDR_CI_ROOT"
      - name: Build libghostty-vt for Windows and the runtime's tests
        working-directory: ${{ runner.temp }}/lazysh-terminal-windows/terminal-runtime
        run: sh "$LAZYSH_CI_SCRIPTS/retry-zig-fetch.sh" cargo +1.96.1 test --locked --no-run
      - name: Test the shared terminal runtime on Windows
        working-directory: ${{ runner.temp }}/lazysh-terminal-windows/terminal-runtime
        env:
          LAZYSH_MOSH_FIXTURE: ${{ runner.temp }}/lazysh-terminal-windows/mosh-resize-frames.json
          LAZYSH_PLATFORM_KEYS_FIXTURES: ${{ runner.temp }}/lazysh-terminal-windows/platform-keys
        run: cargo +1.96.1 test --locked
      - name: Test the wgpu renderer on Direct3D 12 and WARP against the runtime and the reference renderer
        working-directory: ${{ runner.temp }}/lazysh-terminal-windows/terminal-renderer-wgpu
        run: |
          cargo +1.96.1 test --locked
          # Name the adapter the tests drew on in the log: Direct3D 12 on a hosted runner is WARP.
          cargo +1.96.1 test --locked --test frames windows_draws_on_direct3d_12 -- --nocapture
  # The terminal core on iOS (#1330). herdr-native builds libghostty-vt for Linux and Android only: the Apple SDK
  # package of Ghostty's build needs a macOS host with Xcode. Here Zig builds it against the runner's iPhoneOS and
  # iPhoneSimulator SDKs and the runtime crate is built for aarch64-apple-ios (linked, never run: no device) and
  # aarch64-apple-ios-sim (every test runs inside a booted simulator through `simctl spawn`, the way the Mosh
  # transport's iOS tests do). The native-enabled Tauri app must also link and launch on that simulator.
  # Composition, input, VoiceOver, and device performance are verified separately. It shares terminal-macos's setup steps, herdr-native's admitted archives and the caches by alias.
  # Not a required check, so it runs on pushes to main only (native-changes.sh).
  terminal-ios:
    needs: changes
    if: needs.changes.outputs.terminal_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 95
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      # The app's minimum, which the iOS simulator job links Mosh with.
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    steps:
      - uses: actions/checkout@v4
      - *macos-gnu-coreutils
      - *herdr-task-paths
      - *macos-copy-sources
      - *rust-release-manifest
      - *rust-1-96-1
      - *herdr-cargo-downloads
      - *pinned-download-cache
      - name: Add the iOS targets, report the host and the SDKs, and require Apple silicon
        run: |
          rustup +1.96.1 target add aarch64-apple-ios aarch64-apple-ios-sim
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes available
          host=$(rustc +1.96.1 -vV | sed -n 's/^host: //p')
          [ "$host" = aarch64-apple-darwin ] || { echo "::error::the runner's Rust host is $host, expected aarch64-apple-darwin"; exit 1; }
      - uses: ./.github/actions/ghostty-zig
        with:
          zig-target: aarch64-macos
          zig-sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
      # Each target builds its own libghostty-vt (the build script keeps one archive per target). The steps are
      # independent and run on after a failure, so one run reports every iOS failure.
      - name: Build libghostty-vt and link the runtime's tests for iOS devices
        id: device-build
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-runtime
        run: |
          sh "$GITHUB_WORKSPACE/.github/scripts/retry-zig-fetch.sh" cargo +1.96.1 test --locked --no-run --target aarch64-apple-ios
          cargo +1.96.1 clippy --locked --all-targets --target aarch64-apple-ios -- -D warnings
      - name: Build libghostty-vt and link the runtime's tests for the iOS simulator
        id: simulator-build
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-runtime
        run: |
          sh "$GITHUB_WORKSPACE/.github/scripts/retry-zig-fetch.sh" cargo +1.96.1 test --locked --no-run --target aarch64-apple-ios-sim
          cargo +1.96.1 clippy --locked --all-targets --target aarch64-apple-ios-sim -- -D warnings
      - name: Create and boot an isolated iOS simulator
        id: simulator
        if: ${{ !cancelled() && steps.simulator-build.outcome == 'success' }}
        run: |
          id=$(xcrun simctl create lazysh-terminal-ci com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro)
          echo "LAZYSH_IOS_SIMULATOR_ID=$id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$id" -b
      # `cargo test` hands each test executable to the runner, and `simctl spawn` runs it inside the simulator, which
      # sees this host's file system. It passes on only the variables with the SIMCTL_CHILD_ prefix.
      - *source-bun
      - name: Run every test of the runtime inside the iOS simulator
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-runtime
        env:
          SIMCTL_CHILD_LAZYSH_MOSH_FIXTURE: ${{ runner.temp }}/lazysh-herdr-native/mosh-resize-frames.json
          SIMCTL_CHILD_LAZYSH_PLATFORM_KEYS_FIXTURES: ${{ runner.temp }}/lazysh-herdr-native/platform-keys
        timeout-minutes: 20
        run: |
          export CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER="xcrun simctl spawn --standalone $LAZYSH_IOS_SIMULATOR_ID"
          cargo +1.96.1 test --locked --no-fail-fast --target aarch64-apple-ios-sim
      # An executable built for macOS would link and pass on this host and say nothing about iOS. Cargo is told not to colour its output: CI sets CARGO_TERM_COLOR=always, which breaks the match.
      - name: Require an iOS device build and an iOS simulator build, not a macOS one
        if: ${{ !cancelled() && steps.device-build.outcome == 'success' && steps.simulator-build.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/terminal-runtime
        run: |
          for pair in aarch64-apple-ios:IOS aarch64-apple-ios-sim:IOSSIMULATOR; do
            target=${pair%%:*} platform=${pair##*:}
            executable=$(cargo +1.96.1 test --color never --locked --no-run --target "$target" --test keys 2>&1 | sed -n 's/^ *Executable tests\/keys.rs (\(.*\))$/\1/p')
            [ -n "$executable" ] || { echo "::error::cargo named no executable for the keys test of $target"; exit 1; }
            xcrun vtool -show-build "$executable" | tee "$RUNNER_TEMP/vtool-$target.txt"
            grep -Eq "^ *platform $platform$" "$RUNNER_TEMP/vtool-$target.txt" || { echo "::error::the $target executable is not a $platform build"; exit 1; }
          done
      - name: Build the native-enabled iOS app
        id: ios-terminal-app
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        # Tauri runs Xcode a second time after the initial simulator build.
        timeout-minutes: 40
        run: |
          brew install protobuf openssl@3 zlib pkgconf cmake
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix protobuf)/lib/pkgconfig"
          export RUSTUP_TOOLCHAIN=1.96.1
          bun install --frozen-lockfile
          cd apps/client/src-tauri
          # Xcode retains PATH in its script phase and filters custom environment variables.
          export PATH="$(dirname "$ZIG"):$PATH"
          zig version | grep -Fx '0.16.0'
          # The generated Xcode script runs from gen/apple, so give Tauri the package script name.
          export npm_execpath="$(command -v bun)" npm_lifecycle_event=tauri
          ../../../node_modules/.bin/tauri ios init --ci
          sh "$GITHUB_WORKSPACE/.github/scripts/retry-zig-fetch.sh" ../../../node_modules/.bin/tauri ios build --target aarch64-sim --debug --ci --features native-terminal
      - name: Install the native-enabled app in the simulator
        id: ios-terminal-install
        if: ${{ !cancelled() && steps.ios-terminal-app.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          app=apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          xcrun vtool -show-build "$app/$executable" | grep -Eq '^ *platform IOSSIMULATOR$'
          xcrun simctl install "$LAZYSH_IOS_SIMULATOR_ID" "$app"
      - name: Verify the installed iOS app admits the native Metal renderer
        if: ${{ !cancelled() && steps.ios-terminal-install.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          xcodebuild -project apps/client/src-tauri/gen/apple/lazysh.xcodeproj -scheme LazyshMoshAppTests \
            -configuration debug -destination "platform=iOS Simulator,id=$LAZYSH_IOS_SIMULATOR_ID" \
            -only-testing:LazyshMoshAppTests/MoshAppIntegrationTests/testNativeTerminalBuildAdmitsTheMetalRenderer \
            -resultBundlePath "$RUNNER_TEMP/native-terminal-ios.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 120 \
            test CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/apps/client/src-tauri/gen/apple/build/arm64-sim"
      - name: Build the owned terminal SSH fixture
        id: ios-terminal-fixture
        if: ${{ !cancelled() && steps.ios-terminal-install.outcome == 'success' }}
        timeout-minutes: 18
        run: cargo +1.96.1 build --locked --manifest-path tests/support/terminal-ssh-fixture/Cargo.toml --target-dir "$RUNNER_TEMP/terminal-fixture-target"
      - name: Exercise the installed iOS terminal with owned SSH
        id: ios-terminal-ssh
        if: ${{ !cancelled() && steps.ios-terminal-fixture.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          fixture_log="$RUNNER_TEMP/ios-terminal-fixture.log"
          export LAZYSH_TERMINAL_FIXTURE_PASSWORD="$(uuidgen | tr -d '-')"
          "$RUNNER_TEMP/terminal-fixture-target/debug/lazysh-terminal-ssh-fixture" > "$fixture_log" &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if [ -s "$fixture_log" ]; then break; fi
            kill -0 "$fixture_pid"
            sleep 0.2
          done
          read -r port fingerprint < "$fixture_log"
          [[ "$port" =~ ^[0-9]+$ && "$fingerprint" == SHA256:* ]]
          export TEST_RUNNER_LAZYSH_TERMINAL_FIXTURE_PORT="$port"
          export TEST_RUNNER_LAZYSH_TERMINAL_FIXTURE_FINGERPRINT="$fingerprint"
          export TEST_RUNNER_LAZYSH_TERMINAL_FIXTURE_PASSWORD="$LAZYSH_TERMINAL_FIXTURE_PASSWORD"
          result=0
          xcodebuild -project apps/client/src-tauri/gen/apple/lazysh.xcodeproj -scheme LazyshMoshAppTests \
            -configuration debug -destination "platform=iOS Simulator,id=$LAZYSH_IOS_SIMULATOR_ID" \
            -only-testing:LazyshMoshAppTests/MoshAppIntegrationTests/testNativeTerminalAttachesAndHandsBackAnOwnedSshSession \
            -resultBundlePath "$RUNNER_TEMP/native-terminal-session-ios.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 120 \
            test CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/apps/client/src-tauri/gen/apple/build/arm64-sim" || result=$?
          native="$(grep -cFx 'terminal fixture received exact native input' "$fixture_log" || true)"
          xterm="$(grep -cFx 'terminal fixture received exact xterm input' "$fixture_log" || true)"
          rejected="$(grep -cFx 'terminal fixture rejected repeated or out-of-order input' "$fixture_log" || true)"
          echo "Owned SSH fixture received native=$native and xterm=$xterm exact terminal inputs, rejected=$rejected."
          if [ "$result" != 0 ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/native-terminal-session-ios.xcresult" || true
            exit "$result"
          fi
          test "$native" = 1 && test "$xterm" = 1 && test "$rejected" = 0
      - name: Upload failed native iOS terminal SSH result
        if: ${{ !cancelled() && steps.ios-terminal-ssh.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-ios-native-terminal-ssh-result
          path: ${{ runner.temp }}/native-terminal-session-ios.xcresult
          if-no-files-found: warn
      - name: Delete the simulator
        if: ${{ always() && env.LAZYSH_IOS_SIMULATOR_ID != '' }}
        run: xcrun simctl delete "$LAZYSH_IOS_SIMULATOR_ID"

  native-linux:
    needs: [changes, herdr-native]
    if: needs.changes.outputs.linux == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - *source-bun
      - *pinned-download-cache
      # Every Parakeet build script run reads this verified archive instead of downloading ORT.
      # Only this job seeds the main cache; native-linux-runtimes restores the same entry.
      - uses: ./.github/actions/parakeet-onnxruntime
        with:
          seed: 'true'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo sh .github/scripts/apt-install.sh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev cmake libclang-dev libprotobuf-dev protobuf-compiler libssl-dev zlib1g-dev pkg-config libncurses-dev libevent-dev bison openssh-server tmux dbus-daemon gnome-keyring xdg-desktop-portal xvfb xauth xclip webkit2gtk-driver bubblewrap python3-gi xdg-utils ibus ibus-gtk3 ibus-libpinyin xdotool
      - name: Verify native GUI namespace prerequisites
        env:
          LAZYSH_NATIVE_NAMESPACE_NETWORK: private
        run: &native-fixture-namespace |
          namespace_command=(bwrap --unshare-user)
          case "${LAZYSH_NATIVE_NAMESPACE_NETWORK:-}" in
            private) namespace_command=(bwrap --unshare-user --unshare-net --dev-bind / / -- bwrap --unshare-user --unshare-net) ;;
            shared) ;;
            *) printf '%s\n' 'Unsupported native fixture namespace mode' >&2; exit 1 ;;
          esac
          test "$(id -u)" -ne 0
          test -x /usr/bin/bwrap
          bwrap --version
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone || true
          sudo cat /sys/kernel/security/apparmor/profiles | awk '/^(bwrap|unprivileged_userns)/' || true
          "${namespace_command[@]}" --unshare-pid --dev-bind / / --proc /proc --ro-bind /etc/group /etc/group -- /usr/bin/true
      - name: Build the pinned official tmux fixture outside the checkout
        timeout-minutes: 10
        run: &pinned-tmux-build |
          test "$(/usr/bin/tmux -V)" = 'tmux 3.2a'
          tmux_root=$(mktemp -d "$RUNNER_TEMP/lazysh-tmux-3.4-XXXXXX")
          sh .github/scripts/pinned-download.sh 551ab8dea0bf505c0ad6b7bb35ef567cdde0ccb84357df142c254f35a23e19aa "$tmux_root/tmux-3.4.tar.gz" --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 707213 https://github.com/tmux/tmux/releases/download/3.4/tmux-3.4.tar.gz
          test "$(stat -c%s "$tmux_root/tmux-3.4.tar.gz")" -eq 707213
          printf '%s  %s\n' '551ab8dea0bf505c0ad6b7bb35ef567cdde0ccb84357df142c254f35a23e19aa' "$tmux_root/tmux-3.4.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tmux_root/tmux-3.4.tar.gz" --directory "$tmux_root" --no-same-owner --no-same-permissions
          cd "$tmux_root/tmux-3.4"
          ./configure --prefix="$tmux_root/install"
          make -j2
          make install
          export PATH="$tmux_root/install/bin:$PATH"
          test "$(command -v tmux)" = "$tmux_root/install/bin/tmux"
          test "$(tmux -V)" = 'tmux 3.4'
          echo "$tmux_root/install/bin" >> "$GITHUB_PATH"
          echo "LAZYSH_TEST_TMUX=$tmux_root/install/bin/tmux" >> "$GITHUB_ENV"
      - &official-mosh-fixture
        name: Build the pinned official Mosh fixture outside the checkout
        timeout-minutes: 10
        run: |
          mosh_root=$(mktemp -d "$RUNNER_TEMP/lazysh-mosh-1.4.0-XXXXXX")
          sh .github/scripts/pinned-download.sh 872e4b134e5df29c8933dff12350785054d2fd2839b5ae6b5587b14db1465ddd "$mosh_root/mosh-1.4.0.tar.gz" --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 2097152 https://github.com/mobile-shell/mosh/releases/download/mosh-1.4.0/mosh-1.4.0.tar.gz
          printf '%s  %s\n' '872e4b134e5df29c8933dff12350785054d2fd2839b5ae6b5587b14db1465ddd' "$mosh_root/mosh-1.4.0.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$mosh_root/mosh-1.4.0.tar.gz" --directory "$mosh_root" --no-same-owner --no-same-permissions
          cd "$mosh_root/mosh-1.4.0"
          ./configure --prefix="$mosh_root/install"
          make -j2
          make install
          export PATH="$mosh_root/install/bin:$PATH"
          test "$(command -v mosh-server)" = "$mosh_root/install/bin/mosh-server"
          mosh_version=$(mosh-server --version)
          test "${mosh_version%%$'\n'*}" = 'mosh-server (mosh 1.4.0) [build mosh 1.4.0]'
          echo "$mosh_root/install/bin" >> "$GITHUB_PATH"
          echo "LAZYSH_NATIVE_MOSH_SERVER=$mosh_root/install/bin/mosh-server" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          # Native dependency objects must match this runner's glibc baseline.
          prefix-key: v0-rust-ubuntu-22.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      - run: bunx moon run client:build client-native:verify-native
      # A skipped or failed producer publishes no ID; fail before the download guesses one.
      - name: Validate producer artifact ID
        env:
          HERDR_ARTIFACT_ID: ${{ needs.herdr-native.outputs.guarded-id }}
        run: &herdr-artifact-id-guard |
          [[ "$HERDR_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::herdr-native did not publish a single artifact ID'; exit 1; }
      - uses: actions/download-artifact@v4
        with: &guarded-herdr-download
          artifact-ids: ${{ needs.herdr-native.outputs.guarded-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/lazysh-guarded-herdr
      - name: Verify same-run guarded binary and exercise owned SSH binding
        env:
          GUARDED_HERDR_SHA256: ${{ needs.herdr-native.outputs.guarded-sha256 }}
          LAZYSH_TEST_HERDR: ${{ runner.temp }}/lazysh-guarded-herdr/herdr
        run: |
          cd "$RUNNER_TEMP/lazysh-guarded-herdr"
          printf '%s  herdr\n' "$GUARDED_HERDR_SHA256" | sha256sum --check --strict
          chmod 700 herdr
          timeout --kill-after=2s 5s "$LAZYSH_TEST_HERDR" --version
          cd "$GITHUB_WORKSPACE"
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib ssh::tmux_jump_fixture::herdr_guard::real_guarded_herdr_ssh_binding_keeps_original_connection_source_and_lease -- --ignored --exact
          managed=ssh::tmux_jump_fixture::real_ssh_managed_guarded_herdr_binds_the_display_through_the_managed_executable
          # A renamed case must not turn this step into a zero-test pass.
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$managed" -- --list --ignored --exact | grep -Fx -- "$managed: test"
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$managed" -- --ignored --exact
          printf '%s\n' "LAZYSH_TEST_HERDR=$LAZYSH_TEST_HERDR" "LAZYSH_TEST_AGENT_BIN=$GITHUB_WORKSPACE/target/release/lazysh-agent" "LAZYSH_TEST_RECEIVER_BIN=$GITHUB_WORKSPACE/target/release/examples/owned_terminal_receiver" >> "$GITHUB_ENV"
      - name: Exercise the guarded Herdr input on a local PTY with the same guarded binary
        env:
          CASE_NAME: local::attach_tests::runtime::guarded_herdr_input_on_a_local_pty_reaches_only_the_confirmed_pane
          LAZYSH_TEST_HERDR: ${{ runner.temp }}/lazysh-guarded-herdr/herdr
        run: |
          # A renamed case must not turn this step into a zero-test pass.
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$CASE_NAME" -- --list --ignored --exact | grep -c ': test$' | grep -Fx 1
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$CASE_NAME" -- --ignored --exact --nocapture
      # The two published companions that real hosts still run. The owned SSH case updates a host that has each one.
      - name: Fetch the pinned published 1.28.0 and 1.33.4 companions for the owned update hosts
        run: |
          old_companions=$(mktemp -d "$RUNNER_TEMP/lazysh-old-companions-XXXXXX")
          sh .github/scripts/pinned-download.sh d8f0bab955d71e3d2f2d9731a2514c88f482b6809fe20593a9906737a977f1d0 "$old_companions/lazysh-1.28.0-linux-agent-x64.bin" --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 11481648 https://github.com/mihazs/lazysh/releases/download/v1.28.0/lazysh-1.28.0-linux-agent-x64.bin
          sh .github/scripts/pinned-download.sh b37f2b673732b99fc2e751cf8974393a9329fc979d8e1ef205cf6829cc8b6804 "$old_companions/lazysh-1.33.4-linux-agent-x64.bin" --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 11514416 https://github.com/mihazs/lazysh/releases/download/v1.33.4/lazysh-1.33.4-linux-agent-x64.bin
          (cd "$old_companions" && printf '%s  %s\n' d8f0bab955d71e3d2f2d9731a2514c88f482b6809fe20593a9906737a977f1d0 lazysh-1.28.0-linux-agent-x64.bin b37f2b673732b99fc2e751cf8974393a9329fc979d8e1ef205cf6829cc8b6804 lazysh-1.33.4-linux-agent-x64.bin | sha256sum --check --strict)
          chmod 700 "$old_companions"/*.bin
          echo "LAZYSH_TEST_OLD_COMPANIONS=$old_companions" >> "$GITHUB_ENV"
      # The release companion is the one hook setup accepts (a binary over 64 MiB is refused); the two
      # `companion::local` cases run it on this device through real local sessions, not over SSH.
      - name: Exercise owned companion transfer, exact Mosh entry and the local companion
        env:
          LAZYSH_TEST_AGENT_BIN: ${{ github.workspace }}/target/release/lazysh-agent
          LAZYSH_TEST_FAKE_SDK_BIN: ${{ github.workspace }}/target/release/examples/fake_android_sdk
          # This binary is only driven over SSH, never shipped or size-gated (it stays far under the 64 MiB limit above), so it
          # skips the fat LTO of the published profile: docs/reference/linkers-moon-and-android-build-measurements.md, #2768.
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: |
          cargo build --release --locked -p lazysh-agent --bin lazysh-agent --example owned_terminal_receiver --example fake_android_sdk
          cases=(ssh::tests::openssh_client_environment_reaches_remote_shell ssh::tests::openssh_attachments_default_to_private_unique_tmp_files ssh::tests::openssh_companion_install_and_managed_path ssh::tests::openssh_managed_herdr_installs_and_removes_only_its_own_binary ssh::tests::openssh_companion_install_refuses_an_unsupported_architecture ssh::tests::openssh_agent_board_and_approvals_through_companion_hooks ssh::tests::openssh_account_usage_channel_cancellation_reaps_workers ssh::tests::openssh_and_mosh_deliver_checksummed_output_to_a_core ssh::tests::openssh_host_browser_streams_a_real_page_and_closing_the_channel_ends_the_browser ssh::tmux_jump_fixture::missing_mosh_executable_is_safe_for_auto_before_any_target_creation ssh::tmux_jump_fixture::real_mosh_tmux_entry_binds_exact_namespace_and_survives_receipt_and_bootstrap_closure ssh::tmux_jump_fixture::herdr_guard::real_guarded_mosh_keeps_private_claim_and_exact_display_after_bootstrap_closure companion::local::tests::real_local_companion_serves_the_board_transcripts_and_settings_without_a_shell companion::local::tests::real_local_hooks_report_to_the_board_and_a_permission_request_is_answered companion::local::tests::real_local_companion_lists_devices_and_streams_frames_until_stopped_or_the_session_closes)
          for case_name in "${cases[@]}"; do
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact
          done
      - name: Exercise the sign-in listener check over owned SSH
        env:
          LAZYSH_TEST_AGENT_BIN: ${{ github.workspace }}/target/release/lazysh-agent
        run: |
          case_name=ssh::tests::openssh_auth_listener_check_uses_the_companion_then_falls_back_to_ss
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact
      - name: Check standalone Parakeet runtime and native ownership boundary
        run: bunx moon run parakeet-runtime:test-rust parakeet-runtime:lint parakeet-runtime:format-check
      - name: Check combined native voice startup and clean shutdown without models
        run: bunx moon run client-native:test-voice-interop-smoke
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # cargo install leaves an already installed identical version in place.
      - name: Restore the pinned native GUI protocol driver
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lazysh-native-driver
          key: tauri-driver-2.1.0-locked-ubuntu-22.04-${{ runner.arch }}
      - name: Install pinned native GUI protocol driver
        run: cargo install --locked --version 2.1.0 tauri-driver --root "$RUNNER_TEMP/lazysh-native-driver"
      - name: Prepare owned native GUI system tools
        run: |
          tools_dir=$(mktemp -d "$RUNNER_TEMP/lazysh-native-tools.XXXXXX")
          for tool in WebKitWebDriver Xvfb xclip gnome-keyring-daemon python3 ibus-daemon ibus xdotool; do
            source=$(readlink -f "/usr/bin/$tool")
            install -m 0755 "$source" "$tools_dir/$tool"
            cmp "$source" "$tools_dir/$tool"
          done
          echo "LAZYSH_NATIVE_GUI_WEBKIT_DRIVER=$tools_dir/WebKitWebDriver" >> "$GITHUB_ENV"
          echo "LAZYSH_NATIVE_GUI_XVFB=$tools_dir/Xvfb" >> "$GITHUB_ENV"
          echo "LAZYSH_NATIVE_GUI_XCLIP=$tools_dir/xclip" >> "$GITHUB_ENV"
          echo "LAZYSH_NATIVE_GUI_SECRET_SERVICE=$tools_dir/gnome-keyring-daemon" >> "$GITHUB_ENV"
          echo "LAZYSH_NATIVE_GUI_PYTHON=$tools_dir/python3" >> "$GITHUB_ENV"
          # The real input method of the Linux GUI input-method cases (native-e2e/ime.spec.ts).
          echo "LAZYSH_NATIVE_GUI_IBUS_DAEMON=$tools_dir/ibus-daemon" >> "$GITHUB_ENV"
          echo "LAZYSH_NATIVE_GUI_IBUS=$tools_dir/ibus" >> "$GITHUB_ENV"
          echo "LAZYSH_NATIVE_GUI_XDOTOOL=$tools_dir/xdotool" >> "$GITHUB_ENV"
      - &pinned-zellij
        name: Install the pinned official Zellij 0.45.1 release outside the checkout (the native GUI drives it)
        # Release asset digest: https://api.github.com/repos/zellij-org/zellij/releases/tags/v0.45.1
        run: |
          zellij_root=$(mktemp -d "$RUNNER_TEMP/lazysh-zellij-0.45.1-XXXXXX")
          sh .github/scripts/pinned-download.sh 40bcc2e03f5d5ae8e054e39f676081fe12ab70871506996ba595834c3718eefc "$zellij_root/zellij.tar.gz" --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 18729165 https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' '40bcc2e03f5d5ae8e054e39f676081fe12ab70871506996ba595834c3718eefc' "$zellij_root/zellij.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$zellij_root/zellij.tar.gz" --directory "$zellij_root" --no-same-owner --no-same-permissions zellij
          test "$("$zellij_root/zellij" --version)" = 'zellij 0.45.1'
          echo "$zellij_root" >> "$GITHUB_PATH"
          echo "LAZYSH_TEST_ZELLIJ=$zellij_root/zellij" >> "$GITHUB_ENV"
      - name: Exercise owned Linux native singleton GUI delivery
        id: native-gui
        env:
          LAZYSH_NATIVE_GUI_DRIVER: ${{ runner.temp }}/lazysh-native-driver/bin/tauri-driver
        run: |
          LAZYSH_TEST_SSH_USER_NAMESPACE=1 bwrap --unshare-user --unshare-net --dev-bind / / -- bun test tests/android-ssh-host.test.ts --test-name-pattern 'owned namespaced SSH'
          bun run test:native-gui
      - name: Exercise actual native GUI installation from the public companion release
        timeout-minutes: 12
        env:
          LAZYSH_NATIVE_GUI_DRIVER: ${{ runner.temp }}/lazysh-native-driver/bin/tauri-driver
          LAZYSH_PUBLISHED_NATIVE_GUI: '1'
        run: bun run --cwd apps/client test:published-native-gui
      - name: Retain only the owned synthetic native GUI image
        if: ${{ !cancelled() && (steps.native-gui.outcome == 'success' || steps.native-gui.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-native-singleton-gui
          path: apps/client/test-results/native-gui
          if-no-files-found: warn
      - run: bun run test:mosh
      - name: Exercise retained tmux display navigation and hostile control streams
        run: bunx moon run client-native:test-tmux
      - name: Exercise original-display Chat input and retirement on supported tmux
        shell: bash
        run: |
          test "$(tmux -V)" = 'tmux 3.4'
          case_name=ssh::tmux_jump_fixture::real_tmux_chat_original_display_namespace_bytes_and_retirement
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact
      - name: Run a scripted agent session from the guarded Agent view inputs on supported tmux
        shell: bash
        run: |
          test "$(tmux -V)" = 'tmux 3.4'
          test -x "$LAZYSH_TEST_AGENT_BIN"
          case_name=ssh::tmux_jump_fixture::agent_session::real_tmux_agent_session_runs_from_the_guarded_agent_view_inputs_only
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact
      - name: Answer a recorded dialog only while the pane still shows it, on supported tmux
        shell: bash
        run: |
          test "$(tmux -V)" = 'tmux 3.4'
          case_name=ssh::tmux_jump_fixture::pick_screen::real_tmux_pick_is_delivered_only_to_the_dialog_it_was_read_from
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact
      - name: Reject unsupported apt tmux loops without binding authority and report it degraded
        shell: bash
        env:
          LAZYSH_TEST_TMUX: /usr/bin/tmux
        run: |
          test "$(/usr/bin/tmux -V)" = 'tmux 3.2a'
          case_name=ssh::tmux_jump_fixture::real_tmux_unsupported_client_loops_keep_terminal_without_binding
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact
          # Product discovery over owned OpenSSH reports this tmux as degraded.
          case_name=ssh::tmux_jump_fixture::real_ssh_discovery_reports_multiplexer_versions_and_support
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
          LAZYSH_EXPECT_MUX_SUPPORT='tmux=degraded' cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact --nocapture
      # Last: the stock verification replaces LAZYSH_TEST_HERDR for any later step.
      - &stock-herdr-guard
        name: Validate producer artifact ID
        env:
          HERDR_ARTIFACT_ID: ${{ needs.herdr-native.outputs.stock-id }}
        run: *herdr-artifact-id-guard
      - &stock-herdr-download
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.herdr-native.outputs.stock-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/lazysh-stock-herdr
      - &stock-herdr-verify
        name: Verify same-run stock Herdr
        env:
          STOCK_HERDR_SHA256: ${{ needs.herdr-native.outputs.stock-sha256 }}
        run: |
          cd "$RUNNER_TEMP/lazysh-stock-herdr"
          test -f herdr
          test -s herdr
          test "$(stat -c%s herdr)" -le 536870912
          printf '%s  herdr\n' "$STOCK_HERDR_SHA256" | sha256sum --check --strict
          bun -e '
          const receipt=await Bun.file("source.json").json();
          const expected={schemaVersion:1,sourceCommit:"2ecf19a92fc3a7fff75b6ce3655ef04f4625ec01",archiveSha256:"cbd4354f1c44530d9f094c2797380208c50f19b4d6350b6e5206e220133c3168",
            manifestSha256:"c303652ea2d310b78fdc9222cb30b405915890c0522239c9daf734591cb08e8a",sourceFiles:1843,binarySha256:process.env.STOCK_HERDR_SHA256,checkout:process.env.GITHUB_SHA};
          if(Object.keys(receipt).length!==Object.keys(expected).length || Object.entries(expected).some(([key,value])=>receipt[key]!==value))throw new Error("Stock Herdr provenance mismatch");'
          chmod 700 herdr
          printf '%s\n' "LAZYSH_TEST_HERDR=$RUNNER_TEMP/lazysh-stock-herdr/herdr" >> "$GITHUB_ENV"
      - name: Exercise the pinned pane input actor against the unchanged stock Herdr
        shell: bash
        env:
          LAZYSH_TEST_HERDR_STOCK: ${{ runner.temp }}/lazysh-stock-herdr/herdr
        run: |
          # The actor needs SO_PEERPIDFD (Linux 6.5); the kernel is part of the evidence.
          uname -r
          # A renamed case must not turn this step into a zero-test pass.
          cargo test --locked -p lazysh-agent --test herdr_pane_input_stock -- --list --ignored | grep -c ': test$' | grep -Fx 5
          cargo test --locked -p lazysh-agent --test herdr_pane_input_stock -- --ignored --test-threads=1
      - name: Exercise ordinary Mosh Herdr entries from PATH and the default user installation
        shell: bash
        env:
          CASE_NAME: ssh::tmux_jump_fixture::real_mosh_ordinary_entries_require_child_receipts_and_keep_the_selected_display
          LAZYSH_TEST_HERDR_STOCK: ${{ runner.temp }}/lazysh-stock-herdr/herdr
        run: &exact-ignored-case |
          # A renamed case must not turn this step into a zero-test pass.
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$CASE_NAME" -- --list --ignored --exact | grep -c ': test$' | grep -Fx 1
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$CASE_NAME" -- --ignored --exact

  # The app bridge (terminal_core.rs, local.rs, ssh.rs) links the shared terminal core only with the optional
  # `native-terminal` feature, which no other job enables, so a change to the core crate's API could break the
  # bridge unnoticed (#1620). This job compiles the app library and its tests with the feature, which also
  # compiles the wgpu renderer from the root lock file (#2201), and runs the real-core cases. It provisions Zig
  # 0.16.0 and the admitted Ghostty archives with the steps of herdr-native (aliases), in the checkout's own
  # libghostty-vt directory, and leaves herdr-native's checks as they are.
  native-terminal-bridge:
    needs: changes
    if: needs.changes.outputs.terminal_bridge == 'true'
    # Match the glibc floor of herdr-native and native-linux.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - *pinned-download-cache
      # The link puts the checkout's Herdr source where the admission runs, so the app's build script finds the admitted packages.
      - &ghostty-zig-checkout
        uses: ./.github/actions/ghostty-zig
        with:
          link-source: 'true'
      - *rust-release-manifest
      - *rust-1-96-1
      - run: sudo sh .github/scripts/apt-install.sh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev cmake libclang-dev libprotobuf-dev protobuf-compiler libssl-dev zlib1g-dev pkg-config libncurses-dev openssh-server
      - uses: ./.github/actions/parakeet-onnxruntime
      # Pull requests restore main's entry and never save their own, like the other Rust caches.
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache-main
      # The feature must bring the wgpu renderer in, and a build without it must not compile wgpu: `cargo tree -i`
      # fails when the package is not in the selected graph.
      - name: Check that only the native-terminal feature brings the wgpu renderer into the app
        run: |
          cargo tree --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal -e normal -i lazysh-terminal-renderer-wgpu
          if cargo tree --manifest-path apps/client/src-tauri/Cargo.toml --locked --target all -e normal -i wgpu; then
            echo "::error::a build without the native-terminal feature would compile wgpu"; exit 1
          fi
      - name: Build the app library and its tests with the native terminal core and the wgpu renderer
        run: sh .github/scripts/retry-zig-fetch.sh cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib --no-run
      # The real-core cases exist only with the feature, so each guard case must be listed before the run: a rename
      # or a missing feature must not turn this step into a partial pass. The filters select every bridge case that
      # names a core, and the churn case by name. They read the process-wide hub, so they run one at a time.
      - name: Run the real-core bridge tests one at a time
        run: |
          filters=(core a_hundred_terminals)
          guards=(
            local::tests::history_lines_set_the_scrollback_the_real_core_reserves_for_a_session
            local::tests::local_pty_output_is_parsed_by_the_real_core_and_readable_as_text
            local::tests::a_hundred_terminals_open_and_close_without_growing_the_process_or_the_budget
            terminal_core::native::tests::paste_is_bracketed_only_after_the_program_enabled_it
            terminal_core::native::tests::a_core_answers_a_reader_from_the_real_screen_and_never_with_a_cell
            terminal_core::native::tests::a_locked_app_is_told_nothing_and_the_next_reader_brings_the_core_back_to_life
            terminal_core::native::tests::colour_queries_get_the_apps_theme_and_a_theme_change_changes_the_next_answer
            terminal_core::native::tests::a_theme_that_is_not_a_set_of_hex_colours_opens_no_core_and_changes_nothing
            terminal_core::native::tests::a_mosh_session_follows_the_sizes_of_its_frames_and_a_plain_one_does_not
            terminal_core::native::tests::a_released_real_core_hands_over_its_screen_cursor_and_modes_and_no_byte_is_lost
            local::tests::the_control_commands_answer_for_a_real_pty_core_and_its_events_follow_the_reader
          )
          for case_name in "${guards[@]}"; do
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib -- --list --exact "$case_name" | grep -Fx -- "$case_name: test"
          done
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib -- --test-threads=1 "${filters[@]}"
      # The renderer host (#2215) draws real sessions with the wgpu renderer on an offscreen target. The runner has no
      # GPU, so the tests run on Mesa's software Vulkan (lavapipe), which their policy accepts and the shipping policy
      # refuses, and fail without an adapter. Each guard case must be listed, so a rename is not a partial pass.
      - name: Install a software Vulkan driver for the renderer host tests
        run: sudo sh .github/scripts/apt-install.sh mesa-vulkan-drivers libvulkan1
      - name: Run the renderer host tests on a software GPU
        run: |
          guards=(
            a_fed_session_is_drawn_with_the_pixels_of_the_reference_renderer
            an_idle_session_submits_nothing_to_the_gpu
            a_suspended_host_draws_nothing_and_resuming_shows_what_arrived_meanwhile
            a_lost_surface_detaches_and_a_newer_generation_draws_the_same_pixels_from_a_snapshot
            a_lost_device_is_rebuilt_and_the_screen_is_drawn_again_identically
            the_selection_and_composing_text_are_drawn_like_the_reference
            composing_text_stops_at_the_end_of_the_row_and_never_leaves_half_a_wide_character
            a_blinking_cursor_redraws_only_its_row_once_per_phase_without_any_output
            the_preferences_decide_the_cells_the_colours_and_the_fonts
            with_system_fonts_text_is_drawn_from_a_font_and_follows_the_family_list
            bold_text_follows_the_bold_preferences_and_changes_live
            a_program_that_chose_no_cursor_gets_the_preferred_one_and_a_program_that_did_keeps_its_own
            the_cell_a_page_divides_its_pane_by_is_the_cell_the_renderer_draws
            a_core_of_80_by_24_is_drawn_with_the_looks_a_phone_gets_before_its_page_sends_one_and_is_not_blank
            an_imported_font_is_drawn_from_the_bytes_the_page_sent_whatever_its_name
            an_imported_cjk_font_draws_only_its_ranges_and_never_takes_latin_text_from_the_primary_font
            changing_or_removing_the_imported_font_repaints_the_session
          )
          for case_name in "${guards[@]}"; do
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib -- --list --exact "native_renderer::tests::$case_name" | grep -Fx -- "native_renderer::tests::$case_name: test"
          done
          # The platform surface's bookkeeping and the look its page sends (#2380) draw on the same offscreen target.
          surface_guards=(
            native_terminal_surface::panes::tests::a_session_is_drawn_with_the_look_its_page_sent_on_every_display_and_the_default_before
            native_terminal_surface::panes::tests::a_look_the_renderer_cannot_use_is_refused_and_changes_nothing
            native_terminal_surface::panes::tests::a_new_look_reaches_a_drawing_session_and_waits_for_one_that_is_not
          )
          for case_name in "${surface_guards[@]}"; do
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib -- --list --exact "$case_name" | grep -Fx -- "$case_name: test"
          done
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib -- native_renderer::tests:: native_terminal_surface::panes::
      # Real OpenSSH and the official Mosh server (#1564), built with the feature on. The fixture's core is a stand-in.
      - *official-mosh-fixture
      - name: Deliver real OpenSSH and Mosh output to a core with the feature on
        env:
          CASE_NAME: ssh::tests::openssh_and_mosh_deliver_checksummed_output_to_a_core
        run: |
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib -- --list --ignored --exact "$CASE_NAME" | grep -Fx -- "$CASE_NAME: test"
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib -- --ignored --exact --test-threads=1 "$CASE_NAME"
      # The Linux surface host (#1331) in the real app. A debug build with the feature loads its page from the dev URL, where
      # the composition probe's harness serves a fixture page that calls the app's own surface commands; a headless sway
      # shows the window and grim reads the compositor's pixels back. On Xvfb the probe and the host must refuse. The
      # fixture page is ours, and the WebKitGTK sandbox needs user namespaces the harness does not set up.
      - name: Install a headless compositor, an X server and the tools that read their pixels
        run: sudo sh .github/scripts/apt-install.sh --no-install-recommends sway grim xvfb imagemagick python3-numpy python3-pil dbus
      - name: Build the app with the native terminal
        run: sh .github/scripts/retry-zig-fetch.sh cargo build --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal
      - name: Place a native surface below the real app window on Wayland and refuse it on X11
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          POC_APP: ${{ github.workspace }}/target/debug/lazysh
        run: packages/terminal-runtime/prototypes/linux-surface/scripts/ci.sh "$RUNNER_TEMP/linux-surface-app"
      - name: Retain the compositor's screenshots of every step
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-linux-surface-app
          path: ${{ runner.temp }}/linux-surface-app
          if-no-files-found: warn
          retention-days: 7
      # The kill switch (#1342): with LAZYSH_NATIVE_TERMINAL=off the app leaves the real core out even though the feature is on, and the
      # bridge and surface commands say so. The guards fail the step if a rename leaves a case unlisted.
      - name: Check that the kill switch removes the real core from a build with the feature on
        env:
          LAZYSH_NATIVE_TERMINAL: 'off'
        run: |
          guards=(
            terminal_core::tests::without_the_real_core_the_commands_say_why
            native_terminal_surface::tests::the_surface_is_refused_disabled_in_this_build
          )
          for case_name in "${guards[@]}"; do
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib -- --list --exact "$case_name" | grep -Fx -- "$case_name: test"
          done
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib -- --exact "${guards[@]}"

  native-desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      # A red platform cancels its sibling on a pull request; main keeps both verdicts.
      fail-fast: &pull-request-fail-fast ${{ github.event_name == 'pull_request' }}
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Every release-profile build here (`build:native`, the macOS bundle, the Windows installer) is only inspected or run by this
    # job and published nowhere (release-artifacts.yml builds what ships), so none needs the fat LTO of the published profile: #2768.
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4
      - *source-bun
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: |
          brew install protobuf openssl@3 zlib pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix protobuf)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache-main
      - run: bun install --frozen-lockfile
      - name: Verify release consistency on the native filesystem
        run: bun run release:check
      - name: Verify Windows file hashing against independent known vectors
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          LAZYSH_TEST_WINDOWS_HASH: '1'
        run: bun test tests/release-artifacts.test.ts --test-name-pattern 'actual Windows SHA256'
      - name: Exercise account quota collectors and process ownership
        run: bunx moon run account-usage:test-rust
      - run: bun run build:native
      - run: bunx moon run credential-vault:test-rust
      - name: Exercise the actual Windows Credential Manager round trip and chunked deletion
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for case_name in tests::os_vault_roundtrip chunked::tests::windows_credential_manager_deletion_leaves_no_chunks; do
            cargo test --locked -p tauri-plugin-lazysh-vault --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
            cargo test --locked -p tauri-plugin-lazysh-vault --lib "$case_name" -- --ignored --exact
          done
      - name: Package and validate native macOS permission localizations
        if: runner.os == 'macOS'
        run: |
          bun run --cwd apps/client tauri build --bundles app
          plutil -lint target/release/bundle/macos/lazysh.app/Contents/Resources/{en,pt-BR,es}.lproj/{InfoPlist,NativeUI}.strings
      - name: Package the actual Windows NSIS installer
        if: runner.os == 'Windows'
        run: bun run --cwd apps/client tauri build --bundles nsis -- --locked
      - name: Exercise actual Windows install, same-version repair and uninstall
        id: windows-installer
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          LAZYSH_TEST_WINDOWS_INSTALLER: '1'
        run: bun test tests/release-artifacts.test.ts --test-name-pattern 'actual Windows NSIS'
      - name: Reject unverified Windows private-file permissions
        if: runner.os == 'Windows'
        run: cargo test --locked -p lazysh-common --features service --lib service_secrets::tests::public_storage_helpers_reject_unverified_host_permissions -- --exact
      - name: Exercise Windows SID and DACL admission on real files, grants and junctions
        if: runner.os == 'Windows'
        run: "cargo test --locked -p lazysh-common --lib windows_acl::"
      - name: Exercise native companion WAL admission and recovery
        run: bun run test:storage
      - name: Exercise managed hook setup against native macOS ACLs, links and replacement races
        if: runner.os == 'macOS'
        run: cargo test --locked -p lazysh-agent --test hook_setup
      - name: Exercise managed hook setup against native Windows ACLs, links, streams and the commit boundary
        if: runner.os == 'Windows'
        run: cargo test --locked -p lazysh-agent --test hook_setup_windows
      - name: Build pinned Parakeet runtime and exercise native ACL storage
        run: bunx moon run parakeet-runtime:test-rust parakeet-runtime:lint parakeet-runtime:format-check
      - name: Exercise native desktop launch parsing and original-lease admission
        run: "cargo test --locked -p lazysh --lib desktop_launch::"
      - name: Exercise multiplexer version gates, command building and tree parsing
        run: "cargo test --locked -p lazysh --lib -- multiplexer:: zellij:: herdr:: herdr_create:: tmux_jump::"
      - name: Exercise the companion's Herdr pane focus over a real Windows named pipe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # A renamed case must not turn this step into a zero-test pass.
          cargo test --locked -p lazysh-agent --lib herdr:: -- --list | grep -Fx 'herdr::tests::real_named_pipe_carries_the_focus_request_and_reports_a_missing_pipe: test'
          cargo test --locked -p lazysh-agent --lib herdr::
      # The OSC 52 handler is client code (xterm parser, bounded decoding, consent), so Windows runs its unit tests; the real native multiplexers run through a local ConPTY in the step below (#1925), not through this handler (#1747).
      - name: Exercise the client OSC 52 handler
        if: runner.os == 'Windows'
        run: bun run --cwd apps/client test:osc52
      - name: Exercise the remote Herdr user-install admission script with Darwin stat
        if: runner.os == 'macOS'
        run: "cargo test --locked -p lazysh --lib herdr_path::"
      - name: Exercise native local PTY and ConPTY lifecycle
        run: bunx moon run client-native:test-local
      # Hook writes are Linux-verified (a debug companion is over the 64 MiB hook-setup bound); Windows manages only the plugin providers and reports the others template-only.
      - name: Exercise the companion on this device through real local sessions
        shell: bash
        env:
          LAZYSH_TEST_AGENT_BIN: ${{ github.workspace }}/target/debug/lazysh-agent${{ runner.os == 'Windows' && '.exe' || '' }}
          LAZYSH_TEST_FAKE_SDK_BIN: ${{ github.workspace }}/target/debug/examples/fake_android_sdk${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          cargo build --locked -p lazysh-agent --bin lazysh-agent --example fake_android_sdk
          cases=(companion::local::tests::real_local_companion_serves_the_board_transcripts_and_settings_without_a_shell companion::local::tests::real_local_companion_lists_devices_and_streams_frames_until_stopped_or_the_session_closes)
          if [ "$RUNNER_OS" = Windows ]; then cases+=(companion::local::tests::real_local_hook_setup_on_windows_is_template_only); fi
          for case_name in "${cases[@]}"; do
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact
          done
      - name: Exercise the Windows companion adapter through real cmd.exe and Windows PowerShell
        if: runner.os == 'Windows'
        shell: bash
        env:
          LAZYSH_TEST_AGENT_BIN: ${{ github.workspace }}/target/debug/lazysh-agent.exe
        run: |
          for case_name in companion::powershell::native_tests::real_windows_shells_identify_the_host_through_the_encoded_probe companion::powershell::native_tests::real_windows_shells_run_the_companion_with_every_argument_and_its_exit_status companion::powershell::native_tests::real_windows_shells_read_the_managed_namespace_and_run_what_it_admits_before_the_path; do
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact
          done
      # Native Zellij and Herdr on a ConPTY through the client's own local session (#1925). Non-blocking until its first hosted pass is recorded there.
      - name: Install the pinned Windows Zellij 0.45.1 and Herdr 0.9.5 releases outside the checkout
        id: windows-multiplexers
        if: runner.os == 'Windows' && !cancelled()
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'lazysh-windows-multiplexers'
          function Install-Pinned($name, $url, $sha256) {
            $directory = Join-Path $root $name
            New-Item -ItemType Directory -Force $directory | Out-Null
            $archive = Join-Path $root "$name.zip"
            Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 5
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $sha256) { throw "$name archive digest mismatch" }
            # The conpty directory stays beside herdr.exe.
            Expand-Archive -LiteralPath $archive -DestinationPath $directory
            $directory
          }
          $zellij = Install-Pinned 'zellij' 'https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-x86_64-pc-windows-msvc.zip' 'b854e7b223e67d0705c5f685ef50541c38a57981b13624d09c92bed419b6f80d'
          $herdr = Install-Pinned 'herdr' 'https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-windows-x86_64.zip' 'd2c6c9c971c43a0bfdde8c692a9a1a7a45c3e4807cd01ae45662b4734fac1cbf'
          if ((& "$zellij\zellij.exe" --version) -ne 'zellij 0.45.1') { throw 'unexpected Zellij version' }
          if ((& "$herdr\herdr.exe" --version) -ne 'herdr 0.9.5') { throw 'unexpected Herdr version' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $zellij, $herdr
      - name: Exercise native Zellij and Herdr through a local ConPTY session
        if: runner.os == 'Windows' && !cancelled() && steps.windows-multiplexers.outcome == 'success'
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: |
          for case_name in local::attach_tests::real::real_local_zellij_lists_attaches_and_switches_a_tab local::attach_tests::real::real_local_herdr_lists_attaches_and_creates_a_workspace local::attach_tests::real::real_windows_local_session_offers_no_tmux_and_refuses_a_tmux_attach; do
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact
          done
      # The adapter above runs through `cmd /c` and `powershell -Command`; this one runs it through the server's own command
      # line, under each default shell in turn. Every case runs and each failure names its shell; a skipped case fails too.
      - name: Exercise the app against an owned Windows OpenSSH server under cmd.exe and Windows PowerShell
        if: runner.os == 'Windows' && !cancelled()
        shell: bash
        env:
          LAZYSH_TEST_AGENT_BIN: ${{ github.workspace }}/target/debug/lazysh-agent.exe
        run: |
          failed=0
          for case_name in default_shell_returns_the_machines_own_value_or_its_absence_on_every_exit_path windows_openssh_under_cmd_exe_identifies_the_host_and_runs_the_companion windows_openssh_under_windows_powershell_identifies_the_host_and_runs_the_companion; do
            case_path=ssh::tests::windows_openssh_fixture::$case_name
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_path" -- --list --ignored --exact | grep -Fx -- "$case_path: test" || { echo "::error::$case_name is not an ignored case of the client"; failed=1; continue; }
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_path" -- --ignored --exact || { echo "::error::$case_name failed"; failed=1; }
          done
          exit $failed
      - name: Verify uploaded paths through the owned Mac host clipboard
        if: runner.os == 'macOS'
        env:
          LAZYSH_TEST_OWNED_MAC_CLIPBOARD: "1"
        run: bunx moon run client-native:test-host-clipboard
      - name: Exercise native display-idle ownership and platform API release
        run: bunx moon run display-idle:test-rust
      - name: Exercise native resume policy persistence and cancellation
        run: bunx moon run client-native:test-resume-policy
      - name: Exercise Parakeet on Windows x86_64
        if: runner.os == 'Windows'
        timeout-minutes: 60
        uses: ./.github/actions/windows-parakeet
      # An earlier native step of this job leaves %LOCALAPPDATA%\app.lazysh.client behind empty (the listing in the GUI case's own failure
      # showed no entry, run 45315364166, #2484), and the GUI case refuses any application data it did not create. Only an empty directory is
      # removed: one that holds anything stays and the case reports it.
      - name: Remove the empty application data directory earlier steps left
        if: runner.os == 'Windows' && !cancelled() && steps.windows-installer.outcome == 'success'
        shell: pwsh
        run: |
          $directory = Join-Path $env:LOCALAPPDATA 'app.lazysh.client'
          if (Test-Path -LiteralPath $directory) {
            try { [System.IO.Directory]::Delete($directory, $false); "removed the empty $directory" }
            catch { "kept $directory (not empty or in use): $($_.Exception.Message)" }
          }
      # Last, and keyed on the installer step, so an unrelated native failure neither hides nor causes it.
      # Blocking since it passed in a `main` run (43790076928, #1632); a failure here fails the job.
      - name: Exercise the installed Windows application GUI
        if: runner.os == 'Windows' && !cancelled() && steps.windows-installer.outcome == 'success'
        # A composite step cannot carry its own timeout: the runner rejects the manifest. This bounds the driver install and the case.
        timeout-minutes: 30
        uses: ./.github/actions/windows-installed-gui
      # The SSH server the Windows GUI SSH case will connect to. Non-blocking until its first qualifying hosted pass is recorded on #1632.
      - name: Exercise the owned Windows OpenSSH server fixture
        if: runner.os == 'Windows' && !cancelled() && steps.windows-installer.outcome == 'success'
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        env:
          LAZYSH_TEST_WINDOWS_SSH: '1'
        run: bun test tests/windows-ssh-server.test.ts --test-name-pattern 'owned Windows OpenSSH server'

  # A Windows client against a real Linux host (#1747). windows-latest has no Linux machine, so
  # the host is a WSL Ubuntu with an unprivileged OpenSSH server, tmux, the pinned Zellij and the
  # same-run stock Herdr, started by .github/scripts/external-linux-host.sh. The Rust client under
  # test runs natively on Windows and reaches it over loopback.
  # Non-blocking until its first qualifying hosted pass is recorded on #1747; then remove continue-on-error.
  native-windows-linux-host:
    needs: [changes, herdr-native]
    if: needs.changes.outputs.desktop == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - *source-bun
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: *rust-cache-main
      - run: bun install --frozen-lockfile
      - run: bun run build:native
      - *stock-herdr-guard
      - *stock-herdr-download
      - *stock-herdr-verify
      - uses: ./.github/actions/windows-linux-host
        with:
          herdr: ${{ runner.temp }}\lazysh-stock-herdr\herdr

  native-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - *source-bun
      - &android-toolchains
        id: android-toolchains
        uses: ./.github/actions/android-toolchains
      - &android-cache-identity
        name: Fingerprint Android native build tools
        run: |
          cmake_identity=$(cmake --version)
          clang_identity=$("$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version)
          host_glibc=$(getconf GNU_LIBC_VERSION)
          host_arch=$(uname -m)
          toolchain_digest=$(printf '%s\n' "$NDK_HOME" "$cmake_identity" "$clang_identity" "$host_glibc" "$host_arch" | sha256sum)
          printf 'LAZYSH_ANDROID_TOOLCHAIN=%s\n' "${toolchain_digest%% *}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: LAZYSH_ANDROID_TOOLCHAIN
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      - run: bun run build:android
      - name: Inspect normal Android Google push graph and packaged classes
        run: LAZYSH_ANDROID_PUSH_VARIANT=google bunx moon run client:test-android-push-artifact
      - run: ./gradlew :tauri-plugin-lazysh-vault:testDebugUnitTest --no-daemon
        working-directory: apps/client/src-tauri/gen/android
      - name: Exercise native Android ingress and compiled startup log policy
        run: ./gradlew :tauri-plugin-deep-link:testDebugUnitTest :tauri-plugin-lazysh-push:testDebugUnitTest :app:testUniversalDebugUnitTest :app:testUniversalReleaseUnitTest -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false --no-daemon
        working-directory: apps/client/src-tauri/gen/android
      - uses: actions/upload-artifact@v4
        with:
          name: lazysh-android-debug-arm64
          path: |
            apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/push-artifact/google.json

  native-android-runtime:
    needs: [changes, herdr-native]
    if: needs.changes.outputs.android_runtime == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    # Every guarded case passing needs more than 30 minutes of test time after an ~8 minute setup, and the GitHub-hosted emulator cancelled it at 40 minutes with no verdict.
    timeout-minutes: 75
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: guarded
      LAZYSH_ANDROID_UI_COMPANION: '1'
      VITE_LAZYSH_QR_CAMERA_TRACE: '1'
      LAZYSH_ANDROID_RUNTIME_ARTIFACT: lazysh-android-runtime-results
      GUARDED_HERDR_SHA256: ${{ needs.herdr-native.outputs.guarded-sha256 }}
    steps: &android-owned-runtime-steps
      - &source-checkout
        uses: actions/checkout@v4
      - *source-bun
      - *android-toolchains
      - &android-owned-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - &android-owned-host-dependencies
        name: Install native Mosh fixture dependencies
        run: sudo sh .github/scripts/apt-install.sh openssh-server openssh-client iproute2 mosh bubblewrap libnss-wrapper protobuf-compiler libprotobuf-dev libssl-dev zlib1g-dev libncurses-dev pkg-config cmake perl libsodium-dev libunwind-dev libutempter-dev
      - &android-owned-namespace
        name: Verify native GUI namespace prerequisites
        env:
          LAZYSH_NATIVE_NAMESPACE_NETWORK: shared
        run: *native-fixture-namespace
      - *pinned-download-cache
      - uses: ./.github/actions/ghostty-zig
        if: env.LAZYSH_ANDROID_UI_NATIVE_TMUX == '1'
        with:
          link-source: 'true'
      - name: Give the native tmux APK the pinned NDK
        if: env.LAZYSH_ANDROID_UI_NATIVE_TMUX == '1'
        run: echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
      - *official-mosh-fixture
      - name: Build the pinned official ET 7.0.0 fixture outside the checkout
        if: env.LAZYSH_ANDROID_RUNTIME_OWNER == 'ssh-parity'
        timeout-minutes: 15
        run: sh .github/scripts/build-official-et.sh
      - name: Install the distribution tmux and pinned tmux build dependencies
        if: env.LAZYSH_ANDROID_RUNTIME_OWNER == 'tmux'
        run: sudo sh .github/scripts/apt-install.sh --no-update tmux libevent-dev bison
      - name: Build the pinned official tmux fixture outside the checkout
        if: env.LAZYSH_ANDROID_RUNTIME_OWNER == 'tmux'
        timeout-minutes: 10
        run: *pinned-tmux-build
      - name: Install the pinned official rmux 0.10.0 release outside the checkout
        if: env.LAZYSH_ANDROID_RUNTIME_OWNER == 'tmux'
        # Release asset digest: https://github.com/Helvesec/rmux/releases/download/v0.10.0/SHA256SUMS
        run: &pinned-rmux-install |
          rmux_root=$(mktemp -d "$RUNNER_TEMP/lazysh-rmux-0.10.0-XXXXXX")
          sh .github/scripts/pinned-download.sh 1bec11eff08c3313c3a400196e7a93d00b8ad4a24f81ef13debb03355c2696c5 "$rmux_root/rmux.tar.gz" --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 16253094 https://github.com/Helvesec/rmux/releases/download/v0.10.0/rmux-0.10.0-linux-x86_64.tar.gz
          test "$(stat -c%s "$rmux_root/rmux.tar.gz")" -eq 16253094
          printf '%s  %s\n' '1bec11eff08c3313c3a400196e7a93d00b8ad4a24f81ef13debb03355c2696c5' "$rmux_root/rmux.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$rmux_root/rmux.tar.gz" --directory "$rmux_root" --no-same-owner --no-same-permissions
          # The installer keeps bin/, libexec/ and the daemon together; a copied bare binary cannot reach its full CLI.
          "$rmux_root/rmux-0.10.0-linux-x86_64/install.sh" --prefix "$rmux_root/install"
          test "$("$rmux_root/install/bin/rmux" capabilities --json | jq -r '.version, .wire_version' | paste -sd' ')" = '0.10.0 8'
          echo "$rmux_root/install/bin" >> "$GITHUB_PATH"
          echo "LAZYSH_TEST_RMUX=$rmux_root/install/bin/rmux" >> "$GITHUB_ENV"
      - *android-cache-identity
      # Emulator jobs on one runner image build the same x86_64 APK and host companion, so
      # they share one cache (the toolchain fingerprint separates images) saved only from main
      # by the broadest job per image; standalone Mosh builds only its transport tests.
      - &android-owned-cache
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: LAZYSH_ANDROID_TOOLCHAIN
          shared-key: ${{ github.job == 'native-android-mosh' && 'android-mosh' || 'android-emulator' }}
          save-if: ${{ github.ref == 'refs/heads/main' && contains(fromJSON('["native-android-runtime","native-android-mosh","native-android-auxiliary"]'), github.job) }}
      - run: bun install --frozen-lockfile
      - name: Validate producer artifact ID
        if: env.LAZYSH_ANDROID_RUNTIME_OWNER == 'guarded'
        env:
          HERDR_ARTIFACT_ID: ${{ needs.herdr-native.outputs.guarded-id }}
        run: *herdr-artifact-id-guard
      - uses: actions/download-artifact@v4
        if: env.LAZYSH_ANDROID_RUNTIME_OWNER == 'guarded'
        with: *guarded-herdr-download
      - name: Verify same-run guarded Herdr
        if: env.LAZYSH_ANDROID_RUNTIME_OWNER == 'guarded'
        run: |
          cd "$RUNNER_TEMP/lazysh-guarded-herdr"
          printf '%s  herdr\n' "$GUARDED_HERDR_SHA256" | sha256sum --check --strict
          chmod 700 herdr
          cd "$GITHUB_WORKSPACE"
          printf '%s\n' "LAZYSH_TEST_HERDR=$RUNNER_TEMP/lazysh-guarded-herdr/herdr" "LAZYSH_ANDROID_UI_HERDR=1" >> "$GITHUB_ENV"
      - &android-owned-companion
        name: Build real companion and receiver for owned Android cases
        run: |
          cargo test --locked -p lazysh-agent --example owned_terminal_receiver
          cargo build --locked -p lazysh-agent --bins --example owned_terminal_receiver
          printf '%s\n' "LAZYSH_TEST_AGENT_BIN=$GITHUB_WORKSPACE/target/debug/lazysh-agent" "LAZYSH_TEST_RECEIVER_BIN=$GITHUB_WORKSPACE/target/debug/examples/owned_terminal_receiver" >> "$GITHUB_ENV"
        if: env.LAZYSH_ANDROID_RUNTIME_OWNER != 'mosh' && env.LAZYSH_ANDROID_RUNTIME_OWNER != 'tmux' && env.LAZYSH_ANDROID_RUNTIME_OWNER != 'ssh-parity'
      # The tmux owner needs only the companion binary: it reads the synthetic transcript the Chat case opens.
      # The owned device case runs `lazysh-agent devices ...` over its own sshd; no receiver or companion install is needed.
      - name: Build the real companion for the owned tmux Chat and device cases
        if: (env.LAZYSH_ANDROID_RUNTIME_OWNER == 'tmux' && env.LAZYSH_ANDROID_UI_NATIVE_TMUX != '1') || env.LAZYSH_ANDROID_RUNTIME_OWNER == 'ssh-parity'
        run: |
          cargo build --locked -p lazysh-agent --bin lazysh-agent
          printf '%s\n' "LAZYSH_TEST_AGENT_BIN=$GITHUB_WORKSPACE/target/debug/lazysh-agent" >> "$GITHUB_ENV"
      - name: Build the real share service for the owned sharing case
        if: env.LAZYSH_ANDROID_RUNTIME_OWNER == 'ssh-parity'
        run: |
          cargo build --locked -p lazysh-share
          printf '%s\n' "LAZYSH_TEST_SHARE_BIN=$GITHUB_WORKSPACE/target/debug/lazysh-share" >> "$GITHUB_ENV"
      - &android-owned-kvm
        name: Grant this runner access to KVM
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
      - &android-runtime-emulator
        name: Run native Android instrumentation
        uses: mihazs/lazysh-android-emulator-runner@46beb5d59b664ea61462125a023549a5a7b0418b
        with:
          # NativeActivityFixture owns screen/keyguard readiness; avoid early MENU input.
          unlock-screen: false
          api-level: &android-owned-api 36
          target: &android-owned-image default
          arch: &android-owned-arch x86_64
          profile: &android-owned-profile pixel_2
          avd-name: &android-owned-avd lazysh-runtime-api36
          emulator-port: &android-owned-port 5580
          ram-size: &android-owned-ram 3072M
          emulator-boot-timeout: &android-owned-boot 300
          disable-linux-hw-accel: &android-owned-acceleration false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -accel on -camera-back imagefile:${{ github.workspace }}/apps/client/src-tauri/fixtures/theme-qr-camera-feed.png -camera-front none -qemu -pidfile ${{ runner.temp }}/lazysh-qr-emulator.pid
          pre-emulator-launch-script: $ANDROID_HOME/emulator/emulator -accel-check
          # The action runs each newline in a separate shell; fold this into one
          # invocation so cleanup runs before the action terminates the emulator.
          script: >-
            bash -c '
            sh .github/scripts/android-await-systemui.sh || exit 1;
            diagnostic_dir="apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/system-diagnostics";
            mkdir -p "$diagnostic_dir";
            capture() {
            local name="$1"; shift;
            (ulimit -c 0; ulimit -f 1024; exec timeout --kill-after=2s 10s "$@") > "$diagnostic_dir/$name.txt" 2>&1;
            local code=$?;
            printf "%s exit=%s\n" "$name" "$code" >> "$diagnostic_dir/status.txt";
            };
            watchdog() {
            local sleeper;
            sleep "${LAZYSH_ANDROID_WATCHDOG_SECONDS:-3480}" & sleeper=$!;
            trap "kill $sleeper 2>/dev/null; exit 0" TERM;
            wait $sleeper || exit 0;
            printf "watchdog fired at %s\n" "$(date -u +%FT%TZ)" >> "$diagnostic_dir/status.txt";
            capture watchdog-current-test adb shell "logcat -d -s TestRunner:I | tail -n 6";
            capture watchdog-logcat adb shell "logcat -d -t 500";
            capture watchdog-adb-root adb root;
            capture watchdog-threads adb shell "for p in \$(pidof app.lazysh.client); do kill -3 \$p; debuggerd -b \$p; top -H -b -n 1 -p \$p | head -n 60; done; sleep 3; ls -l /data/anr; tail -c 524288 /data/anr/* 2>/dev/null";
            capture watchdog-activity adb shell dumpsys activity top;
            capture watchdog-window adb shell "dumpsys window windows | head -n 300";
            capture watchdog-processes adb shell "ps -A | grep -E \"lazysh|instrument|systemui\"";
            capture watchdog-ui adb exec-out uiautomator dump /dev/tty;
            (ulimit -c 0; exec timeout --kill-after=2s 10s adb exec-out screencap -p) > "$diagnostic_dir/watchdog-screen.png" 2>/dev/null;
            };
            cleanup() {
            local result=$?;
            trap - EXIT INT TERM;
            kill "$watchdog_pid" 2>/dev/null || true;
            wait "$watchdog_pid" 2>/dev/null || true;
            if (( result != 0 )); then
            capture kernel-load adb shell "date -u; cat /proc/uptime /proc/loadavg /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory";
            capture cpu-load adb shell dumpsys cpuinfo;
            capture lastanr adb shell dumpsys activity lastanr;
            capture lastanr-traces adb shell dumpsys activity lastanr-traces;
            capture adb-server-log tail -c 1048576 "${TMPDIR:-/tmp}/adb.$(id -u).log";
            capture focus-windows adb shell "dumpsys window windows | grep -E \"mCurrentFocus|mFocusedApp|Window #\"";
            capture focus-activity-top adb shell dumpsys activity activities;
            capture focus-displays adb shell dumpsys window displays;
            capture focus-ui adb exec-out uiautomator dump /dev/tty;
            capture adb-root adb root;
            capture app-threads adb shell "for p in \$(pidof app.lazysh.client); do kill -3 \$p; debuggerd -b \$p; done; sleep 3; ls -l /data/anr; tail -c 524288 /data/anr/* 2>/dev/null";
            fi;
            kill %1 2>/dev/null || true;
            wait "$collector_pid"; local collector_result=$?;
            printf "collector exit=%s; test exit=%s\n" "$collector_result" "$result" >> "$diagnostic_dir/status.txt";
            exit "$result";
            };
            trap cleanup EXIT;
            trap "exit 130" INT;
            trap "exit 143" TERM;
            (ulimit -c 0; ulimit -f 1024; exec timeout --kill-after=2s 1800s adb logcat
            -b main -b system -b events -v threadtime
            "ActivityManager:E" "InputDispatcher:W" "WindowManager:W" "am_anr:I" "*:S")
            > "$diagnostic_dir/system-anr.txt" 2> "$diagnostic_dir/collector-errors.txt" &
            collector_pid=$!;
            watchdog & watchdog_pid=$!;
            capture start-load adb shell "date -u; cat /proc/uptime /proc/loadavg /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory";
            sh .github/scripts/android-dismiss-error-dialogs.sh;
            case "$LAZYSH_ANDROID_RUNTIME_OWNER" in
            herdr-navigation) bun run test:android-herdr-navigation; exit $? ;;
            tmux) if [[ "${LAZYSH_ANDROID_UI_NATIVE_TMUX:-0}" == 1 ]]; then bun run test:android-native-tmux; else bun run test:android-tmux; fi; exit $? ;;
            zellij) if [[ "${LAZYSH_ANDROID_UI_NATIVE_ZELLIJ:-0}" == 1 ]]; then bun run test:android-native-zellij; else bun run test:android-zellij; fi; exit $? ;;
            terminal-core) bun run test:android-terminal-core:ci; exit $? ;;
            terminal-session) bun run test:android-native-session:ci; exit $? ;;
            ssh-parity) bun run test:android-ssh-parity; exit $? ;;
            mosh) bun run test:android-mosh; exit $? ;;
            guarded) bun run test:android-ssh; exit $? ;;
            biometric) bun run test:android-biometric; exit $? ;;
            appium) LAZYSH_ANDROID_QR_EMULATOR_PID_FILE="$RUNNER_TEMP/lazysh-qr-emulator.pid" bun run test:mobile-e2e:ci; exit $? ;;
            auxiliary) ;;
            *) printf "%s\n" "Unknown Android runtime owner" >&2; exit 1 ;;
            esac;
            bun run test:android-fdroid;
            fdroid_result=$?;
            if (( fdroid_result != 0 )); then exit "$fdroid_result"; fi;
            LAZYSH_ANDROID_QR_EMULATOR_PID_FILE="$RUNNER_TEMP/lazysh-qr-emulator.pid" bun run test:android-qr || exit $?;
            bun run test:android-voice || exit $?;
            for device_case in devices::tests::android_owned_emulator_inventory_and_screenshot devices::android::tests::owned_device::owned_emulator_video_delivers_frames_while_idle_and_after_a_change devices::tests::android_owned_emulator_video_gestures_follow_the_display_size; do
            LAZYSH_TEST_ANDROID_SERIAL="$ANDROID_SERIAL" cargo test --locked -p lazysh-agent --lib "$device_case" -- --ignored --exact --nocapture || exit $?;
            done;
            exit 0;
            '
      - name: Save Gradle dependency and wrapper downloads from main
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && env.LAZYSH_ANDROID_RUNTIME_OWNER == 'guarded' && steps.android-toolchains.outputs.gradle-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.android-toolchains.outputs.gradle-cache-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.LAZYSH_ANDROID_RUNTIME_ARTIFACT }}
          path: &android-runtime-result-paths |
            apps/client/src-tauri/gen/android/app/build/reports/androidTests/
            apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn

  native-android-mosh:
    needs: changes
    if: needs.changes.outputs.android_mosh == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: mosh
      LAZYSH_ANDROID_RUNTIME_ARTIFACT: lazysh-android-mosh-results
    steps: *android-owned-runtime-steps

  native-android-herdr-navigation:
    needs: [changes, herdr-native]
    if: needs.changes.outputs.android_herdr == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5580
      CARGO_BUILD_JOBS: '2'
      LAZYSH_ANDROID_RUNTIME_OWNER: herdr-navigation
    steps:
      - *source-checkout
      - *source-bun
      - *android-toolchains
      - *android-owned-rust
      - *android-owned-host-dependencies
      - *android-owned-namespace
      - *android-cache-identity
      - *android-owned-cache
      - run: bun install --frozen-lockfile
      - *stock-herdr-guard
      - *stock-herdr-download
      - *stock-herdr-verify
      - *android-owned-companion
      - *android-owned-kvm
      - *android-runtime-emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazysh-android-herdr-navigation-results
          path: *android-runtime-result-paths
          if-no-files-found: warn
          retention-days: 3

  # The real terminal core inside the packaged app (#2145): the app built with the optional native-terminal feature for arm64
  # (compiled and linked, never run) and x86_64, and the NativeTerminalCoreTest case, which opens a core through the renderer's IPC
  # and reads back what the app's core parsed from an owned OpenSSH shell. Zig 0.16.0 and the admitted Ghostty archives come from the
  # steps of herdr-native (aliases), as in native-terminal-bridge; the pinned NDK from the Android toolchains action. Both APKs are
  # built before the emulator boots. Not a required check, like the bridge job.
  native-android-terminal-core:
    needs: changes
    if: needs.changes.outputs.android_terminal_core == 'true'
    runs-on: ubuntu-22.04
    # Two cold app builds with Zig, then the emulator.
    timeout-minutes: 60
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: terminal-core
    steps:
      - *source-checkout
      - *source-bun
      - *pinned-download-cache
      - *ghostty-zig-checkout
      - *rust-release-manifest
      # Only the version check of the Zig provisioning needs 1.96.1; the app builds with stable, set as the default next.
      - *rust-1-96-1
      - *android-toolchains
      # The runner image presets ANDROID_NDK_HOME to its own NDK, which libghostty-vt's Zig build reads first.
      - name: Make the Zig build use the pinned NDK
        run: echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
      - *android-owned-rust
      - run: rustup target add aarch64-linux-android
      - *android-owned-host-dependencies
      - *android-cache-identity
      - *android-owned-cache
      - run: bun install --frozen-lockfile
      - name: Build the arm64 debug app with the terminal core (compiled and linked, not run)
        run: sh .github/scripts/retry-zig-fetch.sh bun run build:android:terminal-core
      - run: sh .github/scripts/native-lib-size.sh arm64-v8a
      # The control of native-android-release-core's check that a release library has no debug software-GPU switch.
      - name: The debug library carries the software-GPU switch
        run: sh .github/scripts/software-gpu-switch.sh present apps/client/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/liblazysh_lib.so
      # Measured and not needed again; the runner's disk is shared with the x86_64 build, the emulator image and Gradle.
      - run: rm -rf target/aarch64-linux-android apps/client/src-tauri/gen/android/app/build
      - name: Build the x86_64 debug app with the terminal core
        run: sh .github/scripts/retry-zig-fetch.sh bun run build:android:emulator:terminal-core
      - run: sh .github/scripts/native-lib-size.sh x86_64
      - name: The debug library carries the software-GPU switch
        run: sh .github/scripts/software-gpu-switch.sh present apps/client/src-tauri/gen/android/app/src/main/jniLibs/x86_64/liblazysh_lib.so
      - *android-owned-kvm
      - *android-runtime-emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazysh-android-terminal-core-results
          path: *android-runtime-result-paths
          if-no-files-found: warn
          retention-days: 3
      # What the Waydroid lane installs (waydroid-lane.sh --apk): Waydroid cannot run the arm64 artifact of native-android.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lazysh-android-debug-x86_64
          path: |
            apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            apps/client/src-tauri/gen/android/app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  # The first native session through the real UI (#2093, #1327): the app built with the terminal core for x86_64 and the cases of
  # NativeTerminalSessionTest, which choose Native in Settings, connect to an owned OpenSSH through the page, check the pixels the
  # renderer drew on the surface and type into it. A job of its own and not a required check: its verdict is the native engine's, and
  # it must not share native-android-runtime's flaky oracles. The CI emulator has no GPU the shipping policy accepts, so the case asks
  # for the debug software-GPU switch (software-gpu-switch.sh keeps that switch out of the release engine).
  native-android-terminal-session:
    needs: changes
    if: needs.changes.outputs.android_terminal_session == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: terminal-session
    steps:
      - *source-checkout
      - *source-bun
      - *pinned-download-cache
      - *ghostty-zig-checkout
      - *rust-release-manifest
      - *rust-1-96-1
      - *android-toolchains
      - name: Make the Zig build use the pinned NDK
        run: echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
      - *android-owned-rust
      - *android-owned-host-dependencies
      # The native tmux case starts tmux from the owned shell, which is the runner's own.
      - run: sudo sh .github/scripts/apt-install.sh tmux
      - *android-cache-identity
      - *android-owned-cache
      - run: bun install --frozen-lockfile
      - name: Build the x86_64 debug app with the terminal core
        run: sh .github/scripts/retry-zig-fetch.sh bun run build:android:emulator:terminal-core
      - *android-owned-kvm
      - *android-runtime-emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazysh-android-terminal-session-results
          path: *android-runtime-result-paths
          if-no-files-found: warn
          retention-days: 7

  # The Android release APKs with the native terminal engine (#2306): the release workflow's own build commands (release profile,
  # unsigned), the size ceiling it enforces and the engine check it makes, which release-artifacts.yml cannot show on a pull request.
  # Built twice, with the kill switch on and off (#1342): the rehearsal of the rollback of docs/install-and-update.md, "Maintainers".
  # Selected only by a pull request that changes the release build configuration (native-changes.sh), never by a push. Nothing runs on a device here.
  native-android-release-core:
    needs: changes
    if: needs.changes.outputs.android_release_native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # The kill switch (#1342) is rehearsed with the release: built with `off`, the very APK that carries the engine with `on` must not.
      fail-fast: false
      matrix:
        flavor: [google, foss]
        kill-switch: [on, off]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CARGO_BUILD_JOBS: '4'
      LAZYSH_NATIVE_TERMINAL: ${{ matrix.kill-switch }}
    steps:
      - *source-checkout
      - *source-bun
      - *pinned-download-cache
      - *ghostty-zig-checkout
      - *android-toolchains
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: bun install --frozen-lockfile
      - name: Build the ${{ matrix.flavor }} release APK as release-artifacts.yml does
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          export CMAKE_ANDROID_NDK="$NDK_HOME" ANDROID_NDK_HOME="$NDK_HOME" WHISPER_DONT_GENERATE_BINDINGS=1
          features=parakeet-android,native-terminal
          if [ "$FLAVOR" = foss ]; then features=fdroid,native-terminal; fi
          sh .github/scripts/retry-zig-fetch.sh bun run --cwd apps/client tauri android build --target aarch64 --apk --ci --features "$features" -- --locked
      - run: sh .github/scripts/native-lib-size.sh arm64-v8a
      - name: Hold the APK to the release size ceiling
        run: bun .github/scripts/apk-budget.ts android-${{ matrix.flavor }}-arm64 apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
      - name: Hold the APK to the engine its kill switch calls for
        run: bun .github/scripts/apk-engine.ts apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk ${{ matrix.flavor }} "$LAZYSH_NATIVE_TERMINAL"
      # The release engine has no way to draw on a CPU rasterizer: the debug switch is not compiled in (native_renderer.rs).
      - name: The release APK carries no software-GPU switch
        run: sh .github/scripts/software-gpu-switch.sh absent apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  # Owned OpenSSH password, encrypted-key, rotated-key, bastion, agent-forwarding, Auto-fallback and
  # forced-ET parity cases (#985), the browser preview forward and teardown case (#994) and the
  # Device panel inventory and capture case (#1730) on the emulator; separate so their verdict is
  # attributable.
  native-android-ssh-parity:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-22.04
    # Includes the official ET 7.0.0 build.
    timeout-minutes: 45
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: ssh-parity
      LAZYSH_ANDROID_RUNTIME_ARTIFACT: lazysh-android-ssh-parity-results
    steps: *android-owned-runtime-steps

  # Owned pinned tmux on the emulator; separate so its verdict is attributable.
  native-android-tmux:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: tmux
      LAZYSH_ANDROID_RUNTIME_ARTIFACT: lazysh-android-tmux-results
    steps: *android-owned-runtime-steps

  # The tmux controls on the native engine, separate from the xterm.js lane (#2500).
  native-android-terminal-tmux:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: tmux
      LAZYSH_ANDROID_UI_NATIVE_TMUX: '1'
      LAZYSH_ANDROID_RUNTIME_ARTIFACT: lazysh-android-native-tmux-results
    steps: *android-owned-runtime-steps

  # Owned pinned Zellij 0.45.1 on the emulator (#1645); separate so its verdict is attributable. It needs no companion
  # or tmux build: the session, its two tabs and the host readback come from the owned fixture and the pinned release.
  native-android-zellij:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: zellij
      LAZYSH_ANDROID_ZELLIJ_ARTIFACT: lazysh-android-zellij-results
    steps: &android-owned-zellij-steps
      - *source-checkout
      - *source-bun
      - *android-toolchains
      - *android-owned-rust
      - *android-owned-host-dependencies
      - *android-owned-namespace
      - *pinned-download-cache
      - uses: ./.github/actions/ghostty-zig
        if: env.LAZYSH_ANDROID_UI_NATIVE_ZELLIJ == '1'
        with:
          link-source: 'true'
      - name: Give the native Zellij APK the pinned NDK
        if: env.LAZYSH_ANDROID_UI_NATIVE_ZELLIJ == '1'
        run: echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
      - *pinned-zellij
      - run: bun install --frozen-lockfile
      - *android-cache-identity
      - *android-owned-cache
      - *android-owned-kvm
      - *android-runtime-emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.LAZYSH_ANDROID_ZELLIJ_ARTIFACT }}
          path: *android-runtime-result-paths
          if-no-files-found: warn
          retention-days: 3
  native-android-terminal-zellij:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: zellij
      LAZYSH_ANDROID_UI_NATIVE_ZELLIJ: '1'
      LAZYSH_ANDROID_ZELLIJ_ARTIFACT: lazysh-android-native-zellij-results
    steps: *android-owned-zellij-steps


  # The Appium + WebdriverIO device suite (ADR 0002, #1412) on the same API 36 emulator, with owned SSH and stock Herdr hosts
  # and the real companion. Report-only: not a required check until it has passed 20 consecutive runs of main and the
  # maintainer adds it to the ruleset (docs/android-testing.md, "Appium suite in CI"). Pull requests run the smoke and
  # regression tiers; main and the nightly run add journeys.
  native-android-appium:
    needs: [changes, herdr-native]
    if: needs.changes.outputs.android_appium == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    # Below native-android-runtime's 40 minutes; a cancelled job retains no verdict.
    timeout-minutes: 38
    strategy:
      fail-fast: *pull-request-fail-fast
      matrix:
        # One emulator serves one session, so each shard is its own job. Sharding is wired (wdio --shard) but off: list
        # '1/2' and '2/2' here, and the job count in tests/native-changes.test.ts, once the wall time passes 25 minutes.
        shard: ['1/1']
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: appium
      LAZYSH_E2E_RUN: gating
      LAZYSH_E2E_FLAKY: exclude
      LAZYSH_E2E_SHARD: ${{ matrix.shard }}
      LAZYSH_E2E_TIERS: ${{ github.event_name == 'pull_request' && 'smoke,regression' || 'smoke,regression,journeys' }}
      LAZYSH_E2E_APK: ${{ github.workspace }}/apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
      # The upload step appends the shard's job index, so every shard keeps its own artifact.
      MOBILE_E2E_ARTIFACT: lazysh-appium-gating-
    steps: &android-appium-steps
      - *source-checkout
      - *source-bun
      - run: bun install --frozen-lockfile
      # Appium and WebdriverIO run on Node; the runner image's default is not pinned.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - *android-toolchains
      - *android-owned-rust
      # The same-run stock Herdr is verified before anything is built on top of it.
      - *stock-herdr-guard
      - *stock-herdr-download
      - *stock-herdr-verify
      - *android-owned-host-dependencies
      - *android-owned-namespace
      - *android-cache-identity
      - *android-owned-cache
      - *android-owned-companion
      # Built before the emulator boots, so its minutes go to the suite. The Rust, Gradle and download caches are the ones
      # the other emulator jobs share.
      - name: Build the x86_64 debug APK
        run: bun run build:android:emulator
      - name: Install the pinned Appium UiAutomator2 driver
        run: bun run --cwd apps/client mobile-e2e:setup
      - *android-owned-kvm
      - *android-runtime-emulator
      # JUnit XML, failure screenshots, page sources, logcat and Appium logs, and the emulator's system diagnostics.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.MOBILE_E2E_ARTIFACT }}${{ strategy.job-index }}
          path: |
            apps/client/mobile-e2e/reports/
            apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/system-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  # Quarantined (@flaky) Appium specs: only on main and the nightly, only while one carries the tag (native-changes.sh),
  # and never a verdict (continue-on-error), so a flake under investigation cannot block anything.
  native-android-appium-quarantine:
    needs: [changes, herdr-native]
    if: needs.changes.outputs.android_appium_quarantine == 'true'
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 38
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: appium
      LAZYSH_E2E_RUN: quarantine
      LAZYSH_E2E_FLAKY: only
      LAZYSH_E2E_TIERS: smoke,regression,journeys
      LAZYSH_E2E_APK: ${{ github.workspace }}/apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
      MOBILE_E2E_ARTIFACT: lazysh-appium-quarantine
    steps: *android-appium-steps

  # Real-runtime suites outside native-linux, so one red suite cannot hide the others
  # and the GUI job is not lengthened. Every external fixture is pinned and verified.
  native-linux-runtimes:
    needs: [changes, herdr-native]
    if: needs.changes.outputs.linux_runtimes == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - *source-checkout
      - *source-bun
      - *pinned-download-cache
      - uses: ./.github/actions/parakeet-onnxruntime
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build, OpenSSH, nss_wrapper, tmux, login shell, official ET and tmux build dependencies
        run: sudo sh .github/scripts/apt-install.sh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev cmake libclang-dev libprotobuf-dev protobuf-compiler libssl-dev zlib1g-dev pkg-config openssh-server tmux git libsodium-dev libunwind-dev libutempter-dev libnss-wrapper zsh fish libncurses-dev libevent-dev bison
      - name: Build the pinned official ET 7.0.0 fixture outside the checkout
        timeout-minutes: 25
        run: sh .github/scripts/build-official-et.sh
      - name: Build the newest pinned official tmux 3.8 outside the checkout
        timeout-minutes: 10
        # Release asset digest: https://api.github.com/repos/tmux/tmux/releases/tags/3.8
        run: |
          tmux_root=$(mktemp -d "$RUNNER_TEMP/lazysh-tmux-3.8-XXXXXX")
          sh .github/scripts/pinned-download.sh e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e "$tmux_root/tmux-3.8.tar.gz" --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 895926 https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz
          test "$(stat -c%s "$tmux_root/tmux-3.8.tar.gz")" -eq 895926
          printf '%s  %s\n' 'e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e' "$tmux_root/tmux-3.8.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tmux_root/tmux-3.8.tar.gz" --directory "$tmux_root" --no-same-owner --no-same-permissions
          cd "$tmux_root/tmux-3.8"
          ./configure --prefix="$tmux_root/install"
          make -j4
          make install
          test "$("$tmux_root/install/bin/tmux" -V)" = 'tmux 3.8'
          # Kept off PATH: only the discovery step below runs it.
          echo "LAZYSH_TMUX_NEWEST=$tmux_root/install/bin/tmux" >> "$GITHUB_ENV"
      - *pinned-zellij
      - name: Install the pinned official rmux 0.10.0 release outside the checkout
        run: *pinned-rmux-install
      - *stock-herdr-guard
      - *stock-herdr-download
      - *stock-herdr-verify
      - name: Put the verified stock Herdr on PATH for lifecycle tests
        run: |
          echo "$RUNNER_TEMP/lazysh-stock-herdr" >> "$GITHUB_PATH"
          tmux -V
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-ubuntu-24.04-runtimes
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      - name: Build the client test binaries once
        run: cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --no-run
      # After bun install and the build, so a replaced fixture fails only the voice suites.
      # Not cached: the 0.6 GB download takes 4 to 14 s on a runner, about what restoring it costs, and every pull
      # request that missed saved its own copy, which evicted main's Rust caches (docs/architecture/build-caching.md).
      - name: Download and verify pinned public speech model fixtures
        # The pins live in .github/scripts/speech-fixtures.sh, which the owned Android voice run shares.
        env:
          LAZYSH_RUNTIME_FIXTURES: ${{ runner.temp }}/lazysh-runtime-fixtures
        run: |
          sh .github/scripts/speech-fixtures.sh "$LAZYSH_RUNTIME_FIXTURES" ggml-tiny.en.bin ggml-tiny.bin jfk.wav parakeet-v3-int8.tar.bz2
          printf '%s\n' "LAZYSH_WHISPER_TEST_MODEL=$LAZYSH_RUNTIME_FIXTURES/ggml-tiny.en.bin" "LAZYSH_WHISPER_TEST_MULTILINGUAL_MODEL=$LAZYSH_RUNTIME_FIXTURES/ggml-tiny.bin" "LAZYSH_WHISPER_TEST_WAV=$LAZYSH_RUNTIME_FIXTURES/jfk.wav" "LAZYSH_PARAKEET_TEST_ARCHIVE=$LAZYSH_RUNTIME_FIXTURES/parakeet-v3-int8.tar.bz2" >> "$GITHUB_ENV"
      - name: Exercise local sessions, files, Git review, attachments and previews through the host context
        if: ${{ !cancelled() }}
        run: |
          # Verify the complete inventory so a renamed or missing case cannot silently pass.
          actual=$(cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib host::tests::local:: -- --list | grep ': test$' | LC_ALL=C sort)
          printf '%s\n' \
            'host::tests::local::a_file_that_shrinks_during_a_local_download_fails_and_leaves_nothing: test' \
            'host::tests::local::a_filesystem_that_ignores_chmod_never_receives_a_private_attachment: test' \
            'host::tests::local::a_local_stream_hands_out_output_and_says_how_the_command_ended: test' \
            'host::tests::local::cancelling_a_local_download_stops_it_and_removes_the_partial_copy: test' \
            'host::tests::local::closing_or_dropping_a_local_stream_removes_a_child_that_ignores_end_of_input: test' \
            'host::tests::local::local_downloads_refuse_directories_unconfirmed_links_and_unconfirmed_large_files: test' \
            'host::tests::local::local_downloads_stage_exact_bytes_report_progress_and_never_run_or_overwrite: test' \
            'host::tests::local::local_exec_checks_revoked_lease_and_closed_session_before_spawn: test' \
            'host::tests::local::local_exec_is_cancelled_by_closing_the_session: test' \
            'host::tests::local::local_exec_over_its_deadline_times_out_and_reaps_the_child: test' \
            'host::tests::local::local_files_list_and_read_with_remote_bounds: test' \
            'host::tests::local::local_previews_proxy_http_report_discovery_and_stop_with_the_session: test' \
            'host::tests::local::local_repository_shows_changes_history_and_diffs_through_git_argv: test' \
            'host::tests::local::local_run_status_returns_a_failing_exit_as_data_where_run_refuses_it: test' \
            'host::tests::local::local_uploads_create_private_distinct_files_and_never_replace_one: test' \
            'host::tests::local::only_the_three_newest_finished_copies_stay_staged_for_other_apps: test' \
            'host::tests::local::wsl::a_distribution_reports_files_and_repository_only_when_git_starts_inside_it: test' \
            'host::tests::local::wsl::a_link_resolves_to_a_path_of_the_distribution_and_never_outside_it: test' \
            'host::tests::local::wsl::every_command_runs_through_wsl_exe_from_the_home_directory_with_its_environment: test' \
            'host::tests::local::wsl::files_and_a_repository_diff_are_read_inside_the_distribution: test' \
            'host::tests::local::wsl::only_this_distributions_paths_are_read_and_a_drive_path_is_translated_by_wslpath: test' | diff -u - <(printf '%s\n' "$actual")
          bunx moon run client-native:test-local
      # Each suite runs even when an earlier one fails, so a red suite hides none of the others.
      - name: Exercise SFTP, previews, teardown and Git diff over real OpenSSH
        if: ${{ !cancelled() }}
        run: bun run test:openssh
      # Owned loopback sshd with an nss_wrapper account; Mosh and ET stay off its PATH.
      - name: Exercise password, encrypted-key, rotated host-key, bastion, agent-forwarding and Auto fallback logins over real OpenSSH
        if: ${{ !cancelled() }}
        run: |
          # A renamed case must not turn this step into a zero-test pass.
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib ssh::tests::connection_parity_fixture::openssh_parity_ -- --list --ignored | grep -c ': test$' | grep -Fx 6
          bun run test:openssh-connections
      # Sign-in callback tunnels over real direct-tcpip channels to a fake OAuth server on an owned sshd.
      - name: Exercise sign-in tunnels, their request guard and teardown over real OpenSSH
        if: ${{ !cancelled() }}
        run: |
          # A renamed case must not turn this step into a zero-test pass.
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib ssh::tests::auth_tunnel_fixture::openssh_auth_tunnel_ -- --list --ignored | grep -c ': test$' | grep -Fx 4
          bun run test:openssh-auth-tunnel
      # Owned loopback sshd stopped and restarted under a live session with a tmux pane.
      - name: Exercise lost-connection detection, refused retries and tmux reattach over real OpenSSH
        if: ${{ !cancelled() }}
        run: |
          # A renamed case must not turn this step into a zero-test pass.
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib ssh::tests::connection_loss_fixture::openssh_ -- --list --ignored | grep -c ': test$' | grep -Fx 1
          bunx moon run client-native:test-connection-loss
      - name: Exercise real tmux, Herdr and Zellij lifecycle actions
        if: ${{ !cancelled() }}
        # Exact Herdr pane focus runs the current-source companion.
        run: |
          cargo build --locked -p lazysh-agent --bin lazysh-agent
          # The companion's `herdr-events` stream against an owned real Herdr: a renamed case must not pass with zero tests.
          cargo test --locked -p lazysh-agent --test herdr_events -- --list --ignored | grep -c ': test$' | grep -Fx 1
          cargo test --locked -p lazysh-agent --test herdr_events -- --ignored
          # The client's own agent_watch_start and agent_watch_stop over owned OpenSSH against the same stock Herdr (#1692, #1877).
          events=ssh::tests::openssh_herdr_events_report_a_blocked_and_a_finished_agent_within_a_bound
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$events" -- --list --ignored --exact | grep -Fx -- "$events: test"
          LAZYSH_TEST_AGENT_BIN="$GITHUB_WORKSPACE/target/debug/lazysh-agent" cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$events" -- --ignored --exact
          # A renamed case must not turn the local attach cases into a zero-test pass.
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib -- --list --ignored local::attach_tests::runtime::real_ | grep -c ': test$' | grep -Fx 4
          # A renamed case must not turn the local-session cases into a zero-test pass.
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib -- --list --ignored multiplexer::tests::real_local_ zellij::tests::real_local_ | grep -c ': test$' | grep -Fx 2
          LAZYSH_TEST_AGENT_BIN="$GITHUB_WORKSPACE/target/debug/lazysh-agent" bun run test:multiplexers
      # Pinned tmux (apt 3.4), Zellij 0.45.1 and the same-run stock Herdr drive a browser against lazysh's real terminal pane.
      - *playwright-chromium
      - name: Exercise tmux, Zellij and Herdr copies reaching the device clipboard through OSC 52 consent
        # The installs above have no status function, so an earlier failure skips them; without its browser this step would only add a misleading failure.
        if: ${{ !cancelled() && steps.playwright-chromium.outcome == 'success' }}
        run: |
          # With CI set a missing binary fails these cases instead of skipping them; a renamed case must not turn the step into a zero-test pass.
          test -x "$LAZYSH_TEST_ZELLIJ" && test -x "$LAZYSH_TEST_HERDR"
          bun run --cwd apps/client test:e2e:multiplexers --list | grep -Fx 'Total: 6 tests in 2 files'
          bunx moon run client:test-e2e-multiplexers
      - name: Create a saved Zellij default, reattach it without creating and refuse a vanished session over real OpenSSH
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CASE_NAME: ssh::tmux_jump_fixture::real_zellij_default_entry_creates_exact_target_and_keeps_child_after_bootstrap
        run: *exact-ignored-case
      - name: Exercise Herdr creation and remote Git argv quoting under sh, bash, zsh and fish login shells
        if: ${{ !cancelled() }}
        env:
          LAZYSH_REQUIRE_FISH: '1'
        run: "cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib -- herdr_create::tests:: repository::tests::remote_diff_command_reads_equals_prefixed_paths_under_every_login_shell"
      - name: Exercise discovery, attach, tree and actions on a user-installed stock Herdr over real OpenSSH
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CASE_NAME: ssh::tmux_jump_fixture::real_ssh_user_installed_herdr_discovers_and_attaches_exact_default
          LAZYSH_TEST_HERDR_STOCK: ${{ runner.temp }}/lazysh-stock-herdr/herdr
        run: *exact-ignored-case
      - name: Exercise a managed Herdr, with a failing system Herdr in its place, over real OpenSSH
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CASE_NAME: ssh::tmux_jump_fixture::real_ssh_managed_herdr_runs_every_native_call_and_never_the_system_one
          LAZYSH_TEST_HERDR_STOCK: ${{ runner.temp }}/lazysh-stock-herdr/herdr
        run: *exact-ignored-case
      - name: Report tmux 3.4, Zellij 0.45.1 and stock Herdr versions as supported through product discovery over owned OpenSSH
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CASE_NAME: ssh::tmux_jump_fixture::real_ssh_discovery_reports_multiplexer_versions_and_support
          LAZYSH_TEST_TMUX: /usr/bin/tmux
          LAZYSH_TEST_HERDR_STOCK: ${{ runner.temp }}/lazysh-stock-herdr/herdr
          LAZYSH_EXPECT_MUX_SUPPORT: tmux=full zellij=full herdr=full
        run: |
          test "$(/usr/bin/tmux -V)" = 'tmux 3.4'
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$CASE_NAME" -- --list --ignored --exact | grep -c ': test$' | grep -Fx 1
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$CASE_NAME" -- --ignored --exact --nocapture
      - name: Report the newest pinned tmux as supported through product discovery over owned OpenSSH
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CASE_NAME: ssh::tmux_jump_fixture::real_ssh_discovery_reports_multiplexer_versions_and_support
          LAZYSH_EXPECT_MUX_SUPPORT: tmux=full
        run: |
          test "$("$LAZYSH_TMUX_NEWEST" -V)" = 'tmux 3.8'
          LAZYSH_TEST_TMUX="$LAZYSH_TMUX_NEWEST" cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$CASE_NAME" -- --ignored --exact --nocapture
      - name: Report rmux 0.10.0 as limited through product discovery over owned OpenSSH
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CASE_NAME: ssh::tmux_jump_fixture::real_ssh_discovery_reports_multiplexer_versions_and_support
          LAZYSH_EXPECT_MUX_SUPPORT: rmux=degraded
        run: |
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$CASE_NAME" -- --list --ignored --exact | grep -c ': test$' | grep -Fx 1
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$CASE_NAME" -- --ignored --exact --nocapture
      - name: Exercise discovery, attach, tree and actions on rmux 0.10.0 over real OpenSSH
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CASE_NAME: ssh::tmux_jump_fixture::real_ssh_rmux_discovers_attaches_and_acts_on_a_labelled_server
        run: *exact-ignored-case
      - name: Exercise official ET 7.0.0 transport and SSH bootstrap
        if: ${{ !cancelled() }}
        run: bun run test:et
      - name: Exercise local Whisper inference on the public JFK and Portuguese samples
        if: ${{ !cancelled() }}
        run: bun run test:voice
      - name: Exercise the real Parakeet manager install, warm reuse and removal
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: bunx moon run client-native:test-parakeet-product
      # Official caronc/apprise-api 2.0.2 image (Docker Hub caronc/apprise), pinned by its
      # multi-arch index digest. Host networking lets its json:// service reach the test's
      # loopback receiver; the relay reaches it only through the test's owned TLS proxy.
      - name: Deliver relay events through the pinned official Apprise API
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          APPRISE_IMAGE: docker.io/caronc/apprise@sha256:6ae97e24b3447f85f725a03ba73c6dc3a5f4b99f4273ac126de2d9b5ed6205d5
          CASE_NAME: tests::apprise_server::real_apprise_api_stateful_key_delivers_mapped_events_through_an_owned_tls_proxy
          LAZYSH_APPRISE_API: http://127.0.0.1:8000
        run: |
          docker run --detach --rm --name lazysh-apprise --network host "$APPRISE_IMAGE"
          trap 'docker logs lazysh-apprise 2>&1 | tail -n 40; docker rm --force lazysh-apprise >/dev/null' EXIT
          # A renamed case must not turn this step into a zero-test pass.
          cargo test --locked -p lazysh-notifications --lib "$CASE_NAME" -- --list --ignored --exact | grep -Fx -- "$CASE_NAME: test"
          cargo test --locked -p lazysh-notifications --lib "$CASE_NAME" -- --ignored --exact --nocapture
      # Official Gotify 3.1.1 Linux release; the archive is pinned by its release asset digest
      # (https://api.github.com/repos/gotify/server/releases/tags/v3.1.1) and the case itself
      # rechecks the extracted binary. It serves only the case's owned TLS loopback listener.
      - name: Deliver relay events to the pinned official Gotify server over verified TLS
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          CASE_NAME: tests::gotify_server::real_gotify_server_stores_all_finite_relay_states_over_verified_tls
        run: |
          gotify_root=$(mktemp -d "$RUNNER_TEMP/lazysh-gotify-3.1.1-XXXXXX")
          sh .github/scripts/pinned-download.sh d452faad071981d191d5c95f70d0f9520dc2ef2336b2b03055e12cfabfbae2d2 "$gotify_root/gotify.zip" --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 15552390 https://github.com/gotify/server/releases/download/v3.1.1/gotify-linux-amd64.zip
          printf '%s  %s\n' 'd452faad071981d191d5c95f70d0f9520dc2ef2336b2b03055e12cfabfbae2d2' "$gotify_root/gotify.zip" | sha256sum --check --strict
          unzip -q "$gotify_root/gotify.zip" gotify-linux-amd64 -d "$gotify_root"
          chmod 0500 "$gotify_root/gotify-linux-amd64"
          export LAZYSH_GOTIFY_SERVER="$gotify_root/gotify-linux-amd64"
          # A renamed case must not turn this step into a zero-test pass.
          cargo test --locked -p lazysh-notifications --lib "$CASE_NAME" -- --list --ignored --exact | grep -Fx -- "$CASE_NAME: test"
          cargo test --locked -p lazysh-notifications --lib "$CASE_NAME" -- --ignored --exact --nocapture

  native-android-auxiliary:
    needs: changes
    if: needs.changes.outputs.android_auxiliary == 'true'
    runs-on: ubuntu-24.04
    # The F-Droid, QR and local Whisper runs took about 18 minutes before Whisper joined them; its download, import and inference add under ten.
    timeout-minutes: 40
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: auxiliary
      LAZYSH_ANDROID_RUNTIME_ARTIFACT: lazysh-android-auxiliary-results
      VITE_LAZYSH_QR_CAMERA_TRACE: '1'
    steps: &android-emulator-only-steps
      - *source-checkout
      - *source-bun
      - *android-toolchains
      - *android-owned-rust
      - *android-cache-identity
      - *android-owned-cache
      - run: bun install --frozen-lockfile
      - *android-owned-kvm
      - name: Install FFmpeg for the Android video case
        if: env.LAZYSH_ANDROID_RUNTIME_OWNER == 'auxiliary'
        run: sudo sh .github/scripts/apt-install.sh ffmpeg
      - *android-runtime-emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.LAZYSH_ANDROID_RUNTIME_ARTIFACT }}
          path: *android-runtime-result-paths
          if-no-files-found: warn

  # Owns the emulator lock screen: it sets a disposable PIN, enrolls a fingerprint and
  # answers touch requests, so it never shares an emulator with other instrumentation.
  native-android-biometric:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_RUNTIME_OWNER: biometric
      LAZYSH_ANDROID_RUNTIME_ARTIFACT: lazysh-android-biometric-results
    steps: *android-emulator-only-steps

  native-android-ntfy:
    needs: changes
    if: needs.changes.outputs.android_ntfy == 'true'
    strategy:
      fail-fast: *pull-request-fail-fast
      matrix:
        # Main and push-path pull requests run both; other pull requests run only Google,
        # because native-android-auxiliary already exercises F-Droid UnifiedPush enrollment.
        push-variant: ${{ fromJSON(needs.changes.outputs.ntfy_variants) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_SERIAL: emulator-5580
    steps:
      - *source-checkout
      - *source-bun
      - *android-toolchains
      - *android-owned-rust
      - *android-cache-identity
      - *android-owned-cache
      - run: bun install --frozen-lockfile
      - name: Reclaim unused host toolchains for Google ntfy
        if: matrix.push-variant == 'google'
        run: |
          df -h /
          # Keep the active Android SDK/NDK; only unrelated host toolchains are unused.
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup
          df -h /
      - name: Build current Google APK for Firebase-free push acceptance
        if: matrix.push-variant == 'google'
        run: bun run build:android:emulator
      - name: Admit this runner's owned emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
      - name: Real ntfy encrypted native enrollment
        uses: mihazs/lazysh-android-emulator-runner@46beb5d59b664ea61462125a023549a5a7b0418b
        with:
          api-level: 36
          target: default
          arch: x86_64
          avd-name: lazysh-runtime-api36
          emulator-port: 5580
          ram-size: 3072M
          # The default userdata partition can exceed hosted runner free space.
          disk-size: 4G
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -accel on -camera-back imagefile:${{ github.workspace }}/apps/client/src-tauri/fixtures/theme-qr-camera-feed.png -camera-front none -qemu -pidfile ${{ runner.temp }}/lazysh-ntfy-emulator.pid
          script: |
            if [ '${{ matrix.push-variant }}' = 'google' ]; then LAZYSH_ANDROID_QR_EMULATOR_PID_FILE="$RUNNER_TEMP/lazysh-ntfy-emulator.pid" bun run test:android-ntfy:google; else LAZYSH_ANDROID_QR_EMULATOR_PID_FILE="$RUNNER_TEMP/lazysh-ntfy-emulator.pid" bun run test:android-ntfy; fi
      - name: Retain finite ntfy acceptance receipts only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazysh-ntfy-acceptance-${{ matrix.push-variant }}
          path: apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/ntfy/*.json
          if-no-files-found: warn

  # The official, unchanged Gotify Android client against a real Gotify server fed by the actual relay worker. It runs only for
  # the Gotify owner, the notification relay and the helpers it reuses, plus every push to main (native-changes.sh).
  native-android-gotify:
    needs: changes
    if: needs.changes.outputs.android_gotify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      ANDROID_SERIAL: emulator-5580
    steps:
      - *source-checkout
      - *source-bun
      - run: bun install --frozen-lockfile
      - *android-toolchains
      - *android-owned-rust
      - *android-cache-identity
      - *android-owned-cache
      - name: Install owned Gotify fixture prerequisites
        run: sudo sh .github/scripts/apt-install.sh iproute2 openssl unzip
      - name: Build the current Google APK for the owned Gotify case
        run: bun run build:android:emulator
      - *android-owned-kvm
      - name: Official Gotify Android background delivery
        uses: mihazs/lazysh-android-emulator-runner@46beb5d59b664ea61462125a023549a5a7b0418b
        with:
          # NativeActivityFixture owns screen/keyguard readiness; avoid early MENU input.
          unlock-screen: false
          api-level: *android-owned-api
          target: *android-owned-image
          arch: *android-owned-arch
          profile: *android-owned-profile
          avd-name: *android-owned-avd
          emulator-port: *android-owned-port
          ram-size: *android-owned-ram
          # The default userdata partition can exceed hosted runner free space.
          disk-size: 4G
          emulator-boot-timeout: *android-owned-boot
          disable-linux-hw-accel: *android-owned-acceleration
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -accel on -camera-back imagefile:${{ github.workspace }}/apps/client/src-tauri/fixtures/theme-qr-camera-feed.png -camera-front none -qemu -pidfile ${{ runner.temp }}/lazysh-gotify-emulator.pid
          pre-emulator-launch-script: $ANDROID_HOME/emulator/emulator -accel-check
          # The owner refuses to run with a proxy in its environment; clear it for this child only.
          script: >-
            env -u HTTP_PROXY -u http_proxy -u HTTPS_PROXY -u https_proxy -u ALL_PROXY -u all_proxy LAZYSH_ANDROID_QR_EMULATOR_PID_FILE="$RUNNER_TEMP/lazysh-gotify-emulator.pid" bun run test:android-gotify
      - name: Retain finite Gotify acceptance receipts only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazysh-gotify-acceptance
          path: apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/gotify/*.json
          if-no-files-found: warn

  native-ios-simulator:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - *source-bun
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      - name: Install host Mosh fixture dependencies
        run: |
          brew install protobuf openssl@3 zlib pkgconf mosh cmake
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix protobuf)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Report Xcode and target SDKs
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
      - run: bun run build:ios
        id: ios-app-build
      - name: Inspect compiled iOS icon catalog
        id: ios-icon-catalog
        timeout-minutes: 2
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' }}
        run: |
          /usr/bin/assetutil --info apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app/Assets.car > "$RUNNER_TEMP/lazysh-icon-catalog.json"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app/Info.plist > "$RUNNER_TEMP/lazysh-icon-iphone.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons~ipad' apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app/Info.plist > "$RUNNER_TEMP/lazysh-icon-ipad.txt"
      - name: Retain compiled iOS icon catalog before runtime checks
        timeout-minutes: 2
        if: ${{ !cancelled() && (steps.ios-icon-catalog.outcome == 'success' || steps.ios-icon-catalog.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-ios-icon-catalog
          path: |
            ${{ runner.temp }}/lazysh-icon-catalog.json
            ${{ runner.temp }}/lazysh-icon-iphone.txt
            ${{ runner.temp }}/lazysh-icon-ipad.txt
          if-no-files-found: error
      - name: Retain bounded simulator signing diagnostics
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          diagnostic_dir="$RUNNER_TEMP/lazysh-ios-signing"
          app_path="apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app"
          entitlement_path="apps/client/src-tauri/gen/apple/lazysh_iOS/lazysh_iOS.entitlements"
          mkdir -p "$diagnostic_dir"
          shasum -a 256 "$app_path/lazysh" > "$diagnostic_dir/host-binary.sha256"
          if [ -f "$entitlement_path" ] && [ "$(wc -c < "$entitlement_path")" -le 65536 ]; then
            cp "$entitlement_path" "$diagnostic_dir/app-entitlements.plist"
          fi
          {
            printf 'Generated app entitlement plist (maximum 64 KiB)\n'
            if [ -f "$diagnostic_dir/app-entitlements.plist" ]; then
              plutil -convert xml1 -o - "$diagnostic_dir/app-entitlements.plist" 2>/dev/null || printf 'Cannot decode generated entitlements\n'
            else
              printf 'Generated entitlements absent or exceed diagnostic limit\n'
            fi
            printf '\nProject simulator settings (invocation overrides are not replayed)\n'
            if ! xcodebuild -project apps/client/src-tauri/gen/apple/lazysh.xcodeproj -target lazysh_iOS -configuration debug -sdk iphonesimulator -showBuildSettings 2>/dev/null |
              awk '$1 ~ /^(CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|CODE_SIGN_ENTITLEMENTS|EXPANDED_CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|SDKROOT|PRODUCT_BUNDLE_IDENTIFIER)$/ && $2 == "=" { print }'; then
              printf 'Cannot inspect simulator build settings\n'
            fi
            printf '\nActual app signature metadata\n'
            codesign -dvv "$app_path" 2>&1 |
              awk '/^(Identifier=|Format=|CodeDirectory |Signature=|TeamIdentifier=)/ { print }' || printf 'Cannot inspect app signature metadata\n'
            printf '\nActual app code-signature entitlements (empty is not proof of absent simulator entitlements)\n'
            codesign -d --entitlements :- "$app_path" 2>/dev/null || printf 'Cannot inspect signature entitlements\n'
            printf '\nActual host Mach-O entitlement section headers\n'
            xcrun otool -l "$app_path/lazysh" 2>/dev/null |
              awk '/sectname __entitlements|sectname __ents_der/ { remaining = 4 } remaining > 0 { print; remaining-- }' || printf 'Cannot inspect Mach-O section headers\n'
            printf '\nSimulator XML entitlement section\n'
            xcrun otool -s __TEXT __entitlements "$app_path/lazysh" 2>/dev/null || printf 'Cannot inspect XML entitlement section\n'
            printf '\nSimulator DER entitlement section\n'
            xcrun otool -s __TEXT __ents_der "$app_path/lazysh" 2>/dev/null || printf 'Cannot inspect DER entitlement section\n'
          } | awk 'NR <= 512 { print substr($0, 1, 256) }' > "$diagnostic_dir/signing-report.txt"
      - name: Retain compiled iOS app version receipt
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' }}
        run: |
          # Observation only: missing metadata must not change existing verdicts.
          (
            set +e
            umask 077
            diagnostic_dir="$RUNNER_TEMP/lazysh-ios-signing"
            plist_path="apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app/Info.plist"
            mkdir -p "$diagnostic_dir" || exit 0
            receipt="$diagnostic_dir/compiled-app-version.json"
            unavailable() { printf '{"status":"unavailable","stage":"%s"}\n' "$1" > "$receipt"; }
            unavailable input || exit 0
            test -f "$plist_path" && test ! -L "$plist_path" || exit 0
            test "$(wc -c < "$plist_path")" -le 65536 || exit 0
            unavailable snapshot || exit 0
            private_dir="$(mktemp -d "$RUNNER_TEMP/lazysh-ios-version-private.XXXXXX")" || exit 0
            trap 'rm -rf "$private_dir"' EXIT
            (ulimit -f 128; cp "$plist_path" "$private_dir/compiled.plist") 2>/dev/null || exit 0
            plist_path="$private_dir/compiled.plist"
            test "$(wc -c < "$plist_path")" -le 65536 || exit 0
            for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion; do
              case "$key" in
                CFBundleIdentifier) unavailable identifier ;;
                CFBundleShortVersionString) unavailable short-version ;;
                CFBundleVersion) unavailable build-version ;;
              esac || exit 0
              (ulimit -f 128; plutil -extract "$key" raw -expect string -n -o "$private_dir/$key.raw" "$plist_path") 2>/dev/null || exit 0
            done
            unavailable validation || exit 0
            digest="$(shasum -a 256 "$plist_path" 2>/dev/null | awk '{print $1}')"
            (ulimit -f 8; jq -n \
              --rawfile identifier "$private_dir/CFBundleIdentifier.raw" \
              --rawfile short "$private_dir/CFBundleShortVersionString.raw" \
              --rawfile build "$private_dir/CFBundleVersion.raw" --arg digest "$digest" '
              def field:
                if type == "string" and length > 0 and length <= 128 and (explode | all(. >= 32 and . != 127))
                then . else error("invalid compiled version field") end;
              if ($digest | test("^[a-f0-9]{64}$")) then
                {status:"retained", CFBundleIdentifier:($identifier | field),
                  CFBundleShortVersionString:($short | field), CFBundleVersion:($build | field),
                  plistSha256:$digest}
              else error("unavailable compiled plist hash") end
              ' > "$private_dir/receipt.json") 2>/dev/null || exit 0
            test "$(wc -c < "$private_dir/receipt.json")" -le 2048 || exit 0
            unavailable publication || exit 0
            mv "$private_dir/receipt.json" "$receipt" || exit 0
            exit 0
          )
      - name: Retain simulator signing evidence before runtime checks
        timeout-minutes: 2
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-ios-signing
          path: ${{ runner.temp }}/lazysh-ios-signing
          if-no-files-found: error
      - name: Link native Mosh tests for iOS devices
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '16.0'
        run: cargo test -p lazysh-mosh-transport --target aarch64-apple-ios --lib --no-run --locked
      - name: Compile watchOS companion and complications
        timeout-minutes: 8
        run: bunx moon run apple-status:build-watchos
      - name: Create isolated status test simulator
        id: ios-simulator
        run: |
          APPLE_STATUS_SIMULATOR_ID="$(xcrun simctl create lazysh-status-ci com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro)"
          echo "APPLE_STATUS_SIMULATOR_ID=$APPLE_STATUS_SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Run native status lifecycle tests
        timeout-minutes: 8
        run: bunx moon run apple-status:test-apple-status
      - name: Run native APNs registration state tests
        timeout-minutes: 8
        run: bunx moon run push-registration:test-apns
      - name: Run native resume cover and lifecycle tests
        timeout-minutes: 8
        run: bunx moon run credential-vault:test-resume
      - name: Upload native resume results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-ios-resume-results
          path: apps/client/src-tauri/gen/apple/resume-tests.xcresult
          if-no-files-found: warn
      - name: Run native iOS Mosh unit and protocol tests
        id: ios-mosh-native
        timeout-minutes: 20
        run: |
          set -o pipefail
          # Observation only (#45): the first standalone simulator launch sometimes shows no output for 45 s while `simctl`
          # stays runnable. The busiest processes every three seconds say whether the host was saturated, and by what.
          # `|| true`: the step shell is `bash -e` with pipefail, and `head` closing the pipe would end the loop after one sample.
          (while :; do date -u +%Y-%m-%dT%H:%M:%SZ; ps -Ao pid,ppid,state,pcpu,etime,comm -r | head -12 || true; sleep 3; done) > "$RUNNER_TEMP/lazysh-ios-mosh-host.log" 2>&1 &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          bun run test:ios-mosh 2>&1 | tee "$RUNNER_TEMP/lazysh-ios-mosh.log"
      - name: Capture the system log of a failed raw iOS Mosh step
        if: ${{ !cancelled() && steps.ios-mosh-native.outcome == 'failure' }}
        timeout-minutes: 4
        continue-on-error: true
        run: |
          # Observation only. The daemons that check, scan or spawn a new executable log what they did in the last
          # minutes; an entry for the test executable or a long gap before `simctl` starts it names where the launch waited.
          unified() { sudo -n /usr/bin/log "$@" 2>/dev/null || /usr/bin/log "$@"; }
          unified show --last 5m --style compact --predicate 'process == "syspolicyd" OR process == "amfid" OR process == "trustd" OR process == "CoreSimulatorService" OR process == "mds" OR process == "mds_stores" OR process == "XprotectService" OR process == "simctl" OR eventMessage CONTAINS[c] "lazysh_mosh_transport"' |
            cut -c1-400 | tail -n 3000 > "$RUNNER_TEMP/lazysh-ios-mosh-system.log" || true
          { uptime; vm_stat; ps -Ao pid,ppid,state,pcpu,etime,comm -r | head -20; } > "$RUNNER_TEMP/lazysh-ios-mosh-after.log" 2>&1 || true
      - name: Upload raw iOS Mosh diagnostics before app acceptance
        if: ${{ !cancelled() && (steps.ios-mosh-native.outcome == 'success' || steps.ios-mosh-native.outcome == 'failure') }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-ios-mosh-diagnostics
          path: |
            ${{ runner.temp }}/lazysh-ios-mosh.log
            ${{ runner.temp }}/lazysh-ios-mosh-host.log
            ${{ runner.temp }}/lazysh-ios-mosh-system.log
            ${{ runner.temp }}/lazysh-ios-mosh-after.log
          if-no-files-found: error
      - name: Install actual iOS app for native acceptance
        id: ios-app-install
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' && steps.ios-simulator.outcome == 'success' }}
        run: |
          xcrun simctl bootstatus "$APPLE_STATUS_SIMULATOR_ID" -b
          xcrun simctl install "$APPLE_STATUS_SIMULATOR_ID" apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app
      - name: Verify actual iOS Mosh IPC and privacy resources
        id: ios-mosh-app
        timeout-minutes: 8
        if: ${{ !cancelled() && steps.ios-app-install.outcome == 'success' }}
        run: xcodebuild -project apps/client/src-tauri/gen/apple/lazysh.xcodeproj -scheme LazyshMoshAppTests -configuration debug -destination "platform=iOS Simulator,id=$APPLE_STATUS_SIMULATOR_ID" -skip-testing:LazyshMoshAppTests/MoshAppIntegrationTests/testNativeTerminalBuildAdmitsTheMetalRenderer -skip-testing:LazyshMoshAppTests/MoshAppIntegrationTests/testNativeTerminalAttachesAndHandsBackAnOwnedSshSession -resultBundlePath apps/client/src-tauri/gen/apple/mosh-app.xcresult -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 test CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/apps/client/src-tauri/gen/apple/build/arm64-sim"
      - name: Run native workspace Save, relaunch, and Delete acceptance
        id: ios-workspace
        timeout-minutes: 8
        if: ${{ !cancelled() && steps.ios-app-install.outcome == 'success' && steps.ios-mosh-app.outcome == 'success' }}
        run: bun run test:ios-workspace
      - name: Capture failed workspace filesystem metadata
        if: ${{ !cancelled() && steps.ios-workspace.outcome == 'failure' }}
        timeout-minutes: 1
        env:
          WORKSPACE_OUTCOME: ${{ steps.ios-workspace.outcome }}
        run: |
          # This never changes the test outcome and never starts SDK/simulator tools.
          test "$WORKSPACE_OUTCOME" = failure || exit 0
          set +e
          umask 077
          diagnostic_dir="$RUNNER_TEMP/lazysh-ios-workspace-metadata"
          mkdir -p "$diagnostic_dir" || exit 0
          raw_dir="$(mktemp -d "$RUNNER_TEMP/lazysh-ios-workspace-private.XXXXXX")" || exit 0
          trap 'rm -rf "$raw_dir"' EXIT
          printf 'workspace outcome=failure\n' > "$diagnostic_dir/status.txt"
          capture_metadata() {
            kind="$1"; source_file="$2"; limit="$3"
            result=unavailable
            if test -f "$source_file" && test ! -L "$source_file"; then
              size="$(wc -c < "$source_file")"
              if test "$size" -le "$limit"; then
                if test "$kind" = project; then
                  shasum -a 256 "$source_file" | awk '{print $1}' > "$diagnostic_dir/project.sha256"
                fi
                if (ulimit -f 8192; plutil -convert json -o "$raw_dir/$kind.json" "$source_file") 2>/dev/null &&
                  (ulimit -f 64; jq --arg kind "$kind" --arg device "$APPLE_STATUS_SIMULATOR_ID" -f .github/ios-workspace-metadata.jq "$raw_dir/$kind.json" > "$raw_dir/$kind.filtered.json") 2>/dev/null &&
                  test "$(wc -c < "$raw_dir/$kind.filtered.json")" -le 32768; then
                  cp "$raw_dir/$kind.filtered.json" "$diagnostic_dir/$kind.json" && result=retained
                fi
              fi
            fi
            printf '%s=%s\n' "$kind" "$result" >> "$diagnostic_dir/status.txt"
          }
          capture_metadata project apps/client/src-tauri/gen/apple/lazysh.xcodeproj/project.pbxproj 2097152
          if [[ "$APPLE_STATUS_SIMULATOR_ID" =~ ^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$ ]]; then
            capture_metadata device "$HOME/Library/Developer/CoreSimulator/Devices/$APPLE_STATUS_SIMULATOR_ID/device.plist" 65536
          else
            printf 'device=unavailable\n' >> "$diagnostic_dir/status.txt"
          fi
          exit 0
      # The composition proof of concept (#1311) builds and runs its own host app, so it needs only the generated project and the simulator.
      - name: Run native surface composition proof of concept
        id: ios-surface-poc
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' && steps.ios-simulator.outcome == 'success' }}
        env:
          TEST_RUNNER_LAZYSH_SURFACE_POC_RESULTS: ${{ runner.temp }}/lazysh-surface-poc.jsonl
        run: |
          : > "$TEST_RUNNER_LAZYSH_SURFACE_POC_RESULTS"
          xcrun simctl bootstatus "$APPLE_STATUS_SIMULATOR_ID" -b
          bun run test:ios-surface-poc
      - name: Print surface composition records
        if: ${{ !cancelled() && steps.ios-surface-poc.outcome != 'skipped' }}
        run: |
          printf '### iOS surface composition proof of concept\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/lazysh-surface-poc.jsonl"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify tests preserve the prebuilt iOS host binary
        timeout-minutes: 1
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' }}
        run: shasum -a 256 -c "$RUNNER_TEMP/lazysh-ios-signing/host-binary.sha256"
      - name: Upload iOS app acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-ios-app-acceptance-results
          path: |
            apps/client/src-tauri/gen/apple/workspace-ui.xcresult
            apps/client/src-tauri/gen/apple/mosh-app.xcresult
            apps/client/src-tauri/gen/apple/surface-poc-ui.xcresult
            ${{ runner.temp }}/lazysh-surface-poc.jsonl
            ${{ runner.temp }}/lazysh-ios-signing
            ${{ runner.temp }}/lazysh-ios-workspace-metadata
          if-no-files-found: warn
      - name: Remove status test simulator
        timeout-minutes: 2
        if: always() && env.APPLE_STATUS_SIMULATOR_ID != ''
        run: xcrun simctl delete "$APPLE_STATUS_SIMULATOR_ID"
