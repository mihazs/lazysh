name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-client-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-client-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test:hooks
      - run: bun run test:ci
      - run: bunx turbo run build check test --filter=@lazysh/client
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/client
      - run: bun run test:e2e

  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Install bounded storage observation tool
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Check companion and service packages
        id: agent-checks
        env:
          LAZYSH_TEST_STORAGE_TRACE_DIR: ${{ runner.temp }}/lazysh-storage-traces
        run: bunx turbo run build check check:rust test test:rust lint format:check --filter=@lazysh/agent --filter=@lazysh/share-service --filter=@lazysh/transcription-service --filter=@lazysh/notification-service --filter=@lazysh/notification-client
      - name: Upload owned concurrent hook syscall excerpts
        if: ${{ !cancelled() && (steps.agent-checks.outcome == 'success' || steps.agent-checks.outcome == 'failure') }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-storage-syscalls
          path: ${{ runner.temp }}/lazysh-storage-traces
          if-no-files-found: warn
      - name: Measure hosted SQLite phases (diagnostic, no injected delay)
        if: ${{ !cancelled() && (steps.agent-checks.outcome == 'success' || steps.agent-checks.outcome == 'failure') }}
        timeout-minutes: 2
        run: cargo test --locked --package lazysh-agent --lib storage_diagnostics::profile_storage_commit_phases -- --ignored --exact --nocapture

  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev cmake libclang-dev libprotobuf-dev protobuf-compiler libssl-dev zlib1g-dev pkg-config mosh openssh-server tmux dbus-daemon
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build test:rust lint format:check --filter=@lazysh/client...
      - name: Check standalone Parakeet runtime and native ownership boundary
        run: bunx turbo run test:rust lint format:check --filter=@lazysh/parakeet-runtime
      - name: Check combined native voice startup and clean shutdown without models
        run: bunx turbo run test:voice-interop:smoke --filter=@lazysh/client
      - run: bun run build:native
      - run: bun run test:mosh
      - name: Exercise retained tmux display navigation and hostile control streams
        run: bunx turbo run test:tmux --filter=@lazysh/client

  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: |
          brew install protobuf openssl@3 zlib pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix protobuf)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:native
      - run: bunx turbo run test:rust --filter=@lazysh/credential-vault
      - name: Package and validate native macOS permission localizations
        if: runner.os == 'macOS'
        run: |
          bun run --cwd apps/client tauri build --bundles app
          plutil -lint target/release/bundle/macos/lazysh.app/Contents/Resources/{en,pt-BR,es}.lproj/{InfoPlist,NativeUI}.strings
      - name: Reject unverified Windows private-file permissions
        if: runner.os == 'Windows'
        run: cargo test --locked -p lazysh-common --features service --lib service_secrets::tests::public_storage_helpers_reject_unverified_host_permissions -- --exact
      - name: Exercise native companion WAL admission and recovery
        run: bun run test:storage
      - name: Build pinned Parakeet runtime and exercise native macOS ACL storage
        if: runner.os == 'macOS'
        run: bunx turbo run test:rust lint format:check --filter=@lazysh/parakeet-runtime
      - name: Exercise native desktop launch parsing and original-lease admission
        run: "cargo test --locked -p lazysh --lib desktop_launch::"
      - name: Exercise native local PTY and ConPTY lifecycle
        run: bunx turbo run test:local --filter=@lazysh/client
      - name: Verify uploaded paths through the owned Mac host clipboard
        if: runner.os == 'macOS'
        env:
          LAZYSH_TEST_OWNED_MAC_CLIPBOARD: "1"
        run: bunx turbo run test:host-clipboard --filter=@lazysh/client
      - name: Exercise native display-idle ownership and platform API release
        run: bunx turbo run test:rust --filter=@lazysh/display-idle
      - name: Exercise native resume policy persistence and cancellation
        run: bunx turbo run test:resume-policy --filter=@lazysh/client

  native-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - &android-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - &android-sdk
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - &android-toolchains
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - &android-ndk
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - &android-cache-identity
        name: Fingerprint Android native build tools
        run: |
          cmake_identity=$(cmake --version)
          clang_identity=$("$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version)
          toolchain_digest=$(printf '%s\n' "$NDK_HOME" "$cmake_identity" "$clang_identity" | sha256sum)
          printf 'LAZYSH_ANDROID_TOOLCHAIN=%s\n' "${toolchain_digest%% *}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: &android-cache-environment
          env-vars: LAZYSH_ANDROID_TOOLCHAIN
      - run: bun install --frozen-lockfile
      - run: bun run build:android
      - run: ./gradlew :tauri-plugin-lazysh-vault:testDebugUnitTest --no-daemon
        working-directory: apps/client/src-tauri/gen/android
      - name: Exercise bounded native Android deep-link ingress
        run: ./gradlew :tauri-plugin-deep-link:testDebugUnitTest :app:testUniversalDebugUnitTest --no-daemon
        working-directory: apps/client/src-tauri/gen/android
      - uses: actions/upload-artifact@v4
        with:
          name: lazysh-android-debug-arm64
          path: apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk

  native-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5580
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - *android-java
      - *android-sdk
      - *android-toolchains
      - *android-ndk
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Install native Mosh fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y openssh-server openssh-client mosh protobuf-compiler libprotobuf-dev libssl-dev zlib1g-dev pkg-config cmake perl
      - *android-cache-identity
      - uses: Swatinem/rust-cache@v2
        with: *android-cache-environment
      - run: bun install --frozen-lockfile
      - name: Grant this runner access to KVM
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
      - name: Run native Android instrumentation
        uses: mihazs/lazysh-android-emulator-runner@46beb5d59b664ea61462125a023549a5a7b0418b
        with:
          # NativeActivityFixture owns screen/keyguard readiness; avoid early MENU input.
          unlock-screen: false
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          avd-name: lazysh-runtime-api36
          emulator-port: 5580
          ram-size: 3072M
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -accel on
          pre-emulator-launch-script: $ANDROID_HOME/emulator/emulator -accel-check
          # The action runs each newline in a separate shell; fold this into one
          # invocation so cleanup runs before the action terminates the emulator.
          script: >-
            bash -c '
            diagnostic_dir="apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/system-diagnostics";
            mkdir -p "$diagnostic_dir";
            capture() {
            local name="$1"; shift;
            (ulimit -c 0; ulimit -f 1024; exec timeout --kill-after=2s 10s "$@") > "$diagnostic_dir/$name.txt" 2>&1;
            local code=$?;
            printf "%s exit=%s\n" "$name" "$code" >> "$diagnostic_dir/status.txt";
            };
            cleanup() {
            local result=$?;
            trap - EXIT INT TERM;
            if (( result != 0 )); then
            capture kernel-load adb shell "date -u; cat /proc/uptime /proc/loadavg /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory";
            capture cpu-load adb shell dumpsys cpuinfo;
            capture lastanr adb shell dumpsys activity lastanr;
            capture lastanr-traces adb shell dumpsys activity lastanr-traces;
            fi;
            kill %1 2>/dev/null || true;
            wait "$collector_pid"; local collector_result=$?;
            printf "collector exit=%s; test exit=%s\n" "$collector_result" "$result" >> "$diagnostic_dir/status.txt";
            exit "$result";
            };
            trap cleanup EXIT;
            trap "exit 130" INT;
            trap "exit 143" TERM;
            (ulimit -c 0; ulimit -f 1024; exec timeout --kill-after=2s 1800s adb logcat
            -b main -b system -b events -v threadtime
            "ActivityManager:E" "InputDispatcher:W" "WindowManager:W" "am_anr:I" "*:S")
            > "$diagnostic_dir/system-anr.txt" 2> "$diagnostic_dir/collector-errors.txt" &
            collector_pid=$!;
            capture start-load adb shell "date -u; cat /proc/uptime /proc/loadavg /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory";
            bun run test:android-mosh && bun run test:android-ssh &&
            LAZYSH_TEST_ANDROID_SERIAL="$ANDROID_SERIAL" cargo test --locked -p lazysh-agent --lib devices::tests::android_owned_emulator_inventory_and_screenshot -- --ignored --exact --nocapture;
            exit $?;
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazysh-android-runtime-results
          path: |
            apps/client/src-tauri/gen/android/app/build/reports/androidTests/
            apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn

  native-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Install host Mosh fixture dependencies
        run: |
          brew install protobuf openssl@3 zlib pkgconf mosh cmake
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix protobuf)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Report Xcode and target SDKs
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
      - run: bun run build:ios
        id: ios-app-build
      - name: Inspect compiled iOS icon catalog
        id: ios-icon-catalog
        timeout-minutes: 2
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' }}
        run: |
          /usr/bin/assetutil --info apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app/Assets.car > "$RUNNER_TEMP/lazysh-icon-catalog.json"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app/Info.plist > "$RUNNER_TEMP/lazysh-icon-iphone.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons~ipad' apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app/Info.plist > "$RUNNER_TEMP/lazysh-icon-ipad.txt"
      - name: Retain compiled iOS icon catalog before runtime checks
        timeout-minutes: 2
        if: ${{ !cancelled() && (steps.ios-icon-catalog.outcome == 'success' || steps.ios-icon-catalog.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-ios-icon-catalog
          path: |
            ${{ runner.temp }}/lazysh-icon-catalog.json
            ${{ runner.temp }}/lazysh-icon-iphone.txt
            ${{ runner.temp }}/lazysh-icon-ipad.txt
          if-no-files-found: error
      - name: Retain bounded simulator signing diagnostics
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          diagnostic_dir="$RUNNER_TEMP/lazysh-ios-signing"
          app_path="apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app"
          entitlement_path="apps/client/src-tauri/gen/apple/lazysh_iOS/lazysh_iOS.entitlements"
          mkdir -p "$diagnostic_dir"
          shasum -a 256 "$app_path/lazysh" > "$diagnostic_dir/host-binary.sha256"
          if [ -f "$entitlement_path" ] && [ "$(wc -c < "$entitlement_path")" -le 65536 ]; then
            cp "$entitlement_path" "$diagnostic_dir/app-entitlements.plist"
          fi
          {
            printf 'Generated app entitlement plist (maximum 64 KiB)\n'
            if [ -f "$diagnostic_dir/app-entitlements.plist" ]; then
              plutil -convert xml1 -o - "$diagnostic_dir/app-entitlements.plist" 2>/dev/null || printf 'Cannot decode generated entitlements\n'
            else
              printf 'Generated entitlements absent or exceed diagnostic limit\n'
            fi
            printf '\nProject simulator settings (invocation overrides are not replayed)\n'
            if ! xcodebuild -project apps/client/src-tauri/gen/apple/lazysh.xcodeproj -target lazysh_iOS -configuration debug -sdk iphonesimulator -showBuildSettings 2>/dev/null |
              awk '$1 ~ /^(CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|CODE_SIGN_ENTITLEMENTS|EXPANDED_CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|SDKROOT|PRODUCT_BUNDLE_IDENTIFIER)$/ && $2 == "=" { print }'; then
              printf 'Cannot inspect simulator build settings\n'
            fi
            printf '\nActual app signature metadata\n'
            codesign -dvv "$app_path" 2>&1 |
              awk '/^(Identifier=|Format=|CodeDirectory |Signature=|TeamIdentifier=)/ { print }' || printf 'Cannot inspect app signature metadata\n'
            printf '\nActual app code-signature entitlements (empty is not proof of absent simulator entitlements)\n'
            codesign -d --entitlements :- "$app_path" 2>/dev/null || printf 'Cannot inspect signature entitlements\n'
            printf '\nActual host Mach-O entitlement section headers\n'
            xcrun otool -l "$app_path/lazysh" 2>/dev/null |
              awk '/sectname __entitlements|sectname __ents_der/ { remaining = 4 } remaining > 0 { print; remaining-- }' || printf 'Cannot inspect Mach-O section headers\n'
            printf '\nSimulator XML entitlement section\n'
            xcrun otool -s __TEXT __entitlements "$app_path/lazysh" 2>/dev/null || printf 'Cannot inspect XML entitlement section\n'
            printf '\nSimulator DER entitlement section\n'
            xcrun otool -s __TEXT __ents_der "$app_path/lazysh" 2>/dev/null || printf 'Cannot inspect DER entitlement section\n'
          } | awk 'NR <= 512 { print substr($0, 1, 256) }' > "$diagnostic_dir/signing-report.txt"
      - name: Retain compiled iOS app version receipt
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' }}
        run: |
          # Observation only: missing metadata must not change existing verdicts.
          (
            set +e
            umask 077
            diagnostic_dir="$RUNNER_TEMP/lazysh-ios-signing"
            plist_path="apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app/Info.plist"
            mkdir -p "$diagnostic_dir" || exit 0
            receipt="$diagnostic_dir/compiled-app-version.json"
            printf '{"status":"unavailable"}\n' > "$receipt" || exit 0
            test -f "$plist_path" && test ! -L "$plist_path" || exit 0
            test "$(wc -c < "$plist_path")" -le 65536 || exit 0
            private_dir="$(mktemp -d "$RUNNER_TEMP/lazysh-ios-version-private.XXXXXX")" || exit 0
            trap 'rm -rf "$private_dir"' EXIT
            (ulimit -f 128; cp "$plist_path" "$private_dir/compiled.plist") 2>/dev/null || exit 0
            plist_path="$private_dir/compiled.plist"
            test "$(wc -c < "$plist_path")" -le 65536 || exit 0
            for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion; do
              (ulimit -f 128; plutil -extract "$key" json -o "$private_dir/$key.json" "$plist_path") 2>/dev/null || exit 0
            done
            digest="$(shasum -a 256 "$plist_path" 2>/dev/null | awk '{print $1}')"
            (ulimit -f 8; jq -n \
              --slurpfile identifier "$private_dir/CFBundleIdentifier.json" \
              --slurpfile short "$private_dir/CFBundleShortVersionString.json" \
              --slurpfile build "$private_dir/CFBundleVersion.json" --arg digest "$digest" '
              def field:
                if length == 1 and (.[0] | type == "string" and length > 0 and length <= 128 and (explode | all(. >= 32 and . != 127)))
                then .[0] else error("invalid compiled version field") end;
              if ($digest | test("^[a-f0-9]{64}$")) then
                {status:"retained", CFBundleIdentifier:($identifier | field),
                  CFBundleShortVersionString:($short | field), CFBundleVersion:($build | field),
                  plistSha256:$digest}
              else error("unavailable compiled plist hash") end
              ' > "$private_dir/receipt.json") 2>/dev/null || exit 0
            test "$(wc -c < "$private_dir/receipt.json")" -le 2048 || exit 0
            mv "$private_dir/receipt.json" "$receipt" || exit 0
            exit 0
          )
      - name: Retain simulator signing evidence before runtime checks
        timeout-minutes: 2
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-ios-signing
          path: ${{ runner.temp }}/lazysh-ios-signing
          if-no-files-found: error
      - name: Link native Mosh tests for iOS devices
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '16.0'
        run: cargo test -p lazysh-mosh-transport --target aarch64-apple-ios --lib --no-run --locked
      - name: Compile watchOS companion and complications
        timeout-minutes: 8
        run: bunx turbo run build:watchos --filter=@lazysh/apple-status
      - name: Create isolated status test simulator
        id: ios-simulator
        run: |
          APPLE_STATUS_SIMULATOR_ID="$(xcrun simctl create lazysh-status-ci com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro)"
          echo "APPLE_STATUS_SIMULATOR_ID=$APPLE_STATUS_SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Run native status lifecycle tests
        timeout-minutes: 8
        run: bunx turbo run test:apple-status --filter=@lazysh/apple-status
      - name: Run native APNs registration state tests
        timeout-minutes: 8
        run: bunx turbo run test:apns --filter=@lazysh/push-registration
      - name: Run native resume cover and lifecycle tests
        timeout-minutes: 8
        run: bunx turbo run test:resume --filter=@lazysh/credential-vault
      - name: Upload native resume results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-ios-resume-results
          path: apps/client/src-tauri/gen/apple/resume-tests.xcresult
          if-no-files-found: warn
      - name: Run native iOS Mosh unit and protocol tests
        id: ios-mosh-native
        timeout-minutes: 18
        run: |
          set -o pipefail
          bun run test:ios-mosh 2>&1 | tee "$RUNNER_TEMP/lazysh-ios-mosh.log"
      - name: Upload raw iOS Mosh diagnostics before app acceptance
        if: ${{ !cancelled() && (steps.ios-mosh-native.outcome == 'success' || steps.ios-mosh-native.outcome == 'failure') }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-ios-mosh-diagnostics
          path: ${{ runner.temp }}/lazysh-ios-mosh.log
          if-no-files-found: error
      - name: Install actual iOS app for native acceptance
        id: ios-app-install
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' && steps.ios-simulator.outcome == 'success' }}
        run: |
          xcrun simctl bootstatus "$APPLE_STATUS_SIMULATOR_ID" -b
          xcrun simctl install "$APPLE_STATUS_SIMULATOR_ID" apps/client/src-tauri/gen/apple/build/arm64-sim/lazysh.app
      - name: Verify actual iOS Mosh IPC and privacy resources
        id: ios-mosh-app
        timeout-minutes: 8
        if: ${{ !cancelled() && steps.ios-app-install.outcome == 'success' }}
        run: xcodebuild -project apps/client/src-tauri/gen/apple/lazysh.xcodeproj -scheme LazyshMoshAppTests -configuration debug -destination "platform=iOS Simulator,id=$APPLE_STATUS_SIMULATOR_ID" -resultBundlePath apps/client/src-tauri/gen/apple/mosh-app.xcresult -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 test CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/apps/client/src-tauri/gen/apple/build/arm64-sim"
      - name: Run native workspace Save, relaunch, and Delete acceptance
        id: ios-workspace
        timeout-minutes: 8
        if: ${{ !cancelled() && steps.ios-app-install.outcome == 'success' && steps.ios-mosh-app.outcome == 'success' }}
        run: bun run test:ios-workspace
      - name: Capture failed workspace filesystem metadata
        if: ${{ !cancelled() && steps.ios-workspace.outcome == 'failure' }}
        timeout-minutes: 1
        env:
          WORKSPACE_OUTCOME: ${{ steps.ios-workspace.outcome }}
        run: |
          # This never changes the test outcome and never starts SDK/simulator tools.
          test "$WORKSPACE_OUTCOME" = failure || exit 0
          set +e
          umask 077
          diagnostic_dir="$RUNNER_TEMP/lazysh-ios-workspace-metadata"
          mkdir -p "$diagnostic_dir" || exit 0
          raw_dir="$(mktemp -d "$RUNNER_TEMP/lazysh-ios-workspace-private.XXXXXX")" || exit 0
          trap 'rm -rf "$raw_dir"' EXIT
          printf 'workspace outcome=failure\n' > "$diagnostic_dir/status.txt"
          capture_metadata() {
            kind="$1"; source_file="$2"; limit="$3"
            result=unavailable
            if test -f "$source_file" && test ! -L "$source_file"; then
              size="$(wc -c < "$source_file")"
              if test "$size" -le "$limit"; then
                if test "$kind" = project; then
                  shasum -a 256 "$source_file" | awk '{print $1}' > "$diagnostic_dir/project.sha256"
                fi
                if (ulimit -f 8192; plutil -convert json -o "$raw_dir/$kind.json" "$source_file") 2>/dev/null &&
                  (ulimit -f 64; jq --arg kind "$kind" --arg device "$APPLE_STATUS_SIMULATOR_ID" -f .github/ios-workspace-metadata.jq "$raw_dir/$kind.json" > "$raw_dir/$kind.filtered.json") 2>/dev/null &&
                  test "$(wc -c < "$raw_dir/$kind.filtered.json")" -le 32768; then
                  cp "$raw_dir/$kind.filtered.json" "$diagnostic_dir/$kind.json" && result=retained
                fi
              fi
            fi
            printf '%s=%s\n' "$kind" "$result" >> "$diagnostic_dir/status.txt"
          }
          capture_metadata project apps/client/src-tauri/gen/apple/lazysh.xcodeproj/project.pbxproj 2097152
          if [[ "$APPLE_STATUS_SIMULATOR_ID" =~ ^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$ ]]; then
            capture_metadata device "$HOME/Library/Developer/CoreSimulator/Devices/$APPLE_STATUS_SIMULATOR_ID/device.plist" 65536
          else
            printf 'device=unavailable\n' >> "$diagnostic_dir/status.txt"
          fi
          exit 0
      - name: Verify tests preserve the prebuilt iOS host binary
        timeout-minutes: 1
        if: ${{ !cancelled() && steps.ios-app-build.outcome == 'success' }}
        run: shasum -a 256 -c "$RUNNER_TEMP/lazysh-ios-signing/host-binary.sha256"
      - name: Upload iOS app acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-ios-app-acceptance-results
          path: |
            apps/client/src-tauri/gen/apple/workspace-ui.xcresult
            apps/client/src-tauri/gen/apple/mosh-app.xcresult
            ${{ runner.temp }}/lazysh-ios-signing
            ${{ runner.temp }}/lazysh-ios-workspace-metadata
          if-no-files-found: warn
      - name: Remove status test simulator
        timeout-minutes: 2
        if: always() && env.APPLE_STATUS_SIMULATOR_ID != ''
        run: xcrun simctl delete "$APPLE_STATUS_SIMULATOR_ID"
