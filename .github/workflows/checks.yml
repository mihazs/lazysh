name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion-candidates:
    uses: ./.github/workflows/companion-artifacts.yml

  client:
    runs-on: ubuntu-24.04
    steps:
      - &source-checkout
        uses: actions/checkout@v4
      - &source-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-client-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-client-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test:hooks
      - run: bun run test:ci
      - run: bunx turbo run build check test --filter=@lazysh/client --concurrency=1
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/client
      - run: bun run test:e2e

  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Install bounded storage observation tool
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Check companion and service packages
        id: agent-checks
        env:
          LAZYSH_TEST_STORAGE_TRACE_DIR: ${{ runner.temp }}/lazysh-storage-traces
        run: bunx turbo run build check check:rust test test:rust lint format:check --filter=@lazysh/agent --filter=@lazysh/account-usage --filter=@lazysh/share-service --filter=@lazysh/transcription-service --filter=@lazysh/notification-service --filter=@lazysh/notification-client
      - name: Upload owned concurrent hook syscall excerpts
        if: ${{ !cancelled() && (steps.agent-checks.outcome == 'success' || steps.agent-checks.outcome == 'failure') }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-storage-syscalls
          path: ${{ runner.temp }}/lazysh-storage-traces
          if-no-files-found: warn
      - name: Measure hosted SQLite phases (diagnostic, no injected delay)
        if: ${{ !cancelled() && (steps.agent-checks.outcome == 'success' || steps.agent-checks.outcome == 'failure') }}
        timeout-minutes: 2
        run: cargo test --locked --package lazysh-agent --lib storage_diagnostics::profile_storage_commit_phases -- --ignored --exact --nocapture

  # This optional product workspace is deliberately outside root Cargo/Turbo builds.
  # Build outside the checkout: Zig 0.16.0 writes source-local zig-pkg dependencies.
  # Source/build contract: packages/herdr-upstream/PROVENANCE.md and ../herdr-guard/README.md.
  herdr-native:
    # Match the oldest native consumer's glibc floor.
    runs-on: ubuntu-22.04
    outputs:
      guarded-sha256: ${{ steps.guarded-artifact.outputs.sha256 }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Set task-owned external source, target and tool paths
        run: |
          printf '%s\n' \
            "HERDR_CI_ROOT=$RUNNER_TEMP/lazysh-herdr-native" \
            "CARGO_TARGET_DIR=$RUNNER_TEMP/lazysh-herdr-native/target" \
            "ZIG_LOCAL_CACHE_DIR=$RUNNER_TEMP/lazysh-herdr-native/zig-local" \
            "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/lazysh-herdr-native/zig-global" \
            "ZIG=$RUNNER_TEMP/lazysh-herdr-native/zig-x86_64-linux-0.16.0/zig" >> "$GITHUB_ENV"
      - name: Verify original source exclusions and copy both guarded siblings
        run: |
          bun test tests/herdr-source.test.ts
          mkdir -p "$HERDR_CI_ROOT/common/src"
          cp -a packages/herdr-upstream "$HERDR_CI_ROOT/herdr-upstream"
          cp -a packages/herdr-guard "$HERDR_CI_ROOT/herdr-guard"
          cp packages/common/src/{hex_digest,guarded_target}.rs "$HERDR_CI_ROOT/common/src/"
          diff --recursive --brief --no-dereference packages/herdr-upstream "$HERDR_CI_ROOT/herdr-upstream"
          diff --recursive --brief --no-dereference packages/herdr-guard "$HERDR_CI_ROOT/herdr-guard"
          diff packages/common/src/hex_digest.rs "$HERDR_CI_ROOT/common/src/hex_digest.rs"
          diff packages/common/src/guarded_target.rs "$HERDR_CI_ROOT/common/src/guarded_target.rs"
      - name: Check the pinned official Rust release manifest
        # Receipt: https://static.rust-lang.org/dist/channel-rust-1.96.1.toml.sha256
        # Rustup independently verifies the component archives against this release manifest.
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 https://static.rust-lang.org/dist/channel-rust-1.96.1.toml -o "$HERDR_CI_ROOT/channel-rust-1.96.1.toml"
          printf '%s  %s\n' '87eb76c53073e72b766083bed5530820694253b832a762d8385bda5759f03975' "$HERDR_CI_ROOT/channel-rust-1.96.1.toml" | sha256sum --check --strict
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - name: Provision checksum-verified Zig 0.16.0 outside the checkout
        # Official receipt: https://ziglang.org/download/index.json [0.16.0][x86_64-linux].shasum
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 180 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$HERDR_CI_ROOT/zig-x86_64-linux-0.16.0.tar.xz"
          printf '%s  %s\n' '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00' "$HERDR_CI_ROOT/zig-x86_64-linux-0.16.0.tar.xz" | sha256sum --check --strict
          tar -xJf "$HERDR_CI_ROOT/zig-x86_64-linux-0.16.0.tar.xz" -C "$HERDR_CI_ROOT"
          "$ZIG" version
          rustc +1.96.1 --version
          cargo +1.96.1 --version
      - name: Download the pinned uucode archive once before local admission
        env:
          HERDR_ARCHIVE_NAME: uucode
          HERDR_ARCHIVE_URL: https://deps.files.ghostty.org/uucode-2826a37a4562284fdacd8fa029d49509cc9bffcd.tar.gz
        run: &herdr-archive-download |
          archive="$HERDR_CI_ROOT/$HERDR_ARCHIVE_NAME.tar.gz"
          curl --fail --silent --show-error --location --max-redirs 5 --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 20 --max-time 180 --max-filesize 33554432 --output "$archive" --write-out 'archive http=%{http_code} bytes=%{size_download} seconds=%{time_total}\n' "$HERDR_ARCHIVE_URL"
          sha256sum "$archive"
      - name: Admit local uucode only with the unchanged Zig package hash
        id: uucode-admission
        working-directory: &herdr-archive-directory ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream/vendor/libghostty-vt
        env:
          HERDR_ARCHIVE_NAME: uucode
          HERDR_PACKAGE_HASH: uucode-0.2.0-ZZjBPlK5VADj7fdoq7G8LIHzD5o6FSkcBXXrRWr4jnrA
        run: &herdr-archive-admission |
          archive="$HERDR_CI_ROOT/$HERDR_ARCHIVE_NAME.tar.gz"
          timeout --kill-after=5s 20s gzip --test "$archive"
          actual=$(timeout --kill-after=5s 60s "$ZIG" fetch "$archive")
          if [ "$actual" != "$HERDR_PACKAGE_HASH" ]; then
            printf '%s\n' 'Herdr archive package hash mismatch' >&2
            exit 1
          fi
      - name: Download the pinned Highway archive once before local admission
        env:
          HERDR_ARCHIVE_NAME: highway
          HERDR_ARCHIVE_URL: https://deps.files.ghostty.org/highway-66486a10623fa0d72fe91260f96c892e41aceb06.tar.gz
        run: *herdr-archive-download
      - name: Admit local Highway only with the unchanged Zig package hash
        id: highway-admission
        working-directory: *herdr-archive-directory
        env:
          HERDR_ARCHIVE_NAME: highway
          HERDR_PACKAGE_HASH: N-V-__8AAGmZhABbsPJLfbqrh6JTHsXhY6qCaLAQyx25e0XE
        run: *herdr-archive-admission
      - name: Download the pinned pixels archive once before local admission
        env:
          HERDR_ARCHIVE_NAME: pixels
          HERDR_ARCHIVE_URL: https://deps.files.ghostty.org/pixels-12207ff340169c7d40c570b4b6a97db614fe47e0d83b5801a932dcd44917424c8806.tar.gz
        run: *herdr-archive-download
      - name: Admit local pixels only with the unchanged Zig package hash
        id: pixels-admission
        working-directory: *herdr-archive-directory
        env:
          HERDR_ARCHIVE_NAME: pixels
          HERDR_PACKAGE_HASH: N-V-__8AADYiAAB_80AWnH1AxXC0tql9thT-R-DYO1gBqTLc
        run: *herdr-archive-admission
      - name: Exercise real local archive rejection controls
        env:
          LAZYSH_HERDR_ARCHIVE_FIXTURES: "1"
        run: bun test tests/herdr-source.test.ts
      - name: Build the real optional Herdr binary
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: cargo +1.96.1 build --locked
      - name: Exercise guarded protocol, API ownership and runtime identity
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: |
          cargo +1.96.1 test --locked --bin herdr guarded_input::
          cargo +1.96.1 test --locked --bin herdr terminal::runtime_registry::guard_identity_tests::
      - name: Build the owned Cargo SSH observation fixture from the compared source
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: cargo +1.96.1 build --locked --example guarded_ssh_fixture
      - name: Exercise owned real Herdr servers, client, PTYs and both cutoffs
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: |
          export HERDR_GUARD_SSH_FIXTURE="$CARGO_TARGET_DIR/debug/examples/guarded_ssh_fixture"
          cargo +1.96.1 test --locked --test guarded_input acceptance::
      - name: Preserve selected stock attachment and endpoint regressions
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: |
          cargo +1.96.1 test --locked --bin herdr client::handshake::
          cargo +1.96.1 test --locked --bin herdr server::clients::
          cargo +1.96.1 test --locked --bin herdr protocol::endpoint::
          cargo +1.96.1 test --locked --bin herdr server::client_transport::
      - name: Compare the compiled protocol schema with the committed artifact
        working-directory: ${{ runner.temp }}/lazysh-herdr-native/herdr-upstream
        run: |
          unset HERDR_UPDATE_API_SCHEMA
          cargo +1.96.1 test --locked --bin herdr api::schema::tests::generated_protocol_schema_artifact_is_current -- --exact

      - name: Retain the exact guarded binary for native SSH interoperability
        id: guarded-artifact
        run: |
          mkdir -p "$HERDR_CI_ROOT/guarded-artifact"
          cp "$CARGO_TARGET_DIR/debug/herdr" "$HERDR_CI_ROOT/guarded-artifact/herdr"
          printf 'sha256=%s\n' "$(sha256sum "$HERDR_CI_ROOT/guarded-artifact/herdr" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: guarded-herdr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lazysh-herdr-native/guarded-artifact/herdr
          if-no-files-found: error
          retention-days: 3

  native-linux:
    needs: herdr-native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev cmake libclang-dev libprotobuf-dev protobuf-compiler libssl-dev zlib1g-dev pkg-config libncurses-dev libevent-dev bison openssh-server tmux dbus-daemon xdg-desktop-portal xvfb xauth webkit2gtk-driver bubblewrap
      - name: Verify native GUI namespace prerequisites
        env:
          LAZYSH_NATIVE_NAMESPACE_NETWORK: private
        run: &native-fixture-namespace |
          namespace_command=(bwrap --unshare-user)
          case "${LAZYSH_NATIVE_NAMESPACE_NETWORK:-}" in
            private) namespace_command=(bwrap --unshare-user --unshare-net --dev-bind / / -- bwrap --unshare-user --unshare-net) ;;
            shared) ;;
            *) printf '%s\n' 'Unsupported native fixture namespace mode' >&2; exit 1 ;;
          esac
          test "$(id -u)" -ne 0
          test -x /usr/bin/bwrap
          bwrap --version
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone || true
          sudo cat /sys/kernel/security/apparmor/profiles | awk '/^(bwrap|unprivileged_userns)/' || true
          "${namespace_command[@]}" --unshare-pid --dev-bind / / --proc /proc --ro-bind /etc/group /etc/group -- /usr/bin/true
      - name: Build the pinned official tmux fixture outside the checkout
        timeout-minutes: 10
        run: |
          test "$(/usr/bin/tmux -V)" = 'tmux 3.2a'
          tmux_root=$(mktemp -d "$RUNNER_TEMP/lazysh-tmux-3.4-XXXXXX")
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 707213 https://github.com/tmux/tmux/releases/download/3.4/tmux-3.4.tar.gz -o "$tmux_root/tmux-3.4.tar.gz"
          test "$(stat -c%s "$tmux_root/tmux-3.4.tar.gz")" -eq 707213
          printf '%s  %s\n' '551ab8dea0bf505c0ad6b7bb35ef567cdde0ccb84357df142c254f35a23e19aa' "$tmux_root/tmux-3.4.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tmux_root/tmux-3.4.tar.gz" --directory "$tmux_root" --no-same-owner --no-same-permissions
          cd "$tmux_root/tmux-3.4"
          ./configure --prefix="$tmux_root/install"
          make -j2
          make install
          export PATH="$tmux_root/install/bin:$PATH"
          test "$(command -v tmux)" = "$tmux_root/install/bin/tmux"
          test "$(tmux -V)" = 'tmux 3.4'
          echo "$tmux_root/install/bin" >> "$GITHUB_PATH"
          echo "LAZYSH_TEST_TMUX=$tmux_root/install/bin/tmux" >> "$GITHUB_ENV"
      - &official-mosh-fixture
        name: Build the pinned official Mosh fixture outside the checkout
        timeout-minutes: 10
        run: |
          mosh_root=$(mktemp -d "$RUNNER_TEMP/lazysh-mosh-1.4.0-XXXXXX")
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --max-filesize 2097152 https://github.com/mobile-shell/mosh/releases/download/mosh-1.4.0/mosh-1.4.0.tar.gz -o "$mosh_root/mosh-1.4.0.tar.gz"
          printf '%s  %s\n' '872e4b134e5df29c8933dff12350785054d2fd2839b5ae6b5587b14db1465ddd' "$mosh_root/mosh-1.4.0.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$mosh_root/mosh-1.4.0.tar.gz" --directory "$mosh_root" --no-same-owner --no-same-permissions
          cd "$mosh_root/mosh-1.4.0"
          ./configure --prefix="$mosh_root/install"
          make -j2
          make install
          export PATH="$mosh_root/install/bin:$PATH"
          test "$(command -v mosh-server)" = "$mosh_root/install/bin/mosh-server"
          mosh_version=$(mosh-server --version)
          test "${mosh_version%%$'\n'*}" = 'mosh-server (mosh 1.4.0) [build mosh 1.4.0]'
          echo "$mosh_root/install/bin" >> "$GITHUB_PATH"
          echo "LAZYSH_NATIVE_MOSH_SERVER=$mosh_root/install/bin/mosh-server" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          # Native dependency objects must match this runner's glibc baseline.
          prefix-key: v0-rust-ubuntu-22.04
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build test:rust lint format:check --filter=@lazysh/client...
      - uses: actions/download-artifact@v4
        with:
          name: guarded-herdr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lazysh-guarded-herdr
      - name: Verify same-run guarded binary and exercise owned SSH binding
        env:
          GUARDED_HERDR_SHA256: ${{ needs.herdr-native.outputs.guarded-sha256 }}
          LAZYSH_TEST_HERDR: ${{ runner.temp }}/lazysh-guarded-herdr/herdr
        run: |
          cd "$RUNNER_TEMP/lazysh-guarded-herdr"
          printf '%s  herdr\n' "$GUARDED_HERDR_SHA256" | sha256sum --check --strict
          chmod 700 herdr
          timeout --kill-after=2s 5s "$LAZYSH_TEST_HERDR" --version
          cd "$GITHUB_WORKSPACE"
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib ssh::tmux_jump_fixture::herdr_guard::real_guarded_herdr_ssh_binding_keeps_original_connection_source_and_lease -- --ignored --exact
          printf '%s\n' "LAZYSH_TEST_HERDR=$LAZYSH_TEST_HERDR" "LAZYSH_TEST_AGENT_BIN=$GITHUB_WORKSPACE/target/release/lazysh-agent" "LAZYSH_TEST_RECEIVER_BIN=$GITHUB_WORKSPACE/target/release/examples/owned_terminal_receiver" >> "$GITHUB_ENV"
      - name: Exercise owned companion transfer and exact Mosh entry over SSH
        env:
          LAZYSH_TEST_AGENT_BIN: ${{ github.workspace }}/target/release/lazysh-agent
        run: |
          cargo build --release --locked -p lazysh-agent --bin lazysh-agent --example owned_terminal_receiver
          cases=(ssh::tests::openssh_companion_install_and_managed_path ssh::tests::openssh_account_usage_channel_cancellation_reaps_workers ssh::tmux_jump_fixture::missing_mosh_executable_is_safe_for_auto_before_any_target_creation ssh::tmux_jump_fixture::real_mosh_tmux_entry_binds_exact_namespace_and_survives_receipt_and_bootstrap_closure ssh::tmux_jump_fixture::herdr_guard::real_guarded_mosh_keeps_private_claim_and_exact_display_after_bootstrap_closure)
          for case_name in "${cases[@]}"; do
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact
          done
      - name: Check standalone Parakeet runtime and native ownership boundary
        run: bunx turbo run test:rust lint format:check --filter=@lazysh/parakeet-runtime
      - name: Check combined native voice startup and clean shutdown without models
        run: bunx turbo run test:voice-interop:smoke --filter=@lazysh/client
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned native GUI protocol driver
        run: cargo install --locked --version 2.1.0 tauri-driver --root "$RUNNER_TEMP/lazysh-native-driver"
      - name: Prepare owned native GUI system tools
        run: |
          tools_dir=$(mktemp -d "$RUNNER_TEMP/lazysh-native-tools.XXXXXX")
          for tool in WebKitWebDriver Xvfb; do
            source=$(readlink -f "/usr/bin/$tool")
            install -m 0755 "$source" "$tools_dir/$tool"
            cmp "$source" "$tools_dir/$tool"
          done
          echo "LAZYSH_NATIVE_GUI_WEBKIT_DRIVER=$tools_dir/WebKitWebDriver" >> "$GITHUB_ENV"
          echo "LAZYSH_NATIVE_GUI_XVFB=$tools_dir/Xvfb" >> "$GITHUB_ENV"
      - name: Exercise owned Linux native singleton GUI delivery
        id: native-gui
        env:
          LAZYSH_NATIVE_GUI_DRIVER: ${{ runner.temp }}/lazysh-native-driver/bin/tauri-driver
        run: |
          LAZYSH_TEST_SSH_USER_NAMESPACE=1 bwrap --unshare-user --unshare-net --dev-bind / / -- bun test tests/android-ssh-host.test.ts --test-name-pattern 'owned namespaced SSH'
          bun run test:native-gui
      - name: Exercise actual native GUI installation from the public companion release
        timeout-minutes: 12
        env:
          LAZYSH_NATIVE_GUI_DRIVER: ${{ runner.temp }}/lazysh-native-driver/bin/tauri-driver
          LAZYSH_PUBLISHED_NATIVE_GUI: '1'
        run: bun run --cwd apps/client test:published-native-gui
      - name: Retain only the owned synthetic native GUI image
        if: ${{ !cancelled() && (steps.native-gui.outcome == 'success' || steps.native-gui.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-native-singleton-gui
          path: apps/client/test-results/native-gui
          if-no-files-found: warn
      - run: bun run test:mosh
      - name: Exercise retained tmux display navigation and hostile control streams
        run: bunx turbo run test:tmux --filter=@lazysh/client
      - name: Exercise original-display Chat input and retirement on supported tmux
        shell: bash
        run: |
          test "$(tmux -V)" = 'tmux 3.4'
          case_name=ssh::tmux_jump_fixture::real_tmux_chat_original_display_namespace_bytes_and_retirement
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact
      - name: Reject unsupported apt tmux loops without binding authority
        shell: bash
        env:
          LAZYSH_TEST_TMUX: /usr/bin/tmux
        run: |
          test "$(/usr/bin/tmux -V)" = 'tmux 3.2a'
          case_name=ssh::tmux_jump_fixture::real_tmux_unsupported_client_loops_keep_terminal_without_binding
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --list --ignored --exact | grep -Fx -- "$case_name: test"
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_name" -- --ignored --exact

  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: |
          brew install protobuf openssl@3 zlib pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix protobuf)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Verify release consistency on the native filesystem
        run: bun run release:check
      - name: Verify Windows file hashing against independent known vectors
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          LAZYSH_TEST_WINDOWS_HASH: '1'
        run: bun test tests/release-artifacts.test.ts --test-name-pattern 'actual Windows SHA256'
      - name: Exercise account quota collectors and process ownership
        run: bunx turbo run test:rust --filter=@lazysh/account-usage
      - run: bun run build:native
      - run: bunx turbo run test:rust --filter=@lazysh/credential-vault
      - name: Package and validate native macOS permission localizations
        if: runner.os == 'macOS'
        run: |
          bun run --cwd apps/client tauri build --bundles app
          plutil -lint target/release/bundle/macos/lazysh.app/Contents/Resources/{en,pt-BR,es}.lproj/{InfoPlist,NativeUI}.strings
      - name: Package the actual Windows NSIS installer
        if: runner.os == 'Windows'
        run: bun run --cwd apps/client tauri build --bundles nsis -- --locked
      - name: Exercise actual Windows install, same-version repair and uninstall
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          LAZYSH_TEST_WINDOWS_INSTALLER: '1'
        run: bun test tests/release-artifacts.test.ts --test-name-pattern 'actual Windows NSIS'
      - name: Reject unverified Windows private-file permissions
        if: runner.os == 'Windows'
        run: cargo test --locked -p lazysh-common --features service --lib service_secrets::tests::public_storage_helpers_reject_unverified_host_permissions -- --exact
      - name: Exercise native companion WAL admission and recovery
        run: bun run test:storage
      - name: Build pinned Parakeet runtime and exercise native macOS ACL storage
        if: runner.os == 'macOS'
        run: bunx turbo run test:rust lint format:check --filter=@lazysh/parakeet-runtime
      - name: Exercise native desktop launch parsing and original-lease admission
        run: "cargo test --locked -p lazysh --lib desktop_launch::"
      - name: Exercise native local PTY and ConPTY lifecycle
        run: bunx turbo run test:local --filter=@lazysh/client
      - name: Verify uploaded paths through the owned Mac host clipboard
        if: runner.os == 'macOS'
        env:
          LAZYSH_TEST_OWNED_MAC_CLIPBOARD: "1"
        run: bunx turbo run test:host-clipboard --filter=@lazysh/client
      - name: Exercise native display-idle ownership and platform API release
        run: bunx turbo run test:rust --filter=@lazysh/display-idle
      - name: Exercise native resume policy persistence and cancellation
        run: bunx turbo run test:resume-policy --filter=@lazysh/client

  native-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - &android-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - &android-sdk
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - &android-toolchains
        run: sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - &android-ndk
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - &android-cache-identity
        name: Fingerprint Android native build tools
        run: |
          cmake_identity=$(cmake --version)
          clang_identity=$("$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version)
          host_glibc=$(getconf GNU_LIBC_VERSION)
          host_arch=$(uname -m)
          toolchain_digest=$(printf '%s\n' "$NDK_HOME" "$cmake_identity" "$clang_identity" "$host_glibc" "$host_arch" | sha256sum)
          printf 'LAZYSH_ANDROID_TOOLCHAIN=%s\n' "${toolchain_digest%% *}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: &android-cache-environment
          env-vars: LAZYSH_ANDROID_TOOLCHAIN
      - run: bun install --frozen-lockfile
      - run: bun run build:android
      - name: Inspect normal Android Google push graph and packaged classes
        run: LAZYSH_ANDROID_PUSH_VARIANT=google bunx turbo run test:android-push-artifact --filter=@lazysh/client
      - run: ./gradlew :tauri-plugin-lazysh-vault:testDebugUnitTest --no-daemon
        working-directory: apps/client/src-tauri/gen/android
      - name: Exercise native Android ingress and compiled startup log policy
        run: ./gradlew :tauri-plugin-deep-link:testDebugUnitTest :tauri-plugin-lazysh-push:testDebugUnitTest :app:testUniversalDebugUnitTest :app:testUniversalReleaseUnitTest -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false --no-daemon
        working-directory: apps/client/src-tauri/gen/android
      - uses: actions/upload-artifact@v4
        with:
          name: lazysh-android-debug-arm64
          path: |
            apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/push-artifact/google.json

  native-android-runtime:
    needs: herdr-native
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5580
      LAZYSH_ANDROID_UI_COMPANION: '1'
      VITE_LAZYSH_QR_CAMERA_TRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - *android-java
      - *android-sdk
      - *android-toolchains
      - *android-ndk
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Install native Mosh fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y openssh-server openssh-client iproute2 mosh bubblewrap protobuf-compiler libprotobuf-dev libssl-dev zlib1g-dev libncurses-dev pkg-config cmake perl
      - name: Verify native GUI namespace prerequisites
        env:
          LAZYSH_NATIVE_NAMESPACE_NETWORK: shared
        run: *native-fixture-namespace
      - *official-mosh-fixture
      - *android-cache-identity
      - uses: Swatinem/rust-cache@v2
        with: *android-cache-environment
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: guarded-herdr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lazysh-guarded-herdr
      - name: Verify same-run Herdr and build the real companion for packaged Chat
        env:
          GUARDED_HERDR_SHA256: ${{ needs.herdr-native.outputs.guarded-sha256 }}
        run: |
          cd "$RUNNER_TEMP/lazysh-guarded-herdr"
          printf '%s  herdr\n' "$GUARDED_HERDR_SHA256" | sha256sum --check --strict
          chmod 700 herdr
          cd "$GITHUB_WORKSPACE"
          cargo test --locked -p lazysh-agent --example owned_terminal_receiver
          cargo build --locked -p lazysh-agent --bins --example owned_terminal_receiver
          printf '%s\n' "LAZYSH_TEST_HERDR=$RUNNER_TEMP/lazysh-guarded-herdr/herdr" "LAZYSH_TEST_AGENT_BIN=$GITHUB_WORKSPACE/target/debug/lazysh-agent" "LAZYSH_TEST_RECEIVER_BIN=$GITHUB_WORKSPACE/target/debug/examples/owned_terminal_receiver" "LAZYSH_ANDROID_UI_HERDR=1" >> "$GITHUB_ENV"
      - name: Grant this runner access to KVM
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
      - name: Run native Android instrumentation
        uses: mihazs/lazysh-android-emulator-runner@46beb5d59b664ea61462125a023549a5a7b0418b
        with:
          # NativeActivityFixture owns screen/keyguard readiness; avoid early MENU input.
          unlock-screen: false
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          avd-name: lazysh-runtime-api36
          emulator-port: 5580
          ram-size: 3072M
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -accel on -camera-back imagefile:${{ github.workspace }}/apps/client/src-tauri/fixtures/theme-qr-camera-feed.png -camera-front none -qemu -pidfile ${{ runner.temp }}/lazysh-qr-emulator.pid
          pre-emulator-launch-script: $ANDROID_HOME/emulator/emulator -accel-check
          # The action runs each newline in a separate shell; fold this into one
          # invocation so cleanup runs before the action terminates the emulator.
          script: >-
            bash -c '
            diagnostic_dir="apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/system-diagnostics";
            mkdir -p "$diagnostic_dir";
            capture() {
            local name="$1"; shift;
            (ulimit -c 0; ulimit -f 1024; exec timeout --kill-after=2s 10s "$@") > "$diagnostic_dir/$name.txt" 2>&1;
            local code=$?;
            printf "%s exit=%s\n" "$name" "$code" >> "$diagnostic_dir/status.txt";
            };
            cleanup() {
            local result=$?;
            trap - EXIT INT TERM;
            if (( result != 0 )); then
            capture kernel-load adb shell "date -u; cat /proc/uptime /proc/loadavg /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory";
            capture cpu-load adb shell dumpsys cpuinfo;
            capture lastanr adb shell dumpsys activity lastanr;
            capture lastanr-traces adb shell dumpsys activity lastanr-traces;
            fi;
            kill %1 2>/dev/null || true;
            wait "$collector_pid"; local collector_result=$?;
            printf "collector exit=%s; test exit=%s\n" "$collector_result" "$result" >> "$diagnostic_dir/status.txt";
            exit "$result";
            };
            trap cleanup EXIT;
            trap "exit 130" INT;
            trap "exit 143" TERM;
            (ulimit -c 0; ulimit -f 1024; exec timeout --kill-after=2s 1800s adb logcat
            -b main -b system -b events -v threadtime
            "ActivityManager:E" "InputDispatcher:W" "WindowManager:W" "am_anr:I" "*:S")
            > "$diagnostic_dir/system-anr.txt" 2> "$diagnostic_dir/collector-errors.txt" &
            collector_pid=$!;
            capture start-load adb shell "date -u; cat /proc/uptime /proc/loadavg /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory";
            bun run test:android-mosh && bun run test:android-ssh;
            original_result=$?;
            bun run test:android-fdroid;
            fdroid_result=$?;
            if (( original_result != 0 )); then exit "$original_result"; fi;
            if (( fdroid_result != 0 )); then exit "$fdroid_result"; fi;
            LAZYSH_ANDROID_QR_EMULATOR_PID_FILE="$RUNNER_TEMP/lazysh-qr-emulator.pid" bun run test:android-qr &&
            LAZYSH_TEST_ANDROID_SERIAL="$ANDROID_SERIAL" cargo test --locked -p lazysh-agent --lib devices::tests::android_owned_emulator_inventory_and_screenshot -- --ignored --exact --nocapture;
            exit $?;
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazysh-android-runtime-results
          path: |
            apps/client/src-tauri/gen/android/app/build/reports/androidTests/
            apps/client/src-tauri/gen/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn

