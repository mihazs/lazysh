name: Android startup CPU budget diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abba:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_SERIAL: emulator-5580
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - name: Grant this owned VM access to KVM
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
      - name: Admit host CPU budget and absent AVD
        run: bun tests/support/androidStartup.ts prepare
      - name: A1 cold boot with two guest cores
        id: a1
        if: ${{ env.STARTUP_READY == 'true' }}
        continue-on-error: true
        uses: mihazs/lazysh-android-emulator-runner@46beb5d59b664ea61462125a023549a5a7b0418b
        with: &cold-boot
          cores: ${{ env.STARTUP_CORES }}
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          avd-name: lazysh-runtime-api36
          force-avd-creation: true
          emulator-port: 5580
          ram-size: 3072M
          emulator-boot-timeout: 300
          emulator-build: 16428233
          unlock-screen: false
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -accel on -camera-back imagefile:${{ github.workspace }}/apps/client/src-tauri/fixtures/theme-qr-camera-feed.png -camera-front none -qemu -pidfile ${{ env.LAZYSH_ANDROID_QR_EMULATOR_PID_FILE }}
          pre-emulator-launch-script: bun tests/support/androidStartup.ts seal
          script: bun tests/support/androidStartup.ts observe
      - name: Verify retirement and prepare next fresh AVD
        if: ${{ always() && steps.a1.outcome != 'skipped' }}
        env:
          STARTUP_ACTION_OUTCOME: ${{ steps.a1.outcome }}
        run: bun tests/support/androidStartup.ts retire
      - name: B1 cold boot with four guest cores
        id: b1
        if: ${{ success() && env.STARTUP_READY == 'true' }}
        continue-on-error: true
        uses: mihazs/lazysh-android-emulator-runner@46beb5d59b664ea61462125a023549a5a7b0418b
        with: *cold-boot
      - name: Verify B1 retirement
        if: ${{ always() && steps.b1.outcome != 'skipped' }}
        env:
          STARTUP_ACTION_OUTCOME: ${{ steps.b1.outcome }}
        run: bun tests/support/androidStartup.ts retire
      - name: B2 cold boot with four guest cores
        id: b2
        if: ${{ success() && env.STARTUP_READY == 'true' }}
        continue-on-error: true
        uses: mihazs/lazysh-android-emulator-runner@46beb5d59b664ea61462125a023549a5a7b0418b
        with: *cold-boot
      - name: Verify B2 retirement
        if: ${{ always() && steps.b2.outcome != 'skipped' }}
        env:
          STARTUP_ACTION_OUTCOME: ${{ steps.b2.outcome }}
        run: bun tests/support/androidStartup.ts retire
      - name: A2 cold boot with two guest cores
        id: a2
        if: ${{ success() && env.STARTUP_READY == 'true' }}
        continue-on-error: true
        uses: mihazs/lazysh-android-emulator-runner@46beb5d59b664ea61462125a023549a5a7b0418b
        with: *cold-boot
      - name: Verify A2 retirement
        if: ${{ always() && steps.a2.outcome != 'skipped' }}
        env:
          STARTUP_ACTION_OUTCOME: ${{ steps.a2.outcome }}
        run: bun tests/support/androidStartup.ts retire
      - name: Record complete or inconclusive ABBA result
        if: ${{ always() }}
        run: bun tests/support/androidStartup.ts summarize
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: android-startup-cpu-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lazysh-startup-cpu-budget/results/
          if-no-files-found: error
