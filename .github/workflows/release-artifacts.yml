name: Build verified release installation files

on:
  workflow_call:
    inputs:
      initial:
        type: boolean
        default: false
      native-terminal:
        description: Build with the native terminal engine's kill switch (default leaves it to the repository variable LAZYSH_NATIVE_TERMINAL, then on)
        type: string
        default: default
    secrets:
      ANDROID_KEYSTORE_BASE64: {required: false}
      ANDROID_STORE_PASSWORD: {required: false}
      ANDROID_KEY_PASSWORD: {required: false}
      ANDROID_KEY_ALIAS: {required: false}
      ANDROID_SIGNER_SHA256: {required: false}
      IOS_CERTIFICATE_BASE64: {required: false}
      IOS_CERTIFICATE_PASSWORD: {required: false}
      IOS_PROFILES_BASE64_JSON: {required: false}
      APPLE_DEVELOPMENT_TEAM: {required: false}
  workflow_dispatch:
    inputs:
      platform:
        description: Private build verification only; never creates tags or releases
        type: choice
        options: [all, desktop, android, ios, companion]
        default: all
      native-terminal:
        description: Native terminal engine kill switch for this build (default leaves it to the repository variable LAZYSH_NATIVE_TERMINAL, then on)
        type: choice
        options: [default, "on", "off"]
        default: default

permissions:
  contents: read

jobs:
  companion:
    if: github.ref == 'refs/heads/main' && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'companion' || inputs.platform == 'desktop')
    uses: ./.github/workflows/companion-artifacts.yml
    with:
      stage: true

  # Each desktop package bundles the companion this run's `companion` job built and verified for its
  # platform (never a second build of it), so the desktop builds start once those artifacts exist.
  desktop:
    needs: companion
    if: github.ref == 'refs/heads/main' && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'desktop')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64, bundles: 'deb,appimage', companion: linux-agent-x64}
          - {os: windows-2025, target: windows-x64, bundles: nsis, companion: windows-agent-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - &checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      # Release jobs restore main-saved dependency downloads only; nothing is saved and no
      # build output (target/, Gradle build/) is cached, so every binary compiles from source.
      - &bun
        uses: ./.github/actions/setup-bun
        with:
          restore-only: 'true'
      - uses: dtolnay/rust-toolchain@stable
      - &cargo-registry
        uses: ./.github/actions/cargo-registry
      # The Linux client links the pinned prebuilt static ORT; restore-only, verified every time.
      - if: matrix.target == 'linux-x64'
        uses: ./.github/actions/parakeet-onnxruntime
      - if: runner.os == 'Linux'
        run: sudo sh .github/scripts/apt-install.sh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev cmake libclang-dev libprotobuf-dev protobuf-compiler libssl-dev zlib1g-dev pkg-config
      - if: runner.os == 'macOS'
        run: |
          brew install protobuf openssl@3 zlib pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix protobuf)/lib/pkgconfig" >> "$GITHUB_ENV"
      - &install
        run: bun install --frozen-lockfile
      # The kill switch (#1342): `off` builds the client and the app without the native terminal engine (docs/install-and-update.md, "Maintainers").
      - &native-terminal-switch
        name: Resolve the native terminal kill switch
        # POSIX syntax ($GITHUB_ENV, sh): the Windows runner's default shell is PowerShell, where it fails with an empty FilePath (v1.97.7).
        shell: bash
        env:
          SWITCH_INPUT: ${{ inputs.native-terminal }}
          SWITCH_VARIABLE: ${{ vars.LAZYSH_NATIVE_TERMINAL }}
        run: echo "LAZYSH_NATIVE_TERMINAL=$(sh .github/scripts/native-terminal-switch.sh "$SWITCH_INPUT" "$SWITCH_VARIABLE")" | tee -a "$GITHUB_ENV"
      - name: Verify exact trusted source and synchronized version
        run: bun .changeset/release-artifacts.ts identity "${{ runner.temp }}/release-identity"
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.companion }}
          path: ${{ runner.temp }}/published-companion
      - name: Stage the verified companion where the Tauri bundler picks up its sidecar
        run: bun .changeset/release-bundle.ts stage ${{ matrix.target }} "${{ runner.temp }}/published-companion"
      - name: Provision the Windows native terminal toolchain
        if: matrix.target == 'windows-x64'
        shell: bash
        run: |
          root="$(cygpath -m "$RUNNER_TEMP")/lazysh-windows-release"
          sh .github/scripts/windows-terminal-zig.sh "$root"
          printf '%s\n' "ZIG=$root/zig-x86_64-windows-0.16.0/zig.exe" "LIBGHOSTTY_VT_WINDOWS_LIBC=$root/windows-libc.txt" >> "$GITHUB_ENV"
      - name: Build native installation packages without debug flags
        run: bun run --cwd apps/client tauri build --config src-tauri/tauri.bundled-agent.conf.json --bundles ${{ matrix.bundles }} ${{ matrix.target == 'windows-x64' && '--features native-terminal' || '' }} -- --locked
      - name: Validate native packages, require the verified companion in each, accept Windows install and repair, and record exact bytes
        env:
          LAZYSH_COMPANION_DIR: ${{ runner.temp }}/published-companion
        run: bun .changeset/release-platform.ts ${{ matrix.target }} "${{ runner.temp }}/installation-files"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/installation-files
          if-no-files-found: error
          retention-days: 14

  # One runner builds both flavors from the same checkout, toolchains and signer. The Google-free
  # flavor builds first from the pristine tree; Gradle app outputs are removed before each
  # build, so each validated APK is that build's own output. Cargo keeps per-feature artifacts.
  android:
    if: github.ref == 'refs/heads/main' && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CARGO_BUILD_JOBS: '4'
    steps:
      - *checkout
      - *bun
      - *install
      - *native-terminal-switch
      - name: Prepare durable signing identity or report missing configuration
        run: bun .changeset/release-android.ts prepare
      # Java 21, the pinned SDK platforms, build tools and NDK, plus restore-only Gradle
      # dependency jars and wrapper distributions saved from main.
      - uses: ./.github/actions/android-toolchains
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - *cargo-registry
      # Zig 0.16.0 and the admitted Ghostty archives: the Google flavor links libghostty-vt through the native-terminal feature.
      # The FOSS flavor stays without it until the F-Droid recipe builds the same engine (docs/architecture/terminal-migration-plan.md).
      - uses: ./.github/actions/ghostty-zig
        with:
          link-source: 'true'
          restore-only: 'true'
      - name: Build each release flavor with the configured signer, validating each APK before the next build
        run: |
          # The runner image presets ANDROID_NDK_HOME to its own NDK, which libghostty-vt's Zig build reads first.
          export CMAKE_ANDROID_NDK="$NDK_HOME" ANDROID_NDK_HOME="$NDK_HOME" WHISPER_DONT_GENERATE_BINDINGS=1
          outputs=apps/client/src-tauri/gen/android/app/build
          for variant in foss google; do
            rm -rf -- "$outputs"
            # Only the Google flavor links the prebuilt ONNX Runtime for Parakeet; the FOSS flavor builds every native library from source.
            features=(--features parakeet-android,native-terminal)
            if [ "$variant" = foss ]; then features=(--features fdroid); fi
            sh "$GITHUB_WORKSPACE/.github/scripts/retry-gradle-resolution.sh" sh "$GITHUB_WORKSPACE/.github/scripts/retry-zig-fetch.sh" bun run --cwd apps/client tauri android build --target aarch64 --apk --ci "${features[@]}" -- --locked
            bun .changeset/release-platform.ts "android-$variant-arm64" "$RUNNER_TEMP/installation-files/android-$variant-arm64"
            # The Google flavor carries the engine unless the kill switch is off, the FOSS flavor never does: a mismatch fails before upload.
            bun .github/scripts/apk-engine.ts "$outputs"/outputs/apk/universal/release/*.apk "$variant" "$LAZYSH_NATIVE_TERMINAL"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-foss-arm64
          path: ${{ runner.temp }}/installation-files/android-foss-arm64
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-google-arm64
          path: ${{ runner.temp }}/installation-files/android-google-arm64
          if-no-files-found: error
          retention-days: 14
      - name: Remove only this job's private signing files
        if: always()
        run: bun .changeset/release-android.ts cleanup

  ios:
    if: github.ref == 'refs/heads/main' && inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILES_BASE64_JSON: ${{ secrets.IOS_PROFILES_BASE64_JSON }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - *checkout
      - *bun
      - *install
      - *native-terminal-switch
      - name: Prepare all four authorized profiles and an owned signing keychain
        run: bun .changeset/release-apple.ts prepare
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: brew install protobuf openssl@3 zlib pkgconf
      - name: Archive current device source without pretending the archive is installable
        run: bun run --cwd apps/client tauri ios build --target aarch64 --ci --no-sign --archive-only -- --locked
      - name: Export a signed registered-device IPA with every embedded target
        run: bun .changeset/release-apple.ts export
      - name: Validate signatures, profiles and version before retaining IPA
        run: bun .changeset/release-platform.ts ios-arm64 "${{ runner.temp }}/installation-files"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios-arm64
          path: ${{ runner.temp }}/installation-files
          if-no-files-found: error
          retention-days: 14
      - name: Remove this job's profiles, restore keychain and remove signing material
        if: always()
        run: bun .changeset/release-apple.ts cleanup

  # Build-only verification of the full set. The release-tag caller (no platform input)
  # aggregates inside its single publication job instead of queueing another runner here.
  aggregate:
    needs: [desktop, android, companion]
    if: inputs.platform == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: ./.github/actions/release-aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-set
          path: ${{ runner.temp }}/verified-release
          if-no-files-found: error
          retention-days: 14
