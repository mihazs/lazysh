name: Build verified release installation files

on:
  workflow_call:
    inputs:
      initial:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64: {required: false}
      ANDROID_STORE_PASSWORD: {required: false}
      ANDROID_KEY_PASSWORD: {required: false}
      ANDROID_KEY_ALIAS: {required: false}
      ANDROID_SIGNER_SHA256: {required: false}
      IOS_CERTIFICATE_BASE64: {required: false}
      IOS_CERTIFICATE_PASSWORD: {required: false}
      IOS_PROFILES_BASE64_JSON: {required: false}
      APPLE_DEVELOPMENT_TEAM: {required: false}
  workflow_dispatch:
    inputs:
      platform:
        description: Private build verification only; never creates tags or releases
        type: choice
        options: [all, desktop, android, ios]
        default: all

permissions:
  contents: read

jobs:
  desktop:
    if: github.ref == 'refs/heads/main' && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'desktop')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64, bundles: 'deb,appimage'}
          - {os: windows-2025, target: windows-x64, bundles: nsis}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - &checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - &bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev cmake libclang-dev libprotobuf-dev protobuf-compiler libssl-dev zlib1g-dev pkg-config
      - if: runner.os == 'macOS'
        run: |
          brew install protobuf openssl@3 zlib pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix protobuf)/lib/pkgconfig" >> "$GITHUB_ENV"
      - &install
        run: bun install --frozen-lockfile
      - name: Verify exact trusted source and synchronized version
        run: bun .changeset/release-artifacts.ts identity "${{ runner.temp }}/release-identity"
      - name: Build native installation packages without debug flags
        run: bun run --cwd apps/client tauri build --bundles ${{ matrix.bundles }} -- --locked
      - name: Validate native packages, accept Windows install and repair, and record exact bytes
        run: bun .changeset/release-platform.ts ${{ matrix.target }} "${{ runner.temp }}/installation-files"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/installation-files
          if-no-files-found: error
          retention-days: 14

  android:
    if: github.ref == 'refs/heads/main' && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'android')
    strategy:
      fail-fast: false
      matrix:
        variant: [google, foss]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_SIGNER_SHA256: ${{ secrets.ANDROID_SIGNER_SHA256 }}
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CARGO_BUILD_JOBS: '4'
    steps:
      - *checkout
      - *bun
      - *install
      - name: Prepare durable signing identity or report missing configuration
        run: bun .changeset/release-android.ts prepare
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build the selected release variant with the configured signer
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          export CMAKE_ANDROID_NDK="$NDK_HOME" WHISPER_DONT_GENERATE_BINDINGS=1
          if [ "$VARIANT" = foss ]; then
            bun run --cwd apps/client tauri android build --target aarch64 --apk --ci --features fdroid -- --locked
          else
            bun run --cwd apps/client tauri android build --target aarch64 --apk --ci -- --locked
          fi
      - name: Validate signer and real APK identity before retaining installation bytes
        run: bun .changeset/release-platform.ts android-${{ matrix.variant }}-arm64 "${{ runner.temp }}/installation-files"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-${{ matrix.variant }}-arm64
          path: ${{ runner.temp }}/installation-files
          if-no-files-found: error
          retention-days: 14
      - name: Remove only this job's private signing files
        if: always()
        run: bun .changeset/release-android.ts cleanup

  ios:
    if: github.ref == 'refs/heads/main' && inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILES_BASE64_JSON: ${{ secrets.IOS_PROFILES_BASE64_JSON }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - *checkout
      - *bun
      - *install
      - name: Prepare all four authorized profiles and an owned signing keychain
        run: bun .changeset/release-apple.ts prepare
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: brew install protobuf openssl@3 zlib pkgconf
      - name: Archive current device source without pretending the archive is installable
        run: bun run --cwd apps/client tauri ios build --target aarch64 --ci --no-sign --archive-only -- --locked
      - name: Export a signed registered-device IPA with every embedded target
        run: bun .changeset/release-apple.ts export
      - name: Validate signatures, profiles and version before retaining IPA
        run: bun .changeset/release-platform.ts ios-arm64 "${{ runner.temp }}/installation-files"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios-arm64
          path: ${{ runner.temp }}/installation-files
          if-no-files-found: error
          retention-days: 14
      - name: Remove this job's profiles, restore keychain and remove signing material
        if: always()
        run: bun .changeset/release-apple.ts cleanup

  aggregate:
    needs: [desktop, android]
    if: inputs.platform == '' || inputs.platform == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *bun
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/platform-artifacts
      - name: Check every same-run platform package and generate release documents
        env:
          LAZYSH_RELEASE_INITIAL: ${{ inputs.initial || false }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified-release"
          bun .changeset/release-artifacts.ts notes "$RUNNER_TEMP/verified-release"
          bun .changeset/release-artifacts.ts aggregate "$RUNNER_TEMP/platform-artifacts" "$RUNNER_TEMP/verified-release"
          bun .changeset/release-artifacts.ts verify "$RUNNER_TEMP/verified-release"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-set
          path: ${{ runner.temp }}/verified-release
          if-no-files-found: error
          retention-days: 14
