name: terminal-macos-surface

# Report-only probe for #1333: does an NSView hosting a CAMetalLayer, a sibling of the web view inside wry's WryWebViewParent, show
# through the transparent WKWebView? The probe builds the real tao and wry window, reads its own window back from the window server
# and judges placement, overlap, resize and recreate at 1x and 2x. It is not a required check and runs when the probe or app host changes.
# What it found: docs/architecture/macos-surface-composition-poc.md.
on:
  pull_request:
    paths: &surface-paths
      - packages/terminal-runtime/prototypes/macos-surface/**
      - apps/client/src-tauri/src/native_terminal_surface.rs
      - apps/client/src-tauri/src/native_terminal_surface/macos.rs
      - packages/terminal-renderer-wgpu/src/adapter.rs
      - .github/workflows/terminal-macos-surface.yml
  push:
    branches: [main]
    paths: *surface-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terminal-macos-surface:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/terminal-runtime/prototypes/macos-surface
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/terminal-runtime/prototypes/macos-surface
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report the host
        run: |
          sw_vers
          xcodebuild -version
          system_profiler SPDisplaysDataType
          rustc -vV
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --lib
      - run: cargo build --locked --release
      # Each run is its own process and window: the display is put into a 1x or a 2x mode first (exit 3 when it has none, which is
      # "not measured", not a failure), then the surface is judged on the pixels of the window server's capture of the window.
      # The control builds the web view without wry's drawsBackground key and shows what the private key buys.
      - name: Probe the surface below the web view
        timeout-minutes: 15
        env:
          POC_OUT: ${{ runner.temp }}/surface-poc
        run: |
          mkdir -p "$POC_OUT"
          failed=0
          probe() {
            name=$1; shift
            echo "::group::$name"
            env "$@" POC_OUT="$POC_OUT" target/release/surface-poc 2>&1 | tee "$POC_OUT/$name.log"
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            printf '%s: exit %s\n' "$name" "$code" | tee -a "$POC_OUT/exit-codes.txt"
            case $code in 0 | 3) ;; *) failed=1 ;; esac
          }
          probe 1x POC_SCALE=1
          probe 2x POC_SCALE=2
          probe opaque-control POC_TRANSPARENT=0
          { echo '```'; cat "$POC_OUT"/*.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $failed
      - name: Retain the captures and records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-macos-surface-poc
          path: ${{ runner.temp }}/surface-poc
          if-no-files-found: warn


  terminal-macos-app-host:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Install app build dependencies
        run: |
          brew install coreutils protobuf openssl@3 zlib pkgconf
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix protobuf)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: ./.github/actions/ghostty-zig
        with:
          link-source: 'true'
          zig-target: aarch64-macos
          zig-sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
      - name: Build the native-enabled app and run the macOS anchor test
        run: |
          args=(--manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib)
          case_name=native_terminal_surface::macos::tests::css_anchor_respects_backing_scale_zoom_and_flipped_coordinates
          sh .github/scripts/retry-zig-fetch.sh cargo test "${args[@]}" --no-run
          cargo test "${args[@]}" -- --list --exact "$case_name" | grep -Fx "$case_name: test"
          cargo test "${args[@]}" -- --exact "$case_name"
