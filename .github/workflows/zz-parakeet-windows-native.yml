name: zz-parakeet-windows-native
on:
  push:
    branches: [feat/parakeet-windows-x86-64]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Native boundary fixtures
        run: cargo test --locked -p lazysh-parakeet-runtime --test native -- --nocapture
