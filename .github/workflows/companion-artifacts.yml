name: Verify companion executables

on:
  workflow_call:
    inputs:
      stage:
        description: Stage source-bound release receipts only from trusted main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  binary:
    strategy:
      # Pull request candidates stop at the first red platform; release staging (push or
      # dispatch) keeps every platform's verdict.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-agent-x64, triple: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, target: linux-agent-arm64, triple: aarch64-unknown-linux-musl}
          - {os: macos-15-intel, target: macos-agent-x64, triple: x86_64-apple-darwin, minimum: '10.15'}
          - {os: macos-15, target: macos-agent-arm64, triple: aarch64-apple-darwin, minimum: '11.0'}
          - {os: windows-2025, target: windows-agent-x64, triple: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '4'
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum || '' }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          restore-only: 'true'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - if: runner.os == 'Linux'
        run: sudo sh .github/scripts/apt-install.sh musl-tools binutils build-essential libssl-dev pkg-config
      - if: runner.os == 'macOS'
        run: brew install openssl@3 pkgconf
      # Candidates may reuse compiled targets: pull requests restore but never save, main saves.
      # Release staging never restores target/ and compiles every staged executable from source.
      - if: ${{ !inputs.stage }}
        uses: Swatinem/rust-cache@v2
        with:
          key: companion-${{ matrix.triple }}
          save-if: ${{ github.event_name != 'pull_request' }}
      # Release staging restores main's crate downloads only; main candidates seed those entries
      # for every runner OS/architecture a release uses. Pull requests keep rust-cache's copy.
      - if: ${{ inputs.stage || github.event_name != 'pull_request' }}
        uses: ./.github/actions/cargo-registry
        with:
          seed: ${{ !inputs.stage }}
      - run: bun install --frozen-lockfile
      - name: Build final production target without test-only dependencies
        run: cargo build --release --locked --package lazysh-agent --bin lazysh-agent --target ${{ matrix.triple }}
      - name: Ad hoc sign final macOS CLI before hashing
        if: runner.os == 'macOS'
        run: /usr/bin/codesign --force --sign - --identifier app.lazysh.agent "target/${{ matrix.triple }}/release/lazysh-agent"
      - name: Prepare and validate owned bytes for native acceptance
        id: prepare
        env:
          STAGE_COMPANION: ${{ inputs.stage }}
        run: |
          if [ "$STAGE_COMPANION" = true ]; then
            bun .changeset/release-companion.ts stage ${{ matrix.target }} "$RUNNER_TEMP/companion-installation-files"
          else
            bun .changeset/release-companion.ts candidate ${{ matrix.target }} "$RUNNER_TEMP/companion-installation-files"
          fi
      - name: Observe full Windows CLI, WAL and installation owners with finite phases
        id: windows_storage_owner
        if: runner.os == 'Windows'
        env:
          LAZYSH_TEST_COMPANION_BINARY: ${{ steps.prepare.outputs.binary }}
        run: |
          spool="$RUNNER_TEMP/owned-initialization-diagnostics.log"
          owners=(--locked --package lazysh-agent --features storage-observation --test cli --test settings --test storage_wal --test installation)
          # Each burst times sixteen durable writers (two for the bootstrap case) against the
          # unchanged three-second budget. Concurrent flushes on the runner volume, from other
          # owner cases or from a cold compile writing back, stretch every commit, so bursts run
          # alone after all other owners, from binaries compiled beforehand.
          bursts=(bootstrap_observation_tracks_real_store_per_thread concurrent_hooks_preserve_every_event concurrent_ingest_recovers_after_a_transient_database_lock near_deadline_contention_counts_every_success_and_fails_explicitly simultaneous_initialization_and_ingest_preserve_every_event)
          skips=()
          for burst in "${bursts[@]}"; do skips+=(--skip "$burst"); done
          cargo test "${owners[@]}" --no-run
          listed=$(cargo test "${owners[@]}" -- --list --exact "${bursts[@]}" | grep -c ': test$')
          if [ "$listed" -ne "${#bursts[@]}" ]; then echo "burst cases listed=$listed expected=${#bursts[@]}"; exit 1; fi
          set +e
          {
            LAZYSH_STORAGE_DIAGNOSTICS=1 LAZYSH_BOOTSTRAP_OBSERVATION=1 cargo test "${owners[@]}" -- --exact "${skips[@]}"
            ordinary=$?
            LAZYSH_STORAGE_DIAGNOSTICS=1 LAZYSH_BOOTSTRAP_OBSERVATION=1 cargo test "${owners[@]}" -- --exact --test-threads=1 "${bursts[@]}"
            alone=$?
            if [ "$ordinary" -ne 0 ]; then exit "$ordinary"; fi
            exit "$alone"
          } 2>&1 | LAZYSH_STORAGE_SPOOL="$spool" bun -e '
            let output, failed = false;
            try { output = Bun.file(process.env.LAZYSH_STORAGE_SPOOL).writer(); }
            catch { failed = true; }
            let remaining = 128 * 1024 + 1;
            for await (const chunk of Bun.stdin.stream()) {
              const retained = chunk.subarray(0, remaining);
              if (!failed && retained.length) {
                try { output.write(retained); } catch { failed = true; }
              }
              remaining -= retained.length;
            }
            if (output) try { await output.end(); } catch { failed = true; }
            if (failed) { console.error("initialization-capture:unavailable"); process.exitCode = 1; }
          '
          statuses=("${PIPESTATUS[@]}")
          set -e
          original=${statuses[0]}
          capture=${statuses[1]}
          projection=0
          LAZYSH_INITIALIZATION_DIAGNOSTICS="$spool" cargo test --locked --package lazysh-agent --test cli storage_trace::project_owned_initialization_diagnostics -- --ignored --exact --nocapture || projection=$?
          cleanup=0
          rm -f -- "$spool" 2>/dev/null || cleanup=$?
          printf 'initialization-owner-exit=%s capture-exit=%s projection-exit=%s cleanup-exit=%s\n' "$original" "$capture" "$projection" "$cleanup"
          if [ "$original" -ne 0 ]; then exit "$original"; fi
          if [ "$capture" -ne 0 ]; then exit "$capture"; fi
          if [ "$projection" -ne 0 ]; then exit "$projection"; fi
          exit "$cleanup"
      - name: Measure Windows storage writer phases
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.windows_storage_owner.outcome == 'success' || steps.windows_storage_owner.outcome == 'failure') }}
        run: cargo test --locked --package lazysh-agent --lib storage_diagnostics::profile_storage_commit_phases -- --ignored --exact --nocapture
      - name: Check uninstrumented Windows initialization owner
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.windows_storage_owner.outcome == 'success' || steps.windows_storage_owner.outcome == 'failure') }}
        run: cargo test --locked --package lazysh-agent --test cli simultaneous_initialization_and_ingest_preserve_every_event -- --exact
      - name: Native host harness runs CLI, WAL and installation owners against the exact prepared executable
        if: runner.os != 'Windows'
        env:
          LAZYSH_TEST_COMPANION_BINARY: ${{ steps.prepare.outputs.binary }}
        run: cargo test --locked --package lazysh-agent --test cli --test settings --test storage_wal --test installation
      - name: Revalidate exact prepared bytes after the native owners
        env:
          LAZYSH_TEST_COMPANION_BINARY: ${{ steps.prepare.outputs.binary }}
          EXPECTED_COMPANION_SHA: ${{ steps.prepare.outputs.sha256 }}
          EXPECTED_COMPANION_BYTES: ${{ steps.prepare.outputs.bytes }}
        run: bun .changeset/release-companion.ts verify ${{ matrix.target }} "$LAZYSH_TEST_COMPANION_BINARY" "$EXPECTED_COMPANION_SHA" "$EXPECTED_COMPANION_BYTES"
      - uses: actions/upload-artifact@v4
        if: inputs.stage
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/companion-installation-files
          if-no-files-found: error
          retention-days: 14
