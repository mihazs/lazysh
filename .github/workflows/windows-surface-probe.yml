name: windows-surface-probe

# The Windows composition probe (#1332, gate G19): does a child window show through the transparent WebView2 the app
# uses? It opens the real tao and wry window on this runner's desktop, stacks a child window below the web view and above
# it with the overlay cut out of it (GDI-painted and as a Direct3D 12 swapchain), reads its own window back twice
# (PrintWindow and a screen copy) and writes what it saw, once with a transparent tao window and once with an opaque one.
# The job fails when the page itself is not visible in the screen readback (nothing it reports then means anything) and
# when the recorded strategy, a Direct3D 12 child below the web view and above it with a cut-out, stops holding.
# Not a required check, and no checks.yml job selects it (.github/scripts/native-changes.sh).
# Results and limits: docs/architecture/windows-surface-composition-poc.md.
on:
  pull_request:
    paths: &surface-paths
      - packages/terminal-runtime/prototypes/windows-surface/**
      - .github/workflows/windows-surface-probe.yml
      - .github/scripts/windows-terminal-zig.sh
      - apps/client/src-tauri/src/native_terminal_surface.rs
      - apps/client/src-tauri/src/native_terminal_surface/windows.rs
      - apps/client/src-tauri/src/native_terminal_surface/desktop.rs
      - packages/terminal-renderer-wgpu/src/adapter.rs
  push:
    branches: [main]
    paths: *surface-paths
  workflow_dispatch:
    inputs:
      installer_engine:
        description: Build and verify an unsigned NSIS test installer with the native engine on or off
        type: choice
        default: skip
        options: [skip, 'on', 'off']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-surface-probe:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: packages/terminal-runtime/prototypes/windows-surface
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      # Pull requests restore main's entry and never save their own, like the other Rust caches.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/terminal-runtime/prototypes/windows-surface
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the probe's pixel arithmetic
        run: cargo test --locked
      - run: cargo build --locked
      - name: Describe the desktop the probe reads back
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List DeviceName, Bounds, Primary, BitsPerPixel
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty pv
          [System.Environment]::OSVersion.VersionString
      - name: Run the probe against a transparent tao window and WebView2
        run: target/debug/surface-poc.exe "$RUNNER_TEMP/windows-surface/transparent-window"
      # The app's window is opaque today; only the web view would be transparent.
      - name: Run the probe against an opaque tao window and a transparent WebView2
        if: ${{ !cancelled() }}
        run: target/debug/surface-poc.exe --opaque-window "$RUNNER_TEMP/windows-surface/opaque-window"
      - name: Show what the probe saw
        if: ${{ !cancelled() }}
        run: |
          for mode in transparent-window opaque-window; do
            report="$RUNNER_TEMP/windows-surface/$mode/report.md"
            [ ! -f "$report" ] || { echo "### Windows composition probe, $mode"; cat "$report"; } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Retain the readbacks of every step
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-windows-surface
          path: ${{ runner.temp }}/windows-surface
          if-no-files-found: warn
          retention-days: 7

  terminal-windows-app-host:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lazysh-pinned-downloads
          key: lazysh-pinned-downloads-terminal-windows-v1-zig68659eb5
      - name: Provision Zig and the Windows SDK description
        run: |
          root="$(cygpath -m "$RUNNER_TEMP")/lazysh-terminal-windows-app"
          sh .github/scripts/windows-terminal-zig.sh "$root"
          {
            echo "ZIG=$root/zig-x86_64-windows-0.16.0/zig.exe"
            echo "LIBGHOSTTY_VT_WINDOWS_LIBC=$root/windows-libc.txt"
            echo "ZIG_LOCAL_CACHE_DIR=$root/zig-local"
            echo "ZIG_GLOBAL_CACHE_DIR=$root/zig-global"
            echo "CARGO_TARGET_DIR=$root/target"
          } >> "$GITHUB_ENV"
      - name: Build the native-enabled app and run the Windows anchor test
        run: |
          args=(--manifest-path apps/client/src-tauri/Cargo.toml --locked --features native-terminal --lib)
          case_name=native_terminal_surface::windows::tests::anchor_edges_map_to_physical_client_pixels
          sh .github/scripts/retry-zig-fetch.sh cargo test "${args[@]}" --no-run
          cargo test "${args[@]}" -- --list --exact "$case_name" | grep -Fx "$case_name: test"
          cargo test "${args[@]}" -- --exact "$case_name"
      - if: github.event_name == 'workflow_dispatch' && inputs.installer_engine != 'skip'
        uses: ./.github/actions/setup-bun
        with:
          restore-only: 'true'
      - name: Build and verify the unsigned native terminal test installer
        if: github.event_name == 'workflow_dispatch' && inputs.installer_engine != 'skip'
        env:
          LAZYSH_NATIVE_TERMINAL: ${{ inputs.installer_engine }}
        run: |
          bun install --frozen-lockfile
          sh .github/scripts/retry-zig-fetch.sh bun run --cwd apps/client tauri build --bundles nsis --features native-terminal -- --locked
          bun -e '
            import {join} from "node:path";
            import {exactlyOne, windowsInstallation} from "./.changeset/release-platform.ts";
            const build = join(process.env.CARGO_TARGET_DIR, "release");
            const installer = await exactlyOne("nsis/*.exe", join(build, "bundle"));
            const {version} = await Bun.file("apps/client/package.json").json();
            console.info(await windowsInstallation(installer, join(build, "lazysh.exe"), version));
          '
      - name: Retain the verified test installer
        if: github.event_name == 'workflow_dispatch' && inputs.installer_engine != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: lazysh-windows-native-test-installer-${{ inputs.installer_engine }}
          path: ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Verify xterm.js in the installed kill-switch build
        if: github.event_name == 'workflow_dispatch' && inputs.installer_engine == 'off'
        uses: ./.github/actions/windows-installed-gui
        env:
          LAZYSH_NATIVE_TERMINAL: 'off'
