name: zz-interop-probe
on:
  push:
    branches: [chore/windows-interop-trial]
jobs:
  trial:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: A stub frontend, so the client crate's tests compile without building the application
        shell: bash
        run: |
          mkdir -p apps/client/dist
          echo '<!doctype html>' > apps/client/dist/index.html
      - name: Build the companion this checkout produces
        shell: bash
        run: cargo build --locked -p lazysh-agent --bin lazysh-agent
      - name: Exercise the app against an owned Windows OpenSSH server
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LAZYSH_TEST_AGENT_BIN: ${{ github.workspace }}/target/debug/lazysh-agent.exe
        run: |
          failed=0
          for case_name in registry_values_return_to_the_machines_own_or_to_their_absence_on_every_exit_path windows_openssh_under_cmd_exe_identifies_the_host_and_runs_the_companion windows_openssh_under_windows_powershell_identifies_the_host_and_runs_the_companion windows_openssh_files_previews_and_repository_under_cmd_exe windows_openssh_files_previews_and_repository_under_windows_powershell; do
            case_path=ssh::tests::windows_openssh_fixture::$case_name
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_path" -- --list --ignored --exact | grep -Fx -- "$case_path: test" || { echo "::error::$case_name is not an ignored case of the client"; failed=1; continue; }
            cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --lib "$case_path" -- --ignored --exact --nocapture || { echo "::error::$case_name failed"; failed=1; }
          done
          exit $failed
