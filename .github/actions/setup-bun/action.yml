name: Set up the pinned Bun
description: Install the pinned Bun and restore its package install cache keyed by bun.lock
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    # `bun install --frozen-lockfile` checks every cached package against bun.lock's integrity
    # hashes. An exact hit saves nothing; a pull request saves only when it changes bun.lock.
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-install-${{ runner.os }}-${{ runner.arch }}-
