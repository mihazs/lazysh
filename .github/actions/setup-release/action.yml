name: Set up release tools
description: Install the pinned Bun and native version editor without changing global tools
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - uses: dtolnay/rust-toolchain@stable
    - name: Install the pinned native version editor
      shell: bash
      run: cargo install cargo-edit --version 0.13.8 --locked --no-default-features --features set-version --root "$RUNNER_TEMP/release-tools"
    - shell: bash
      run: echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
