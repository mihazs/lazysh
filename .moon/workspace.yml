$schema: 'https://moonrepo.dev/schemas/workspace.json'
versionConstraint: '>=2.6.5 <3'
telemetry: false
projects:
  globs: ['apps/*', 'packages/*']
  sources:
    # Cargo crate "lazysh", nested inside the client app.
    client-native: apps/client/src-tauri
    # Rust sources only, no manifest, so the globs skip it.
    herdr-guard: packages/herdr-guard
constraints:
  enforceLayerRelationships: true
  tagRelationships:
    cargo: [cargo, vendor]
    vendor: [vendor]
vcs:
  provider: github
  defaultBranch: main
pipeline:
  cacheLifetime: '7 days'
