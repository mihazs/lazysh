[package]
name = "lazysh-parakeet-runtime"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Owned synchronous CPU Parakeet runtime with a sealed pinned model bundle"

[features]
default = ["native"]
# The CMake/C++ sherpa-onnx build and its FFI. Without it the crate is empty: the lightweight development build of the app
# (`--no-default-features`, see docs/reference/build-performance.md) links nothing from here.
native = []

[dependencies]
lazysh-common = { path = "../common" }
bzip2 = "0.6"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
dunce = "1"

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
lazysh-common = { path = "../common", features = ["test-support"] }
hound = "3.5"
