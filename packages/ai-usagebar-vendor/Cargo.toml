[package]
name = "ai-usagebar-core"
version = "1.46.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Headless vendored provider quota collectors for lazysh"
repository = "https://github.com/akitaonrails/ai-usagebar"
[lib]
path = "src/lib.rs"
[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "process", "signal", "io-util"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "rustls-tls-native-roots"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1.1"
toml_edit = "0.25"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
fs2 = "0.4"
tempfile = "3"
directories = "6"
thiserror = "2"
base64 = "0.23"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
unicode-width = "0.2"
getrandom = "0.4.3"
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Threading"] }
[dev-dependencies]
mockito = "1"
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
tempfile = "3"
[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = "3"
