[package]
name = "lazysh-account-usage"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Bounded host-only AI account quota collection"

[features]
collector = ["dep:ai-usagebar-core", "dep:tokio", "dep:directories", "dep:libc", "dep:toml", "dep:reqwest", "dep:windows-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ai-usagebar-core = { path = "../ai-usagebar-vendor", optional = true }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"], optional = true }
directories = { version = "6", optional = true }
toml = { version = "1.1", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
