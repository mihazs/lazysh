[package]
name = "lazysh-terminal-runtime"
version = "0.0.0"
edition = "2021"
description = "Shared, UI-independent terminal runtime for lazysh on the vendored libghostty-vt binding"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.96"

# Nested workspace, like ../herdr-upstream: building it compiles libghostty-vt with Zig 0.16.0,
# so the root workspace and default lazysh builds never depend on Zig. See README.md.
[workspace]

# The single Ghostty dependency in the repository: Herdr's vendored binding, unmodified.
[dependencies]
ghostty-vt = { path = "../herdr-upstream/crates/ghostty-vt" }
# The control plane's answers and events are the wire format of the app's commands and of the stdio harness (#1321).
serde = { version = "1", features = ["derive"] }
# URL and host-path detection (links.rs): the patterns of terminalLinks.ts, kept as regular expressions.
regex = { version = "1", default-features = false, features = ["std", "perf"] }

[dev-dependencies]
# Goldens only: already in the lock through ghostty-vt.
png = "0.17"
# Test-only: fixtures are JSON, replayed by tests/vt_fixtures.rs (base64 is already locked via ghostty-vt).
base64 = "0.22"
# Tests replay fixtures, such as the captured Mosh frames of apps/client/e2e/fixtures/mosh-resize-frames.json.
serde_json = "1"
# tests/programs runs real programs (tmux, vim, Herdr, the agent TUIs) on a pty with the core as their terminal.
libc = "0.2"

[profile.release]
debug = false
