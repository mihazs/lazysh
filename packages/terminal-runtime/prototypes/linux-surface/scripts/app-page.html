<!doctype html>
<!-- The page check.py serves to the real app (`--app`): the probe's fixture, with the app's own surface commands in place of the probe's. -->
<html><body style="margin:0;background:transparent;font:14px sans-serif">
<div id="anchor" style="position:absolute;left:60px;top:40px;width:240px;height:160px;outline:1px dashed #888"></div>
<div id="overlay" style="position:absolute;left:200px;top:120px;width:140px;height:100px;background:#f00;color:#fff">DOM overlay</div>
<script>
const session = 'composition-check';
const anchor = document.getElementById('anchor');
const invoke = (command, args) => window.__TAURI_INTERNALS__.invoke(command, args);
let color = 0x00c800;
// What the app's tracker sends: the element's rectangle in CSS pixels and the page's ratio.
async function place() {
  const r = anchor.getBoundingClientRect();
  const state = await invoke('native_terminal_surface_place', {session, anchor: {x: r.x, y: r.y, width: r.width, height: r.height, dpr: devicePixelRatio}, background: color});
  return `anchor=[${[r.x, r.y, r.width, r.height].map(v => v.toFixed(1)).join(', ')}] ${JSON.stringify(state)}`;
}
const commands = {
  create: place,
  destroy: () => invoke('native_terminal_surface_remove', {session}),
  anchor: (x, y, w, h) => { Object.assign(anchor.style, {left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`}); return place(); },
  color: hex => { color = parseInt(hex, 16); },
  state: async () => JSON.stringify(await invoke('native_terminal_surface_state', {session})),
  probe: async () => JSON.stringify(await invoke('native_terminal_probe')),
};
const answer = body => fetch('/done', {method: 'POST', body});
(async () => {
  await answer('READY');
  for (;;) {
    const [name, ...args] = (await (await fetch('/next')).text()).split(' ');
    try { await answer(`DONE ${name} ${await commands[name](...args) ?? ''}`); } catch (error) { await answer(`ERR ${name} ${error}`); }
  }
})();
</script></body></html>
