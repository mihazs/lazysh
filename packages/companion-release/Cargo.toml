[package]
name = "lazysh-companion-release"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Verified companion release resolution and bounded download shared by the agent and the client"

[features]
# Local endpoint and CA override for tests. Never enabled in a shipped build.
test-endpoint = []
# In-process fake HTTPS release server with fault injection.
test-support = ["test-endpoint", "dep:axum", "dep:futures-util", "dep:hyper-util", "dep:rcgen", "dep:rustls", "dep:tokio", "dep:tokio-rustls"]

[dependencies]
axum = { version = "0.8.9", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
hyper-util = { version = "0.1", features = ["http1", "server-auto", "service", "tokio"], optional = true }
lazysh-common = { path = "../common" }
rcgen = { version = "0.14", optional = true }
bytes = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
