[package]
name = "lazysh-common"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Shared private storage and bounded service primitives"

[features]
service = ["dep:axum", "dep:hyper-util", "dep:tokio", "secrets"]
secrets = ["dep:zeroize"]
test-support = []
url = ["dep:url"]

[dependencies]
url = { version = "2", optional = true }
zeroize = { version = "1", optional = true }
axum = { version = "0.8.9", optional = true }
hyper-util = { version = "0.1", features = ["http1", "server-auto", "service", "tokio"], optional = true }
tokio = { version = "1", features = ["net", "rt", "signal", "sync", "time", "macros"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
