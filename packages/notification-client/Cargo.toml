[package]
name = "lazysh-notification-client"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Shared bounded webhook protocol and private HTTPS capability client"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lazysh-common = { path = "../common", features = ["secrets", "url"] }
rand = "0.10"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["time"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
