[package]
name = "lazysh-terminal-renderer-wgpu"
version = "0.0.0"
edition = "2021"
description = "wgpu implementation of the lazysh Terminal Renderer API: glyph atlas, dirty-row batching, event-driven frames (#1324)"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.96"

# Nested workspace beside the runtime crate, with its own lock file for its own tests: the runtime builds
# libghostty-vt with Zig, and wgpu must not reach the runtime crate's lock file or the integrity-checked
# Ghostty sources. The app depends on this crate by path behind its optional `native-terminal` feature
# (#2201), so the root Cargo.lock pins wgpu a second time: bump both lock files together. Nothing in the
# app calls it yet (the Android surface is #1327).
[workspace]

[dependencies]
lazysh-terminal-runtime = { path = "../terminal-runtime" }
# "counters": LiveResources reads the driver layer's own resource counts (a handful of atomic adds per allocation).
wgpu = { version = "30", default-features = false, features = ["wgsl", "counters"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# Shaping (GSUB/GPOS), unhinted rasterization and color bitmaps/layers in one pure-Rust crate: no C
# toolchain on the Android and iOS builds (#1325, docs/architecture/native-rendering.md).
swash = { version = "0.2", default-features = false, features = ["std", "scale", "render"] }
term-font = "0.1.3"

# Backends per platform (the policy in src/adapter.rs ranks them): Vulkan everywhere but Apple, with
# OpenGL ES as the Android and Linux fallback, Metal on Apple, Direct3D 12 on Windows.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["gles"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12"] }

[dev-dependencies]
# Goldens only: already in the lock through the runtime crate.
png = "0.17"

[profile.release]
debug = false
