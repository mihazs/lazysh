[package]
name = "tauri-plugin-lazysh-vault"
license.workspace = true
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-lazysh-vault"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tokio = { version = "1", features = ["sync", "macros", "rt"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSNotification", "NSOperation", "NSGeometry", "block2"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LAPublicDefines"] }

block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSButton", "NSControl", "NSTextField", "NSColor", "NSBezierPath", "NSWorkspace"] }
