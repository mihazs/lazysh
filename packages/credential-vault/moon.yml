language: rust
layer: library
stack: systems
tags: [cargo]
tasks:
  test-resume:
    type: test
    script: xcodebuild -project ../../apps/client/src-tauri/gen/apple/lazysh.xcodeproj -scheme LazyshResumeTests -destination "platform=iOS Simulator,id=$APPLE_STATUS_SIMULATOR_ID" -resultBundlePath ../../apps/client/src-tauri/gen/apple/resume-tests.xcresult -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 test CODE_SIGNING_ALLOWED=NO
    options: {os: macos}
