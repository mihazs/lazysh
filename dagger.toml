# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

[modules]

[modules.typescript-sdk]
source = "github.com/dagger/typescript-sdk@v1.0.6"

[sdks.typescript]
module = "typescript-sdk"

[modules.ci]
source = ".dagger/modules/ci"
main = true

[sdks.typescript.scopes.".dagger/modules/ci"]
is-module = true
name = "ci"
