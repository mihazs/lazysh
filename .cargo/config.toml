[env]
# Distributable CPU binaries must not inherit the build machine's instruction set.
GGML_NATIVE = "OFF"
GGML_SSE42 = "OFF"
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_BMI2 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"

# wry splices this into the generated Android RustWebView, which cannot be subclassed: the terminal-only private
# keyboard mode shapes the keyboard's EditorInfo here (apps/client/src-tauri/gen/android .../PrivateKeyboardPlugin.kt).
WRY_RUSTWEBVIEW_CLASS_EXTENSION = 'override fun onCreateInputConnection(outAttrs: android.view.inputmethod.EditorInfo): android.view.inputmethod.InputConnection? = PrivateKeyboard.shape(super.onCreateInputConnection(outAttrs), outAttrs)'
