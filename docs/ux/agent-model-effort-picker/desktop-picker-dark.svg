<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='640' viewBox='0 0 1000 640' font-family='Inter, system-ui, sans-serif' role='img' aria-label='Desktop: model and effort popover'><title>Desktop: model and effort popover</title><rect x='0' y='0' width='1000' height='640' rx='0' fill='#121418'/><rect x='0' y='0' width='1000' height='56' rx='0' fill='#121418'/><circle cx='22' cy='28' r='6' fill='#7fd69a'/><text x='38' y='24' font-size='15' font-weight='600' text-anchor='start' fill='#e7e9ec'>Claude Code · lazysh</text><text x='38' y='43' font-size='12' font-weight='400' text-anchor='start' fill='#a2a8b0'>Done · Sonnet 4.6 · 58% left</text><line x1='0' y1='56' x2='1000' y2='56' stroke='#343943'/><text x='180' y='90' font-size='15' font-weight='400' text-anchor='start' fill='#e7e9ec'>The tests pass. I updated the parser and added a regression case.</text><rect x='180' y='520' width='640' height='96' rx='24' fill='#1e2127'/><text x='196' y='550' font-size='15' font-weight='400' text-anchor='start' fill='#a2a8b0'>Ask the agent</text><circle cx='206' cy='590' r='16' fill='#262a31'/><text x='206' y='595' font-size='16' font-weight='500' text-anchor='middle' fill='#e7e9ec'>+</text><rect x='230' y='574' width='151' height='32' rx='16' fill='#1e2127'/><text x='242' y='595' font-size='13' font-weight='500' text-anchor='start' fill='#e7e9ec'>Sonnet 4.6 · High</text><path d='M365 587 l4 4 l4 -4' stroke='#e7e9ec' fill='none' stroke-width='1.6'/><circle cx='792' cy='590' r='18' fill='#7aa6ff'/><path d='M792 598 v-15 m-6 6 l6 -6 l6 6' stroke='#0b1220' stroke-width='2' fill='none'/><rect x='222' y='124' width='340' height='384' rx='14' fill='#00000099'/><rect x='220' y='120' width='340' height='384' rx='14' fill='#262a31' stroke='#343943'/><text x='240' y='150' font-size='13' font-weight='600' text-anchor='start' fill='#a2a8b0'>Model</text><rect x='232' y='164' width='316' height='52' rx='12' fill='#1e2127'/><path d='M520 190 l5 5 l10 -11' stroke='#7aa6ff' stroke-width='2.2' fill='none'/><text x='244' y='186' font-size='15' font-weight='600' text-anchor='start' fill='#e7e9ec'>Sonnet 4.6</text><text x='244' y='205' font-size='13' font-weight='400' text-anchor='start' fill='#a2a8b0'>Fast and capable for everyday coding</text><text x='244' y='242' font-size='15' font-weight='600' text-anchor='start' fill='#e7e9ec'>Opus 4.6</text><text x='244' y='261' font-size='13' font-weight='400' text-anchor='start' fill='#a2a8b0'>Most capable, for hard problems</text><text x='244' y='298' font-size='15' font-weight='600' text-anchor='start' fill='#e7e9ec'>Haiku 4.5</text><text x='244' y='317' font-size='13' font-weight='400' text-anchor='start' fill='#a2a8b0'>Fastest, for quick answers</text><text x='244' y='358' font-size='15' font-weight='500' text-anchor='start' fill='#7aa6ff'>More models</text><path d='M524 348 l6 6 l-6 6' stroke='#a2a8b0' stroke-width='1.8' fill='none'/><text x='240' y='396' font-size='13' font-weight='600' text-anchor='start' fill='#a2a8b0'>Effort</text><rect x='240' y='408' width='300' height='44' rx='22' fill='#1e2127'/><text x='277.5' y='435' font-size='14' font-weight='400' text-anchor='middle' fill='#a2a8b0'>Low</text><text x='352.5' y='435' font-size='14' font-weight='400' text-anchor='middle' fill='#a2a8b0'>Medium</text><rect x='393.0' y='411' width='69.0' height='38' rx='19' fill='#262a31' stroke='#343943'/><text x='427.5' y='435' font-size='14' font-weight='600' text-anchor='middle' fill='#e7e9ec'>High</text><text x='502.5' y='435' font-size='14' font-weight='400' text-anchor='middle' fill='#a2a8b0'>Max</text><text x='240' y='474' font-size='12' font-weight='400' text-anchor='start' fill='#a2a8b0'>Applies to your next message.</text><text x='584' y='160' font-size='12' font-weight='400' text-anchor='start' fill='#a2a8b0'>Opens above the chip. Enter or Space opens;</text><text x='584' y='178' font-size='12' font-weight='400' text-anchor='start' fill='#a2a8b0'>Up/Down move, Left/Right set effort, Esc closes.</text></svg>
