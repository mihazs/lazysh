<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='640' viewBox='0 0 1000 640' font-family='Inter, system-ui, sans-serif' role='img' aria-label='Desktop: model and effort popover'><title>Desktop: model and effort popover</title><rect x='0' y='0' width='1000' height='640' rx='0' fill='#fbfaf7'/><rect x='0' y='0' width='1000' height='56' rx='0' fill='#fbfaf7'/><circle cx='22' cy='28' r='6' fill='#1f7a3a'/><text x='38' y='24' font-size='15' font-weight='600' text-anchor='start' fill='#1d1f22'>Claude Code · lazysh</text><text x='38' y='43' font-size='12' font-weight='400' text-anchor='start' fill='#5f646b'>Done · Sonnet 4.6 · 58% left</text><line x1='0' y1='56' x2='1000' y2='56' stroke='#d9d6cf'/><text x='180' y='90' font-size='15' font-weight='400' text-anchor='start' fill='#1d1f22'>The tests pass. I updated the parser and added a regression case.</text><rect x='180' y='520' width='640' height='96' rx='24' fill='#efede8'/><text x='196' y='550' font-size='15' font-weight='400' text-anchor='start' fill='#5f646b'>Ask the agent</text><circle cx='206' cy='590' r='16' fill='#ffffff'/><text x='206' y='595' font-size='16' font-weight='500' text-anchor='middle' fill='#1d1f22'>+</text><rect x='230' y='574' width='151' height='32' rx='16' fill='#efede8'/><text x='242' y='595' font-size='13' font-weight='500' text-anchor='start' fill='#1d1f22'>Sonnet 4.6 · High</text><path d='M365 587 l4 4 l4 -4' stroke='#1d1f22' fill='none' stroke-width='1.6'/><circle cx='792' cy='590' r='18' fill='#2b63d9'/><path d='M792 598 v-15 m-6 6 l6 -6 l6 6' stroke='#ffffff' stroke-width='2' fill='none'/><rect x='222' y='124' width='340' height='384' rx='14' fill='#1d1f2259'/><rect x='220' y='120' width='340' height='384' rx='14' fill='#ffffff' stroke='#d9d6cf'/><text x='240' y='150' font-size='13' font-weight='600' text-anchor='start' fill='#5f646b'>Model</text><rect x='232' y='164' width='316' height='52' rx='12' fill='#efede8'/><path d='M520 190 l5 5 l10 -11' stroke='#2b63d9' stroke-width='2.2' fill='none'/><text x='244' y='186' font-size='15' font-weight='600' text-anchor='start' fill='#1d1f22'>Sonnet 4.6</text><text x='244' y='205' font-size='13' font-weight='400' text-anchor='start' fill='#5f646b'>Fast and capable for everyday coding</text><text x='244' y='242' font-size='15' font-weight='600' text-anchor='start' fill='#1d1f22'>Opus 4.6</text><text x='244' y='261' font-size='13' font-weight='400' text-anchor='start' fill='#5f646b'>Most capable, for hard problems</text><text x='244' y='298' font-size='15' font-weight='600' text-anchor='start' fill='#1d1f22'>Haiku 4.5</text><text x='244' y='317' font-size='13' font-weight='400' text-anchor='start' fill='#5f646b'>Fastest, for quick answers</text><text x='244' y='358' font-size='15' font-weight='500' text-anchor='start' fill='#2b63d9'>More models</text><path d='M524 348 l6 6 l-6 6' stroke='#5f646b' stroke-width='1.8' fill='none'/><text x='240' y='396' font-size='13' font-weight='600' text-anchor='start' fill='#5f646b'>Effort</text><rect x='240' y='408' width='300' height='44' rx='22' fill='#efede8'/><text x='277.5' y='435' font-size='14' font-weight='400' text-anchor='middle' fill='#5f646b'>Low</text><text x='352.5' y='435' font-size='14' font-weight='400' text-anchor='middle' fill='#5f646b'>Medium</text><rect x='393.0' y='411' width='69.0' height='38' rx='19' fill='#ffffff' stroke='#d9d6cf'/><text x='427.5' y='435' font-size='14' font-weight='600' text-anchor='middle' fill='#1d1f22'>High</text><text x='502.5' y='435' font-size='14' font-weight='400' text-anchor='middle' fill='#5f646b'>Max</text><text x='240' y='474' font-size='12' font-weight='400' text-anchor='start' fill='#5f646b'>Applies to your next message.</text><text x='584' y='160' font-size='12' font-weight='400' text-anchor='start' fill='#5f646b'>Opens above the chip. Enter or Space opens;</text><text x='584' y='178' font-size='12' font-weight='400' text-anchor='start' fill='#5f646b'>Up/Down move, Left/Right set effort, Esc closes.</text></svg>
