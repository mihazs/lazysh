[package]
name = "lazysh"
version = "0.1.0"
description = "Direct SSH and agent workspace"
edition = "2021"

[lib]
name = "lazysh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.1"
tokio = { version = "1", features = ["sync", "time", "io-util", "net", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
age = { version = "0.11.5", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
whisper-rs = { version = "0.16", default-features = false }
rand = "0.10"
tauri-plugin-lazysh-vault = { path = "../../../packages/credential-vault" }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
