[package]
name = "lazysh"
license.workspace = true
version.workspace = true
description = "Direct SSH and agent workspace"
edition = "2021"

[lib]
name = "lazysh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
fdroid = ["tauri-plugin-lazysh-push/fdroid"]
# Optional interop test harness; independent of Linux and Windows x86_64 product availability.
parakeet-acceptance = ["dep:lazysh-parakeet-runtime"]
# Android's Google build links the pinned prebuilt ONNX Runtime for local Parakeet. It is opt-in so the F-Droid recipe,
# which must compile every native library from source, keeps its Whisper-only graph.
parakeet-android = ["dep:lazysh-parakeet-runtime"]
# The native terminal core (libghostty-vt, built with Zig 0.16.0) and its wgpu renderer: off by default so no
# build needs Zig or compiles wgpu.
native-terminal = ["dep:lazysh-terminal-runtime", "dep:lazysh-terminal-renderer-wgpu", "dep:unicode-segmentation", "dep:unicode-width", "dep:gtk", "dep:gdk", "dep:wayland-client", "dep:wayland-backend", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-quartz-core", "dep:objc2-ui-kit", "dep:block2"]
# Owned emulator builds only: trusts one extra root for the loopback WebDAV fixture (see `sync.rs`). Never a product feature.
sync-tls-acceptance = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[test]]
name = "deep_link_manifest"
path = "../../../packages/deep-link-vendor/tests/manifest.rs"

[dependencies]
lazysh-account-usage = { path = "../../../packages/account-usage" }
tauri-plugin-lazysh-display-idle = { path = "../../../packages/display-idle" }
lazysh-common = { path = "../../../packages/common", features = ["url", "repository-review"] }
lazysh-companion-release = { path = "../../../packages/companion-release" }
lazysh-parakeet-runtime = { path = "../../../packages/parakeet-runtime", optional = true }
lazysh-et-transport = { path = "../../../packages/et-transport" }
lazysh-notification-client = { path = "../../../packages/notification-client" }
lazysh-terminal-runtime = { path = "../../../packages/terminal-runtime", optional = true }
lazysh-terminal-renderer-wgpu = { path = "../../../packages/terminal-renderer-wgpu", optional = true }
# The cells of composing (IME preedit) text in the renderer host; both are in the lock through other crates.
unicode-segmentation = { version = "1", optional = true }
unicode-width = { version = "0.2", optional = true }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.1"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "io-util", "net", "process", "rt-multi-thread", "macros", "fs"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
age = { version = "0.11.5", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
httparse = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
whisper-rs = { version = "0.16", default-features = false }
rand = "0.10"
tauri-plugin-lazysh-vault = { path = "../../../packages/credential-vault" }
tauri-plugin-lazysh-apple-speech = { path = "../../../packages/apple-speech" }
tauri-plugin-lazysh-apple-status = { path = "../../../packages/apple-status" }
tauri-plugin-lazysh-push = { path = "../../../packages/push-registration" }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"
tauri-plugin-deep-link = "=2.6.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
quircs = "=0.10.3"

# The Linux native terminal surface (a Wayland subsurface of GDK's toplevel, #1331): only with `native-terminal`.
# gtk and gdk are the versions tauri links; `client_system` wraps GDK's own `wl_display`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSAccessibility", "NSGraphics", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", optional = true, default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-foundation"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "block2", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", optional = true, default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CATransaction", "objc2-core-foundation"] }
objc2-ui-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "UIAccessibility", "UIApplication", "UIResponder", "UIScreen", "UIView", "UIWindow", "objc2-core-foundation", "objc2-quartz-core"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
gdk = { version = "0.18", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", features = ["client_system"], optional = true }

[target.'cfg(windows)'.dependencies]
dunce = "=1.0.5"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "android", target_os = "ios"))'.dependencies]
lazysh-mosh-transport = { path = "../../../packages/mosh-transport" }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
lazysh-account-usage = { path = "../../../packages/account-usage", features = ["collector"] }
portable-pty = { version = "0.9", path = "../../../packages/portable-pty-vendor", default-features = false }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# The JNI entry points that give the renderer host an Android surface (native_terminal_surface/android.rs).
jni = "0.21"
raw-window-handle = "0.6"

[target.'cfg(all(any(target_os = "linux", target_os = "windows"), target_arch = "x86_64"))'.dependencies]
lazysh-parakeet-runtime = { path = "../../../packages/parakeet-runtime" }

[dev-dependencies]
lazysh-common = { path = "../../../packages/common", features = ["test-support"] }
hound = "3.5"
tokio = { version = "1", features = ["test-util"] }
axum = "0.8.9"
lazysh-share = { path = "../../share-service" }
rcgen = "0.14"
tokio-rustls = "0.26"
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Only the Linux owned-OpenSSH agent board case writes companion state directly.
lazysh-agent = { path = "../../agent" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "android", target_os = "ios"))'.dev-dependencies]
lazysh-mosh-transport = { path = "../../../packages/mosh-transport", features = ["test-fixtures"] }
