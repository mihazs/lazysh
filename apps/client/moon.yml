language: typescript
layer: application
stack: frontend
dependsOn: [client-native]
fileGroups:
  webSources: ['src/**/*', 'public/**/*', 'index.html', 'vite.config.ts', 'tsconfig*.json']
tasks:
  dev:
    command: bun run dev
    preset: server
  dev-native:
    command: tauri dev
    preset: server
  # Uncached on purpose: vite.config.ts embeds the git HEAD and dirty state.
  build:
    type: build
    command: bun run build
    inputs: ['@group(webSources)']
    outputs: ['dist']
    options: {cache: false}
  check:
    type: test
    command: bun run check
    inputs: ['@group(webSources)']
    options: {cache: true}
  test:
    type: test
    command: bun run test
    inputs: ['@group(webSources)', 'vitest.config.ts']
    options: {cache: true}
  check-native-gui:
    type: test
    command: tsc --project tsconfig.native-gui.json
    inputs: ['native-e2e/**/*', 'tsconfig.native-gui.json', 'package.json']
    options: {cache: true}
  test-e2e:
    type: test
    command: bun run test:e2e
    options: &local {cache: false}
  test-install-browser:
    command: playwright install chromium
    options: *local
  test-native-gui:
    type: test
    script: bwrap --unshare-user --unshare-net --dev-bind / / -- vitest run --config vitest.native-gui.config.ts
    deps: [~:build-native, ~:check-native-gui]
    options: {os: linux, cache: false}
  # Appium + WebdriverIO suite for the Android app (ADR 0002). None of these is cached, and the device run never runs in
  # `moon ci` unless a workflow names it.
  setup-mobile-e2e:
    command: bun run mobile-e2e:setup
    options: *local
  check-mobile-e2e:
    type: test
    command: bun run mobile-e2e:check
    inputs: ['mobile-e2e/**/*', 'package.json']
    options: *local
  lint-mobile-e2e:
    type: test
    command: bun run mobile-e2e:lint
    inputs: ['mobile-e2e/**/*', 'package.json']
    options: *local
  test-mobile-e2e-unit:
    type: test
    command: bun run mobile-e2e:unit
    inputs: ['mobile-e2e/**/*', 'package.json']
    options: *local
  test-mobile-e2e:
    type: test
    command: bun run mobile-e2e
    deps: [~:setup-mobile-e2e, ~:check-mobile-e2e, ~:lint-mobile-e2e, ~:test-mobile-e2e-unit]
    options: {cache: false, runInCI: false}
  # The emulator job's run (checks.yml native-android-appium): it builds the APK itself, before the emulator boots, and the
  # client job already ran the static checks, so only the driver setup is a dependency.
  test-mobile-e2e-ci:
    type: test
    command: bun run mobile-e2e
    deps: [~:setup-mobile-e2e]
    options: {cache: false, runInCI: false}
  build-native:
    type: build
    command: tauri build --no-bundle
    options: *local
  # tauri android/ios builds. Inline env prefixes became env + envOverride because moon
  # lets the process environment win over task env otherwise.
  build-android:
    type: build
    command: tauri android build --target aarch64 --debug --apk --ci
    env: &androidBuildEnv {WHISPER_DONT_GENERATE_BINDINGS: '1', CMAKE_ANDROID_NDK: '${NDK_HOME}'}
    options: &envLocal {cache: false, envOverride: true}
  build-android-emulator:
    type: build
    command: tauri android build --target x86_64 --debug --apk --ci
    env: *androidBuildEnv
    options: *envLocal
  build-android-fdroid:
    type: build
    command: tauri android build --target aarch64 --apk --ci --features fdroid
    env: *androidBuildEnv
    options: *envLocal
  build-android-fdroid-emulator:
    type: build
    command: tauri android build --target x86_64 --debug --apk --ci --features fdroid
    env: *androidBuildEnv
    options: *envLocal
  test-android-push-artifact:
    type: test
    command: bun test ../../tests/android-push-artifact.test.ts
    options: *local
  test-android-fdroid:
    type: test
    script: |-
      LAZYSH_ANDROID_PUSH_VARIANT=fdroid bun test ../../tests/android-push-artifact.test.ts && src-tauri/gen/android/gradlew -p src-tauri/gen/android :tauri-plugin-lazysh-push:testDebugUnitTest :app:connectedUniversalDebugAndroidTest -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildX86_64Debug -PlazyshFdroidAcceptance=true -Pandroid.testInstrumentationRunnerArguments.class=app.lazysh.client.NativeWorkspaceTest#pushRegistrationMatchesPackagedNativeProvider,app.lazysh.client.NativeWorkspaceTest#webViewNetworkSignalFollowsAndroidConnectivity,app.lazysh.client.UnifiedPushEnrollmentTest --no-daemon
    deps: [~:build-android-fdroid-emulator]
    options: *local
  test-android-ntfy:
    type: test
    script: cargo test -p lazysh-notifications --locked --lib --no-run && LAZYSH_ANDROID_NTFY=1 bun test ../../tests/android-ntfy.test.ts
    deps: [~:build-android-fdroid-emulator]
    options: *local
  test-android:
    type: test
    script: |-
      src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:connectedUniversalDebugAndroidTest -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildX86_64Debug -Pandroid.testInstrumentationRunnerArguments.notClass=app.lazysh.client.NativeWorkspaceTest#themeLinksUseFirstActivityAndWarmIntentWithExplicitReview,app.lazysh.client.NativeWorkspaceTest#ownedOpenSshConnectsThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedSshSurvivesDeniedNotificationPermission,app.lazysh.client.NativeWorkspaceTest#ownedRecordedConversationsThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedSshImeTransactionsThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedSshDpadPanThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedGuardedHerdrChatThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedSharedHerdrNavigationThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedMoshDefaultHerdrChatThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedCompanionInstallsThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedMoshSurvivesBusyBackgroundThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedMoshUploadsLargeClipboardImageThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedQrCameraRequiresPermissionAndExplicitPreview,app.lazysh.client.NativeWorkspaceTest#ownedTmuxThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedSshPasswordLoginThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedSshEncryptedKeyLoginThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedSshRotatedHostKeyRefusedThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedSshBastionRouteThroughRealUi,app.lazysh.client.NativeWorkspaceTest#ownedSshAgentForwardingThroughRealUi,app.lazysh.client.NativeBiometricVaultTest
    deps: [~:test-android-theme-links]
    options: *local
  test-android-theme-links:
    type: test
    script: |-
      src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:connectedUniversalDebugAndroidTest -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildX86_64Debug -PlazyshThemeLinkAcceptance=true -Pandroid.testInstrumentationRunnerArguments.class=app.lazysh.client.NativeWorkspaceTest#themeLinksUseFirstActivityAndWarmIntentWithExplicitReview
    deps: [~:build-android-emulator]
    options: *local
  test-android-ssh:
    type: test
    command: bun test ../../tests/android-ssh.test.ts ../../tests/android-ssh-host.test.ts
    env: {LAZYSH_ANDROID_UI_SSH: '1', LAZYSH_ANDROID_UI_RECORDED: '1', LAZYSH_ANDROID_UI_ATTACHMENTS: '1', LAZYSH_ANDROID_UI_IME: '1', LAZYSH_ANDROID_UI_DPAD: '1'}
    deps: [~:test-android]
    options: *envLocal
  test-android-ssh-parity:
    type: test
    command: bun test ../../tests/android-ssh-parity.test.ts
    env: {LAZYSH_ANDROID_UI_SSH_PARITY: '1'}
    deps: [~:build-android-emulator]
    options: *envLocal
  test-android-tmux:
    type: test
    command: bun test ../../tests/android-tmux.test.ts ../../tests/android-ssh-host.test.ts --test-name-pattern
    args: ['^(owned namespaced tmux survives a real SSH detach and reattaches the original panes|owned tmux teardown detaches a running control-mode client through the server before retiring SSH|owned tmux teardown retires a stalled owned client outside the SSH tree so the server still exits cleanly|actual Android tmux discovery, window controls, Jump To and detach keep the original remote panes)$']
    env: {LAZYSH_ANDROID_UI_TMUX: '1'}
    deps: [~:build-android-emulator]
    options: *envLocal
  test-android-herdr-navigation:
    type: test
    command: bun test ../../tests/android-ssh-host.test.ts --test-name-pattern
    args: ['^actual Android two-display stock Herdr navigation keeps the selected display and sends zero receiver bytes$']
    env: {LAZYSH_ANDROID_UI_HERDR_NAVIGATION: '1'}
    deps: [~:build-android-emulator]
    options: *envLocal
  test-android-qr:
    type: test
    command: bun test ../../tests/android-qr.test.ts
    env: {LAZYSH_ANDROID_UI_QR: '1'}
    deps: [~:build-android-emulator]
    options: *envLocal
  test-android-biometric:
    type: test
    command: bun test ../../tests/android-biometric.test.ts
    env: {LAZYSH_ANDROID_UI_BIOMETRIC: '1'}
    deps: [~:build-android-emulator]
    options: *envLocal
  init-ios:
    script: cd src-tauri && tauri ios init --ci
    options: &macLocal {os: macos, cache: false}
  build-ios:
    type: build
    script: cd src-tauri && tauri ios build --target aarch64-sim --debug --ci
    deps: [~:init-ios]
    options: *macLocal
  test-ios-workspace:
    type: test
    script: |-
      xcodebuild -project src-tauri/gen/apple/lazysh.xcodeproj -scheme LazyshWorkspaceUITests -configuration debug -destination "platform=iOS Simulator,id=$APPLE_STATUS_SIMULATOR_ID" -parallel-testing-enabled NO -resultBundlePath src-tauri/gen/apple/workspace-ui.xcresult -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 test CODE_SIGNING_ALLOWED=NO
    options: *macLocal
