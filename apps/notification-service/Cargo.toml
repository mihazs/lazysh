[package]
name = "lazysh-notifications"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Opt-in authenticated single-destination webhook relay"

[features]
default = []
test-support = []

[dependencies]
lazysh-notification-client = { path = "../../packages/notification-client" }
lazysh-common = { path = "../../packages/common", features = ["service", "url"] }
axum = "0.8.9"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["process", "io-util"] }
hyper-util = { version = "0.1", features = ["http1", "server-auto", "service", "tokio"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
