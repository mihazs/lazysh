language: rust
layer: tool
stack: backend
tags: [cargo, cargo-binary, companion]
tasks:
  # The update tests drive the real binary built with the local release-server seam; `build` never has it.
  check-rust: {args: [--features, update-test-endpoint]}
  test-rust: {args: [--features, update-test-endpoint]}
  lint: {args: [clippy, --locked, --all-targets, --features, update-test-endpoint, --, -D, warnings], options: {mergeArgs: replace}}
  test-storage:
    type: test
    command: 'cargo test --locked --lib --test storage_wal'
  test-hooks:
    type: test
    command: 'bun test ./hooks'
    inputs: ['hooks/**/*']
    # The hook tests drive the debug binary that `cargo test` builds.
    deps: ['~:test-rust']
