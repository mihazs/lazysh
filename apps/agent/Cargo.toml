[package]
name = "lazysh-agent"
license.workspace = true
version = "0.1.0"
edition = "2021"
description = "Local-only lifecycle event companion for lazysh"

[dependencies]
lazysh-common = { path = "../../packages/common" }
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ctrlc = { version = "3.5", features = ["termination"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
lazysh-common = { path = "../../packages/common", features = ["test-support"] }
rusqlite = { version = "0.41", features = ["trace"] }
