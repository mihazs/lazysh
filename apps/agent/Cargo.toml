[package]
name = "lazysh-agent"
license.workspace = true
version.workspace = true
edition = "2021"
description = "Lifecycle event companion with explicit opt-in bound relay publishing"

[features]
storage-observation = []
# Lets `update` talk to a local HTTPS release server named by LAZYSH_UPDATE_TEST_ENDPOINT. Tests only.
update-test-endpoint = ["lazysh-companion-release/test-endpoint"]

# These drive the real binary built with the local endpoint seam: `cargo test --features update-test-endpoint`.
[[test]]
name = "update"
required-features = ["update-test-endpoint"]

[[test]]
name = "update_install"
required-features = ["update-test-endpoint"]

[dependencies]
lazysh-account-usage = { path = "../../packages/account-usage", features = ["collector"] }
lazysh-companion-release = { path = "../../packages/companion-release" }
lazysh-notification-client = { path = "../../packages/notification-client" }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "io-std", "io-util"] }
lazysh-common = { path = "../../packages/common" }
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ctrlc = { version = "3.5", features = ["termination"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
lazysh-common = { path = "../../packages/common", features = ["test-support"] }
rusqlite = { version = "0.41", features = ["trace"] }

[target.'cfg(unix)'.dev-dependencies]
lazysh-companion-release = { path = "../../packages/companion-release", features = ["test-support"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
lazysh-notifications = { path = "../notification-service", features = ["test-support"] }
axum = "0.8.9"
hyper-util = { version = "0.1", features = ["http1", "server-auto", "service", "tokio"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
