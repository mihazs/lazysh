[package]
name = "lazysh-transcription"
license.workspace = true
version.workspace = true
edition = "2021"
description = "Optional authenticated and quota-limited transcription relay for lazysh"

[dependencies]
lazysh-common = { path = "../../packages/common", features = ["service"] }
axum = "0.8.9"
clap = { version = "4.6", features = ["derive"] }
hyper-util = { version = "0.1", features = ["http1", "server-auto", "service", "tokio"] }
rand = "0.10"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "multipart"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
