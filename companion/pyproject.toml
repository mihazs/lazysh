[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazysh-agent"
version = "0.1.0"
description = "Local-only lifecycle event companion for lazysh"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lazysh-agent = "lazysh_agent:main"

[tool.setuptools]
py-modules = ["lazysh_agent"]
