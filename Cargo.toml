[workspace]
members = ["apps/client/src-tauri", "apps/agent", "apps/share-service", "apps/transcription-service", "packages/credential-vault", "packages/mosh-transport", "packages/et-transport", "packages/apple-speech", "packages/apple-status", "packages/push-registration", "packages/parakeet-runtime", "packages/common", "packages/display-idle"]
resolver = "2"
exclude = ["packages/portable-pty-vendor", "packages/deep-link-vendor"]

[patch.crates-io]
tauri-plugin-deep-link = { path = "packages/deep-link-vendor" }

[workspace.package]
license = "GPL-3.0-or-later"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
